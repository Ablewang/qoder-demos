nt-size="22" font-weight="600" paint-order="stroke" stroke="#f6f4ed" stroke-width="5">镜井维护站</text><text x="718" y="417" font-size="15" fill="#63777b">C32 / 镜井台地</text></g></g><text x="100" y="1243" font-size="14" text-anchor="middle" fill="#63777b">0 km</text><text x="240" y="1243" font-size="14" text-anchor="middle" fill="#63777b">50 km</text><text x="380" y="1243" font-size="14" text-anchor="middle" fill="#63777b">100 km</text><text x="520" y="1243" font-size="14" text-anchor="middle" fill="#63777b">150 km</text><text x="660" y="1243" font-size="14" text-anchor="middle" fill="#63777b">200 km</text><text x="800" y="1243" font-size="14" text-anchor="middle" fill="#63777b">250 km</text><text x="940" y="1243" font-size="14" text-anchor="middle" fill="#63777b">300 km</text><text x="1080" y="1243" font-size="14" text-anchor="middle" fill="#63777b">350 km</text><text x="1220" y="1243" font-size="14" text-anchor="middle" fill="#63777b">400 km</text><text x="85" y="210" font-size="14" text-anchor="end" fill="#63777b">0 km</text><text x="85" y="350" font-size="14" text-anchor="end" fill="#63777b">50 km</text><text x="85" y="490" font-size="14" text-anchor="end" fill="#63777b">100 km</text><text x="85" y="630" font-size="14" text-anchor="end" fill="#63777b">150 km</text><text x="85" y="770" font-size="14" text-anchor="end" fill="#63777b">200 km</text><text x="85" y="910" font-size="14" text-anchor="end" fill="#63777b">250 km</text><text x="85" y="1050" font-size="14" text-anchor="end" fill="#63777b">300 km</text><text x="85" y="1190" font-size="14" text-anchor="end" fill="#63777b">350 km</text><line x1="100" y1="1287" x2="380" y2="1287" stroke="#253e44" stroke-width="5"/><text x="240" y="1320" font-size="17" text-anchor="middle">100 km · 两个网格</text><text x="1350" y="220" font-size="22" >三级尺度不能混用</text><text x="1350" y="261" font-size="22" >全境：360万 × 300万 km</text><text x="1350" y="302" font-size="22" >六区：430 × 360 km</text><text x="1350" y="343" font-size="22" >场内：平面 / 剖面关系图</text><text x="1350" y="426" font-size="20" >六区陆地约12万 km²</text><text x="1350" y="464" font-size="20" >大陆陆地3.2万亿 km²</text><text x="1350" y="502" font-size="20" >六区仅占约1 / 2667万</text><text x="1350" y="540" font-size="20" >面积比例：0.00000375%</text><rect x="1350" y="605" width="460" height="194" fill="#e9eef0" stroke="#aab6b5"/><line x1="1375" y1="659" x2="1780" y2="659" stroke="#73876a" stroke-width="3"/><circle cx="1740" cy="659" r="0.025" fill="#b16655"/><text x="1375" y="633" font-size="17" >全境等比例时，六区比一个像素还小</text><circle cx="1740" cy="739" r="9" fill="#475f88"/><text x="1375" y="743" font-size="17" >宏观蓝点只供定位，绝不是面积块</text><text x="1350" y="849" font-size="17" >本图统一 x/y 公里比例。</text><text x="1350" y="880" font-size="17" >包络矩形154800 km²；</text><text x="1350" y="911" font-size="17" >南部海湾扣除后约119970 km²，</text><text x="1350" y="942" font-size="17" >满足“约12万”尺度约束。</text><text x="1350" y="973" font-size="17" ></text><text x="1350" y="1004" font-size="17" >浅色带表示地貌，不是六个国家。</text><text x="1350" y="1035" font-size="17" >内部边界与城镇坐标尚未实测；</text><text x="1350" y="1066" font-size="17" >本图是满足设定的示意布局，</text><text x="1350" y="1097" font-size="17" >不是为未测地方补造精确地籍。</text><text x="1350" y="1178" font-size="17" >五条线的图上折线路长</text><text x="1350" y="1209" font-size="17" >按90 / 140 / 100 / 120 / 70构造；</text><text x="1350" y="1240" font-size="17" >季节改道、停桥仍按正文执行。</text><text x="1350" y="1271" font-size="17" >六区沿途详图见08—13。</text><line x1="65" y1="1510" x2="1835" y2="1510" stroke="#aab6b5"/><text x="65" y="1544" font-size="16" >与04的读法不同：04只看方位与工程点，06用于核对尺度与主干路长。实际道路弯曲、海湾细部及城镇局部坐标仍属绘图布局。</text><text x="65" y="1571" font-size="16" >依据：全境地理的银河尺度、初渡地形、空间关系与旧驮道设定；路长不是直线距离；旧驮道全100 km，短检修路仅绕谷口装卸口。</text></svg>