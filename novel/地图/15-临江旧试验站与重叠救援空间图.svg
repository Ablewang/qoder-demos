<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1500" viewBox="0 0 1900 1500" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#73876a" opacity=".14"/></pattern></defs><rect x="0" y="0" width="1900" height="1500" fill="#f6f4ed"/><text x="65" y="64" font-size="34" font-weight="700">临江 · 旧试验站与局部重叠救援场</text><text x="65" y="106" font-size="18" fill="#63777b">月二高潮二 / 窄段救援与失证不可兼得；本图是空间构图，不是具体战斗分镜或真实建筑施工图</text><text x="1825" y="63" font-size="26" text-anchor="end" fill="#a17949">15</text><line x1="65" y1="127" x2="1835" y2="127" stroke="#aab6b5"/> <rect x="85" y="170" width="1730" height="700" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="110" y="205" font-size="22" font-weight="600">临街受控外围 / 官方危区处置</text><rect x="95" y="775" width="1710" height="75" fill="#f6f4ed" stroke="#aab6b5"/><text x="125" y="825" font-size="20" >对外撤回走廊 · 搬运、设备与护送共同完成</text><g class="place" data-key="B01" role="button" tabindex="0"><title>入场备案 / 撤回点 程野与设备保护</title><rect x="130" y="280" width="340" height="145" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M130 280l170 -24l170 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="300" y="323" font-size="21" text-anchor="middle" font-weight="600">入场备案 / 撤回点</text><text x="300" y="354" font-size="15" text-anchor="middle" fill="#63777b">程野与设备保护</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>观测 / 原始监测 沈遥独立比对与留存</title><rect x="720" y="280" width="360" height="145" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M720 280l180 -24l180 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="900" y="323" font-size="21" text-anchor="middle" font-weight="600">观测 / 原始监测</text><text x="900" y="354" font-size="15" text-anchor="middle" fill="#63777b">沈遥独立比对与留存</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>原资料转移区 郑崇网络转移，不全保住</title><rect x="1320" y="280" width="355" height="145" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1320 280l177.5 -24l177.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1497.5" y="323" font-size="21" text-anchor="middle" font-weight="600">原资料转移区</text><text x="1497.5" y="354" font-size="15" text-anchor="middle" fill="#63777b">郑崇网络转移，不全保住</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>可救受害者所在窄段 苏木一至二阶有限保护</title><rect x="430" y="575" width="470" height="150" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M430 575l235 -24l235 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="665" y="618" font-size="21" text-anchor="middle" font-weight="600">可救受害者所在窄段</text><text x="665" y="649" font-size="15" text-anchor="middle" fill="#63777b">苏木一至二阶有限保护</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>失稳 / 污染载体区 官方处理，非全清除</title><rect x="1195" y="575" width="480" height="150" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1195 575l240 -24l240 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1435" y="618" font-size="21" text-anchor="middle" font-weight="600">失稳 / 污染载体区</text><text x="1435" y="649" font-size="15" text-anchor="middle" fill="#63777b">官方处理，非全清除</text></g></g><g class="risk-layer"><rect x="1175" y="485" width="530" height="265" rx="30" fill="#b16655" opacity=".09" stroke="#b16655" stroke-dasharray="9 8"/><path d="M570 510Q700 420 825 505T1150 550" fill="none" stroke="#b16655" stroke-width="5" stroke-dasharray="18 12"/></g><g class="route-layer"><path d="M300 425V810H580V725" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M650 725V810H900V425" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M470 350H720" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1490 425V488" fill="none" stroke="#b16655" stroke-width="3"  marker-end="url(#end)"/></g><text x="1210" y="464" font-size="17" fill="#b16655">材料线仍受威胁；不补成两线全胜</text><text x="95" y="937" font-size="25" font-weight="600">旧站剖面：原设备 / 局部异常 / 现实医疗转运</text><line x1="110" y1="1137" x2="1765" y2="1137" stroke="#7b9389" stroke-width="4"/><g class="place" data-key="B01" role="button" tabindex="0"><title>现场载体与观测 有具体支撑，不能凭空续命</title><rect x="135" y="992" width="450" height="115" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="360" cy="1049.5" r="34.5" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="360" y="1035" font-size="21" text-anchor="middle" font-weight="600">现场载体与观测</text><text x="360" y="1066" font-size="15" text-anchor="middle" fill="#63777b">有具体支撑，不能凭空续命</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>短时保护与转移 不能永久稳定整个城区</title><rect x="720" y="992" width="450" height="115" rx="24" fill="#e9eef0" stroke="#548398" stroke-width="2"/><line x1="735" y1="1047.2" x2="1155" y2="1047.2" stroke="#548398" stroke-dasharray="12 9"/><g class="node-label"><text x="945" y="1035" font-size="21" text-anchor="middle" font-weight="600">短时保护与转移</text><text x="945" y="1066" font-size="15" text-anchor="middle" fill="#63777b">不能永久稳定整个城区</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>医院交接 / 救治 保存原件、恢复再复核</title><rect x="1300" y="992" width="450" height="115" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1300 992l225 -24l225 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1525" y="1035" font-size="21" text-anchor="middle" font-weight="600">医院交接 / 救治</text><text x="1525" y="1066" font-size="15" text-anchor="middle" fill="#63777b">保存原件、恢复再复核</text></g></g><g class="route-layer"><path d="M585 1050H720" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1170 1050H1300" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><text x="125" y="1204" font-size="20" >胜利：部分可恢复意识转移、监测原件保住。</text><text x="125" y="1239" font-size="20" >不可逆：部分受害者无法恢复，父亲部分材料、城区完好状态失去。</text><text x="125" y="1274" font-size="20" >顾衡另外组织真实救援；不因对手犯罪把救援成效全部抹掉。</text><line x1="65" y1="1395" x2="1835" y2="1395" stroke="#aab6b5"/><text x="65" y="1429" font-size="16" >来源：七个大型高潮之临江旧站救援；安防片段是第三方事故保全材料，旧站未保存十三年完整录像。</text><text x="65" y="1456" font-size="16" >站内各功能块无已定尺寸，不新增地下逃生隧道、万能监控或主角分身运证物。</text></svg>