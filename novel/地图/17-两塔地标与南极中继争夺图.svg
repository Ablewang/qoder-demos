<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1700" viewBox="0 0 1900 1700" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#73876a" opacity=".14"/></pattern></defs><rect x="0" y="0" width="1900" height="1700" fill="#f6f4ed"/><text x="65" y="64" font-size="34" font-weight="700">蓝星 · 两塔地标与南极中继争夺空间</text><text x="65" y="106" font-size="18" fill="#63777b">太平洋塔用于受控测试与奖励登记；南极塔用于骨干回传与时序，不能因外观相近而合并功能</text><text x="1825" y="63" font-size="26" text-anchor="end" fill="#a17949">17</text><line x1="65" y1="127" x2="1835" y2="127" stroke="#aab6b5"/> <rect x="85" y="175" width="825" height="665" fill="#e9eef0" stroke="#aab6b5"/><rect x="990" y="175" width="825" height="665" fill="#e9eef0" stroke="#aab6b5"/><text x="110" y="216" font-size="24" font-weight="600">太平洋通天塔人工岛 · 公众区与塔体区</text><text x="1015" y="216" font-size="24" font-weight="600">南极连接枢纽 · 地表转运与冰下核心</text><path d="M185 550Q90 435 290 310Q590 255 785 405L810 640Q510 760 235 650Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><rect x="235" y="575" width="390" height="30" fill="#f6f4ed" stroke="#aab6b5"/><text x="430" y="598" font-size="16" text-anchor="middle">预约入岛航线 / 机场跑道</text><path d="M500 405L570 250L640 405V518H500Z" fill="#f6f4ed" stroke="#475f88" stroke-width="3"/><path d="M525 405H615M540 360H600M555 315H585" stroke="#475f88" fill="none"/><text x="570" y="548" font-size="17" text-anchor="middle">受控塔体 / 不任意入核心</text><g class="place" data-key="B04" role="button" tabindex="0"><title>公众预约 / 预检 地方可以先远程预检</title><rect x="140" y="685" width="320" height="115" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M140 685l160 -24l160 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="300" y="728" font-size="21" text-anchor="middle" font-weight="600">公众预约 / 预检</text><text x="300" y="759" font-size="15" text-anchor="middle" fill="#63777b">地方可以先远程预检</text></g></g><g class="place" data-key="B04" role="button" tabindex="0"><title>检测 / 奖励登记 有来源、配额与验收</title><rect x="515" y="685" width="320" height="115" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M515 685l160 -24l160 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="675" y="728" font-size="21" text-anchor="middle" font-weight="600">检测 / 奖励登记</text><text x="675" y="759" font-size="15" text-anchor="middle" fill="#63777b">有来源、配额与验收</text></g></g><g class="route-layer"><path d="M460 740H515" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><path d="M1015 487Q1220 435 1430 479T1790 468L1790 813H1015Z" fill="#f6f4ed" stroke="#548398"/><line x1="1015" y1="580" x2="1790" y2="580" stroke="#548398" stroke-width="3"/><text x="1050" y="602" font-size="16" fill="#548398">冰层 / 稳定支撑结构</text><g class="place" data-key="B05" role="button" tabindex="0"><title>地表航空 / 科考站 专业运输、备案与防寒</title><rect x="1025" y="280" width="340" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1025 280l170 -24l170 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1195" y="323" font-size="21" text-anchor="middle" font-weight="600">地表航空 / 科考站</text><text x="1195" y="354" font-size="15" text-anchor="middle" fill="#63777b">专业运输、备案与防寒</text></g></g><g class="place" data-key="B05" role="button" tabindex="0"><title>医疗 / 隔离 应急与实际撤回容量</title><rect x="1430" y="280" width="340" height="135" rx="24" fill="#e9eef0" stroke="#548398" stroke-width="2"/><line x1="1445" y1="344.8" x2="1755" y2="344.8" stroke="#548398" stroke-dasharray="12 9"/><g class="node-label"><text x="1600" y="323" font-size="21" text-anchor="middle" font-weight="600">医疗 / 隔离</text><text x="1600" y="354" font-size="15" text-anchor="middle" fill="#63777b">应急与实际撤回容量</text></g></g><rect x="1295" y="420" width="70" height="183" fill="#e7e9db" stroke="#7b9389"/><g class="place" data-key="B05" role="button" tabindex="0"><title>冰下调度塔 骨干、时序、维护窗口</title><rect x="1190" y="650" width="430" height="135" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="1405" cy="717.5" r="40.5" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="1405" y="693" font-size="21" text-anchor="middle" font-weight="600">冰下调度塔</text><text x="1405" y="724" font-size="15" text-anchor="middle" fill="#63777b">骨干、时序、维护窗口</text></g></g><g class="route-layer"><path d="M1195 415V450H1325V650" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1620 720H1730V415" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><text x="95" y="906" font-size="26" font-weight="600">月八中继内场：不是拿下主楼就自动恢复连接</text><rect x="85" y="945" width="1730" height="446" fill="#e7e9db" stroke="#aab6b5"/><g class="place" data-key="B05" role="button" tabindex="0"><title>观测 / 轮切比较席 沈遥独立测时序</title><rect x="115" y="995" width="350" height="140" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M115 995l175 -24l175 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="290" y="1038" font-size="21" text-anchor="middle" font-weight="600">观测 / 轮切比较席</text><text x="290" y="1069" font-size="15" text-anchor="middle" fill="#63777b">沈遥独立测时序</text></g></g><g class="place" data-key="B05" role="button" tabindex="0"><title>旧个人接点 / 空载试接 苏木六阶有限撤端</title><rect x="565" y="995" width="420" height="140" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="775" cy="1065" r="42" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="775" y="1038" font-size="21" text-anchor="middle" font-weight="600">旧个人接点 / 空载试接</text><text x="775" y="1069" font-size="15" text-anchor="middle" fill="#63777b">苏木六阶有限撤端</text></g></g><g class="place" data-key="B05" role="button" tabindex="0"><title>公共接替中继 维修人员实际接回</title><rect x="1140" y="995" width="385" height="140" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="1332.5" cy="1065" r="42" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="1332.5" y="1038" font-size="21" text-anchor="middle" font-weight="600">公共接替中继</text><text x="1332.5" y="1069" font-size="15" text-anchor="middle" fill="#63777b">维修人员实际接回</text></g></g><g class="place" data-key="B05" role="button" tabindex="0"><title>撤出 / 应急限流 秦岳依法保护</title><rect x="1565" y="1184" width="225" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1565 1184l112.5 -24l112.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1677.5" y="1227" font-size="21" text-anchor="middle" font-weight="600">撤出 / 应急限流</text><text x="1677.5" y="1258" font-size="15" text-anchor="middle" fill="#63777b">秦岳依法保护</text></g></g><g class="system-layer"><path d="M465 1065H565" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="system-layer"><path d="M985 1065H1140" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M1525 1070H1678V1184" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M775 1335V1135" fill="none" stroke="#b16655" stroke-width="3"  marker-end="url(#end)"/></g><text x="610" y="1372" font-size="17" fill="#b16655">非法代理截到退出空段；军方隔离具体非法外端</text><text x="100" y="1450" font-size="24" font-weight="600">两侧协同：南极保连续时序 ↔ 昆仑核接替容量 ↔ 镜井核本地旧认证</text><text x="100" y="1494" font-size="19" >对应线不是地理道路；现实材料、澄岚锚材各自采购和运抵。月八只停个人优先调用，月九才安全转公共冗余并交长期权限。</text><line x1="65" y1="1590" x2="1835" y2="1590" stroke="#aab6b5"/><text x="65" y="1624" font-size="16" >来源：公共设施的两塔与维护支路、七高潮之南极中继。核心坐标、塔高、冰厚及楼层未定，外观与平面为地标构图。</text><text x="65" y="1651" font-size="16" >地表与冰下分层不等于科幻传送井；需要专业运输、保护、认证和工程余量，六阶主角不替代军方与维修人员。</text></svg>