le" fill="#63777b">身份 · 肉身照料 · 中止</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>原公司业务留存 资助 / 运输 / 会议材料</title><rect x="115" y="580" width="300" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M115 580l150 -24l150 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="265" y="623" font-size="21" text-anchor="middle" font-weight="600">原公司业务留存</text><text x="265" y="654" font-size="15" text-anchor="middle" fill="#63777b">资助 / 运输 / 会议材料</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>医院与恢复区 急救原件、过载治疗</title><rect x="535" y="580" width="305" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M535 580l152.5 -24l152.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="687.5" y="623" font-size="21" text-anchor="middle" font-weight="600">医院与恢复区</text><text x="687.5" y="654" font-size="15" text-anchor="middle" fill="#63777b">急救原件、过载治疗</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>警方交接 / 见证 周卫明依法保全</title><rect x="115" y="875" width="300" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M115 875l150 -24l150 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="265" y="918" font-size="21" text-anchor="middle" font-weight="600">警方交接 / 见证</text><text x="265" y="949" font-size="15" text-anchor="middle" fill="#63777b">周卫明依法保全</text></g></g><g class="place" data-key="B01" role="button" tabindex="0"><title>旧试验站受控外围 月二救援；详图15</title><rect x="535" y="875" width="305" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M535 875l152.5 -24l152.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="687.5" y="918" font-size="21" text-anchor="middle" font-weight="600">旧试验站受控外围</text><text x="687.5" y="949" font-size="15" text-anchor="middle" fill="#63777b">月二救援；详图15</text></g></g><g class="route-layer"><path d="M415 348H535" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M535 645H435V475H270V580" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M688 875V715" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M435 935H415" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="place" data-key="B02" role="button" tabindex="0"><title>华夏学府训练场 负荷、防护、撤出与恢复</title><rect x="1040" y="280" width="300" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1040 280l150 -24l150 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1190" y="323" font-size="21" text-anchor="middle" font-weight="600">华夏学府训练场</text><text x="1190" y="354" font-size="15" text-anchor="middle" fill="#63777b">负荷、防护、撤出与恢复</text></g></g><g class="place" data-key="B02" role="button" tabindex="0"><title>研究 / 样本库 受限访问、独立测量</title><rect x="1460" y="280" width="305" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1460 280l152.5 -24l152.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1612.5" y="323" font-size="21" text-anchor="middle" font-weight="600">研究 / 样本库</text><text x="1612.5" y="354" font-size="15" text-anchor="middle" fill="#63777b">受限访问、独立测量</text></g></g><g class="place" data-key="B02" role="button" tabindex="0"><title>技术复核席 梁知秋 / 沈遥具名方法</title><rect x="1040" y="580" width="300" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1040 580l150 -24l150 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1190" y="623" font-size="21" text-anchor="middle" font-weight="600">技术复核席</text><text x="1190" y="654" font-size="15" text-anchor="middle" fill="#63777b">梁知秋 / 沈遥具名方法</text></g></g><g class="place" data-key="B02" role="button" tabindex="0"><title>异地审批留存库 月七依法调档，不破库</title><rect x="1460" y="580" width="305" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1460 580l152.5 -24l152.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1612.5" y="623" font-size="21" text-anchor="middle" font-weight="600">异地审批留存库</text><text x="1612.5" y="654" font-size="15" text-anchor="middle" fill="#63777b">月七依法调档，不破库</text></g></g><g class="place" data-key="B02" role="button" tabindex="0"><title>签收 / 原件护交接 证人安全、专业核签</title><rect x="1040" y="875" width="300" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1040 875l150 -24l150 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1190" y="918" font-size="21" text-anchor="middle" font-weight="600">签收 / 原件护交接</text><text x="1190" y="949" font-size="15" text-anchor="middle" fill="#63777b">证人安全、专业核签</text></g></g><g class="place" data-key="B02" role="button" tabindex="0"><title>交通 / 合规接入端 铁路航空、公共时段</title><rect x="1460" y="875" width="305" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1460 875l152.5 -24l152.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1612.5" y="918" font-size="21" text-anchor="middle" font-weight="600">交通 / 合规接入端</text><text x="1612.5" y="949" font-size="15" text-anchor="middle" fill="#63777b">铁路航空、公共时段</text></g></g><g class="route-layer"><path d="M1340 348H1460" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1612 580V475H1190V580" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1460 645H1380V935H1340" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M1460 935H1340" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><text x="90" y="1240" font-size="19" >月二：旧站窄段救援 → 医院恢复 → 原件复核；</text><text x="90" y="1273" font-size="19" >月三：公司 / 医疗 / 安防独立备份分别交接，</text><text x="90" y="1306" font-size="19" >一栋建筑里不能得到全部案件与责任。</text><text x="1015" y="1240" font-size="19" >月一：实训先形成行动能力；月七：调档补本人知情责任。</text><text x="1015" y="1273" font-size="19" >资料与人员走合法护送；不能用苏木痕迹读取代替核签。</text><text x="1015" y="1306" font-size="19" >学校、公共终端与医院不被主角私自接管。</text><line x1="65" y1="1395" x2="1835" y2="1395" stroke="#aab6b5"/><text x="65" y="1429" font-size="16" >楼块只表达已设定的机构关系，不把构图位置变成真实地址。母亲终局独立康复、短聚由本人决定，妹妹不停止学校生活。</text><text x="65" y="1456" font-size="16" >依据：蓝星地理的临江宁川、家庭设定与案件证据链；旧站内场见15，跨侧维护链见17。</text></svg>