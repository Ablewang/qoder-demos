<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2730" viewBox="0 0 1900 2730" aria-label="沉星域区域与片区图" role="img"><defs><marker id="Q06-flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#548398" stroke-width="1.5"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#253e44}.place{cursor:pointer}.place:hover text,.place.chosen text{font-weight:700}.place:focus{outline:none}.place:focus .symbol{stroke:#475f88;stroke-width:4}</style><rect x="0" y="0" width="1900" height="2730" fill="#f6f4ed"/><text x="60" y="35" font-size="13" fill="#63777b">第一部独立设定 / 2047 / 分层地图 23</text><text x="60" y="82" font-size="29" font-weight="600">沉星域 · 山水交通与地方片区</text><text x="60" y="116" font-size="16" >断盆是多个独立水盆；灰云遮光不是时间冻结，矿壳居民不是待售矿石。</text><rect x="60" y="155" width="1190" height="900" fill="#e7e9db" stroke="#aab6b5" rx="4"/><path d="M120 250q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 335q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 420q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 505q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 590q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 675q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 760q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 845q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><path d="M120 930q246.10000000000002 -28 492.20000000000005 0t492.20000000000005 0" stroke="#a17949" opacity=".25" fill="none"/><g class="place" data-key="W07" role="button" tabindex="0" ><ellipse cx="465" cy="575" rx="114" ry="57" fill="#e9eef0" stroke="#548398" stroke-width="2"/><text x="465" y="575" font-size="19" text-anchor="middle" class="node-label">沉星断盆湖</text></g><text x="235" y="615" font-size="15" class="node-label">多个独立季水盆，不全连通</text><g class="route-layer"><path d="M870 355Q702.5 447.5 465 580" stroke="#537362" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="683.5" y="446.5" font-size="12" class="node-label" paint-order="stroke" stroke="#f6f4ed" stroke-width="4">气密车 / 季水驿</text><path d="M465 580Q712.5 670 890 800" stroke="#537362" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="693.5" y="669" font-size="12" class="node-label" paint-order="stroke" stroke="#f6f4ed" stroke-width="4">可负担驮运</text><path d="M465 580Q410 435 285 330" stroke="#537362" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="391" y="434" font-size="12" class="node-label" paint-order="stroke" stroke="#f6f4ed" stroke-width="4">外围替代驿线</text></g><g class="place district-layer" data-key="D27" role="button" tabindex="0" ><circle cx="870" cy="355" r="10" fill="#475f88" class="symbol"/><text x="888" y="362" font-size="15" class="node-label" font-weight="600" paint-order="stroke" stroke="#f6f4ed" stroke-width="5">D27 曜墟气密谷城群</text></g><g class="place district-layer" data-key="D28" role="button" tabindex="0" ><circle cx="465" cy="580" r="10" fill="#475f88" class="symbol"/><text x="483" y="587" font-size="15" class="node-label" font-weight="600" paint-order="stroke" stroke="#f6f4ed" stroke-width="5">D28 断盆季水驿盟</text></g><g class="place district-layer" data-key="D29" role="button" tabindex="0" ><circle cx="890" cy="800" r="10" fill="#475f88" class="symbol"/><text x="908" y="807" font-size="15" class="node-label" font-weight="600" paint-order="stroke" stroke="#f6f4ed" stroke-width="5">D29 矿壳草原工镇</text></g><g class="place district-layer" data-key="D30" role="button" tabindex="0" ><circle cx="285" cy="330" r="10" fill="#475f88" class="symbol"/><text x="303" y="337" font-size="15" class="node-label" font-weight="600" paint-order="stroke" stroke="#f6f4ed" stroke-width="5">D30 黑昼外围冷却带</text></g><g class="place" data-key="Q06" role="button" tabindex="0" ><text x="1290" y="187" font-size="24" font-weight="600">Q06 沉星域</text><text x="1290" y="225" font-size="16" >陆地2900亿 km²；登记居民约3万亿</text></g><text x="1290" y="300" font-size="19" font-weight="600">分层读图</text><text x="1290" y="332" font-size="16" >上图：水系与地方网络关系；下图：每处具名片区有独立可点击区域。</text><text x="1290" y="355" font-size="16" >所有窗口独立放大，不可拿窗口面积比较地方大小。</text><g class="place district-layer" data-key="D27" role="button" tabindex="0" ><text x="1290" y="465" font-size="16" font-weight="600">D27 曜墟气密谷城群</text><text x="1290" y="487" font-size="13" fill="#63777b">3处具名片区 / 对应下方放大窗口</text></g><g class="place district-layer" data-key="D28" role="button" tabindex="0" ><text x="1290" y="513" font-size="16" font-weight="600">D28 断盆季水驿盟</text><text x="1290" y="535" font-size="13" fill="#63777b">3处具名片区 / 对应下方放大窗口</text></g><g class="place district-layer" data-key="D29" role="button" tabindex="0" ><text x="1290" y="561" font-size="16" font-weight="600">D29 矿壳草原工镇</text><text x="1290" y="583" font-size="13" fill="#63777b">3处具名片区 / 对应下方放大窗口</text></g><g class="place district-layer" data-key="D30" role="button" tabindex="0" ><text x="1290" y="609" font-size="16" font-weight="600">D30 黑昼外围冷却带</text><text x="1290" y="631" font-size="13" fill="#63777b">3处具名片区 / 对应下方放大窗口</text></g><text x="1290" y="865" font-size="16" >气密车 / 邻谷逐舱换装</text><text x="1290" y="900" font-size="16" >季水晚到 / 用备用井另付费</text><text x="1290" y="935" font-size="16" >绕黑昼禁线 / 实体路标</text><text x="80" y="1028" font-size="14" fill="#63777b">水系箭头表示源汇；交通虚线表示已述联系，不承诺直达、同日可航或免费传送。</text><text x="60" y="1100" font-size="19" font-weight="600">图示边界与来源</text><text x="60" y="1133" font-size="16" >九域不是九国；D编号不是等面积行政区。未测内部排布为绘图采用示意，无地籍、街址或比例尺。</text><text x="60" y="1163" font-size="15" >源文：地理Q与D独立详情、原交通表及地方邻接；城国、门派、奇境、练场可点击到对应专图。</text><text x="60" y="1220" font-size="23" font-weight="600">地方窗口 / 每个具名片区都有自己的图形和原文锚</text><g class="district-layer"><rect x="60" y="1255" width="870" height="650" fill="#e7e9db" fill-opacity=".24" stroke="#aab6b5" rx="5"/><g class="place district-layer" data-key="D27" role="button" tabindex="0" ><text x="82" y="1290" font-size="23" font-weight="600">D27 曜墟气密谷城群</text></g><text x="82" y="1320" font-size="15" >曜墟城、谷口分舱驿与旧矿外缘</text><g class="place district-layer" data-key="D27" role="button" tabindex="0" data-section-index="0" aria-label="D27 曜墟谷关区"><rect x="89" y="1370" width="256" height="225" rx="18" fill="#f6f4ed" opacity=".82" stroke="#aab6b5" stroke-dasharray="3 6"/><rect x="209.01999999999998" y="1454.3" width="85.12" height="65.80000000000001" rx="9" fill="#e9eef0" stroke="#475f88" stroke-dasharray="4 4"/><text x="100" y="1393" font-size="16" font-weight="600" class="node-label">曜墟谷关区</text><text x="100" y="1580" font-size="12" fill="#63777b" class="node-label">点此展开原文 · 1056行</text></g><g class="place district-layer" data-key="D27" role="button" tabindex="0" data-section-index="1" aria-label="D27 釉舍三舱片区"><rect x="369" y="1370" width="256" height="225" rx="18" fill="#f6f4ed" opacity=".82" stroke="#aab6b5" stroke-dasharray="3 6"/><path d="M524.08 1463.65L544.88 1429.2L566.98 1463.65M537.08 1442.2L544.88 1448.05L552.68 1442.2" fill="none" stroke="#73876a" stroke-width="2"/><rect x="489.02" y="1454.3" width="85.12" height="65.80000000000001" rx="9" fill="#e9eef0" stroke="#475f88" stroke-dasharray="4 4"/><text x="380" y="1393" font-size="16" font-weight="600" class="node-label">釉舍三舱片区</text><text x="380" y="1580" font-size="12" fill="#63777b" class="node-label">点此展开原文 · 1064行</text></g><g class="place district-layer" data-key="D27" role="button" tabindex="0" data-section-index="2" aria-label="D27 旧灯修院区"><rect x="649" y="1370" width="256