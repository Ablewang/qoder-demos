<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1850" viewBox="0 0 1900 1850" role="img" aria-labelledby="S04-title S04-desc" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><title id="S04-title">四文明 · 三条实体物流与归墟转运瓶颈</title><desc id="S04-desc">实线是人员／实装材料运输；三线为方案取舍而非测距航图；型别只描述能源与组织范围，不代表宇宙层级。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。</desc><defs><marker id="S04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="S04-strata" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 18H28M0 6H15" stroke="#73876a" opacity=".22"/></pattern><style>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:#b16655;stroke-width:4}.halo{paint-order:stroke;stroke:#f6f4ed;stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}</style></defs><rect x="0" y="0" width="1900" height="1850" fill="#f6f4ed"/><rect x="0" y="0" width="18" height="1850" fill="#475f88"/><text x="66" y="65" font-size="36" font-weight="700">四文明 · 三条实体物流与归墟转运瓶颈</text><text x="66" y="109" font-size="18" fill="#63777b">实线是人员／实装材料运输；三线为方案取舍而非测距航图；型别只描述能源与组织范围，不代表宇宙层级</text><text x="1834" y="65" font-size="28" text-anchor="end" fill="#a17949">S04</text><line x1="65" y1="133" x2="1835" y2="133" stroke="#aab6b5"/><g class='place' data-key='SER-S04-01' role='button' tabindex='0' aria-label='钧环技术协约 · II型：碳基躯体＋外置骨环＋神经陶层；依赖散热工艺。；限制：骨环是意识承载链，不能拆作行李。'><title>钧环技术协约 · II型 · C03:7</title><rect x="90" y="190" width="410" height="195" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="104" y="205" width="6" height="29" rx="2" fill="#475f88"/><text x="120" y="228" font-size="22" font-weight="650" class="node-label">钧环技术协约 · II型</text><text x="120" y="262" font-size="17" fill="#63777b">骨环＋陶层连续</text><text x="120" y="289" font-size="17" fill="#63777b">工艺署名有独立利益</text><text x="486" y="373" font-size="12" text-anchor="end" fill="#63777b">C03 · 7</text></g><g class='place' data-key='SER-S04-02' role='button' tabindex='0' aria-label='弥珀共鸣共同体 · II型：菌膜＋矿盐骨架；共享交流网仍有独立人格。；限制：湿盐保养与独立回传不可合并省费。'><title>弥珀共鸣共同体 · II型 · C03:13</title><rect x="530" y="190" width="410" height="195" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="544" y="205" width="6" height="29" rx="2" fill="#475f88"/><text x="560" y="228" font-size="22" font-weight="650" class="node-label">弥珀共鸣共同体 · II型</text><text x="560" y="262" font-size="17" fill="#63777b">菌膜＋矿盐独立</text><text x="560" y="289" font-size="17" fill="#63777b">湿盐／私人声部</text><text x="926" y="373" font-size="12" text-anchor="end" fill="#63777b">C03 · 13</text></g><g class='place' data-key='SER-S04-03' role='button' tabindex='0' aria-label='硅庭人工生命 · III型：光硅核心＋分布式纠错阵列；新副本为新公民。；限制：连续链不能离线拆运；算能不等于无限。'><title>硅庭人工生命 · III型 · C03:19</title><rect x="970" y="190" width="410" height="195" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="984" y="205" width="6" height="29" rx="2" fill="#475f88"/><text x="1000" y="228" font-size="22" font-weight="650" class="node-label">硅庭人工生命 · III型</text><text x="1000" y="262" font-size="17" fill="#63777b">光硅＋纠错阵列</text><text x="1000" y="289" font-size="17" fill="#63777b">冷却位挤占探索货位</text><text x="1366" y="373" font-size="12" text-anchor="end" fill="#63777b">C03 · 19</text></g><g class='place' data-key='SER-S04-04' role='button' tabindex='0' aria-label='赤翎祖庭 · II型：羽骨有机载体＋胸部结晶索引；祖羽保存记录。；限制：祖名记录不是活人格；祭场限合约区。'><title>赤翎祖庭 · II型 · C03:25</title><rect x="1410" y="190" width="410" height="195" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1424" y="205" width="6" height="29" rx="2" fill="#475f88"/><text x="1440" y="228" font-size="22" font-weight="650" class="node-label">赤翎祖庭 · II型</text><text x="1440" y="262" font-size="17" fill="#63777b">羽骨＋结晶索引</text><text x="1440" y="289" font-size="17" fill="#63777b">祖羽封存／祭期航位</text><text x="1806" y="373" font-size="12" text-anchor="end" fill="#63777b">C03 · 25</text></g><rect x="80" y="455" width="1735" height="1000" rx="70" fill="#e9eef0" stroke="#548398"/><text x="110" y="496" font-size="23" font-weight="650">真实大陆／海路／陆路／关口构成的交换网络</text><g class='place' data-key='SER-S04-05' role='button' tabindex='0' aria-label='北霜冷却海线：冷却便利，冷却物资与能量存储供运输保养。；限制：本地越冬限额优先，不能抽光冬储。'><title>北霜冷却海线 · C03:56</title><path d="M870 558L1010 512L1170 540L1242 645L1130 700L940 682Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="941" y="607" font-size="30" font-weight="650">北霜</text><text x="935" y="640" font-size="18" fill="#63777b">冷却海线／越冬限额</text></g><g class='place' data-key='SER-S04-06' role='button' tabindex='0' aria-label='西砾耐压陆线：耐压材料充足，支撑封装与维修；可省航时。；限制：散热昂贵，不能用材料丰富代替冷却。'><title>西砾耐压陆线 · C03:56</title><path d="M164 757L276 671L430 727L500 886L417 1007L227 964Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="222" y="824" font-size="30" font-weight="650">西砾</text><text x="219" y="861" font-size="18" fill="#63777b">耐压陆线</text><text x="219" y="891" font-size="18" fill="#63777b">散热昂贵</text></g><g class='place' data-key='SER-S04-07' role='button' tabindex='0' aria-label='南沧湿盐水路：湿盐补给适合菌膜与水栖载体。；限制：绕行较远，保养舱与航期都占额度。'><title>南沧湿盐水路 · C03:56</title><path d="M411 1124L570 1037L769 1090L829 1210L691 1311L511 1280Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="502" y="1157" font-size="30" font-weight="650">南沧</text><text x="499" y="1194" font-size="18" fill="#63777b">湿盐水路／绕行远</text></g><g class='place' data-key='SER-S04-10' role='button' tabindex='0' aria-label='东岚材料与接入：温湿多海岸，东方接入与外缘隔海板块。；限制：不是第四条已命名运输方案，未知线路不硬填。'><title>东岚材料与接入 · U06:21</title><path d="M1464 694L1639 665L1753 773L1718 963L1539 980L1456 865Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="1510" y="803" font-size="30" font-weight="650">东岚</text><text x="1507" y="840" font-size="18" fill="#63777b">东方接入</text><text x="1507" y="870" font-size="18" fill="#63777b">材料／载体纤维</text></g><g class='place' data-key='SER-S04-08' role='button' tabindex='0' aria-label='中衡查验与交割：材料、冷却、粮食经认证交换晶体。；限制：查验占用实际泊时，不是路过即清关。'><title>中衡查验与交割 · C03:56</title><rect x="840" y="839" width="470" height="175" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="854" y="854" width="6" height="29" rx="2" fill="#475f88"/><text x="870" y="877" font-size="22" font-weight="650" class="node-label">中衡查验与交割</text><text x="870" y="911" font-size="17" fill="#63777b">集中认证／计量／交割</text><text x="870" y="938" font-size="17" fill="#63777b">实际停泊时间不能省略</text><text x="1296" y="1002" font-size="12" text-anchor="end" fill="#63777b">C03 · 56</text></g><g class='place' data-key='SER-S04-09' role='button' tabindex='0' aria-label='极渊封装出库：高密度晶体须封装、限额和冷却。；限制：沿途损耗入账，冷却断供仍可报废。'><title>极渊封装出库 · C03:56</title><rect x="1350" y="1156" width="395" height="170" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1364" y="1171" width="6" height="29" rx="2" fill="#475f88"/><text x="1380" y="1194" font-size="22" font-weight="650" class="node-label">极渊封装出库</text><text x="1380" y="1228" font-size="17" fill="#63777b">封装材料＋冷却＋限额</text><text x="1380" y="1255" font-size="17" fill="#63777b">仓库与补给须同时保住</text><text x="1731" y="1314" font-size="12" text-anchor="end" fill="#63777b">C03 · 56</text></g><path d="M1060 701Q1250 735 1160 839" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M1060 701Q1250 735 1160 839" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><g transform="translate(1236 764) scale(0.67)"><path d="M-60 10H60L40 38H-38Z" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="-32" y="-20" width="57" height="29" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><line x1="-48" y1="17" x2="48" y2="17" fill="none" stroke="#aab6b5" stroke-width="1.5"/><rect x="-14" y="-39" width="13" height="19" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><path d="M-75 48Q-50 36-25 48T25 48T75 48" fill="none" stroke="#548398" stroke-width="2"/></g><text x="1179" y="688" font-size="18" fill="#548398">海线</text><path d="M495 849H835" fill="none" stroke="#537362" stroke-width="18" opacity=".13"/><path d="M495 849H835" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><text x="545" y="821" font-size="17" fill="#537362">陆线 · 材料充足／热耗高</text><path d="M706 1072Q760 987 840 958" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M706 1072Q760 987 840 958" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><g transform="translate(754 1030) scale(0.6)"><path d="M-60 10H60L40 38H-38Z" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="-32" y="-20" width="57" height="29" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><line x1="-48" y1="17" x2="48" y2="17" fill="none" stroke="#aab6b5" stroke-width="1.5"/><rect x="-14" y="-39" width="13" height="19" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><path d="M-75 48Q-50 36-25 48T25 48T75 48" fill="none" stroke="#548398" stroke-width="2"/></g><text x="435" y="1028" font-size="17" fill="#548398">水路 · 保湿盐但更远</text><path d="M1458 875H1310" fill="none" stroke="#537362" stroke-width="18" opacity=".13"/><path d="M1458 875H1310" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><path d="M1160 1014Q1270 1096 1350 1220" fill="none" stroke="#a17949" stroke-width="18" opacity=".13"/><path d="M1160 1014Q1270 1096 1350 1220" class="route-layer" fill="none" stroke="#a17949" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><path d="M1425 1155Q1428 1060 1230 1014" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S04-arrow)"/><text x="1345" y="1088" font-size="17" fill="#a17949">晶体返运亦付损耗</text><path d="M295 385V660" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S04-arrow)"/><path d="M736 385V415H580V1038" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S04-arrow)"/><path d="M1175 385V420H1329V834" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S04-arrow)"/><path d="M1615 385V425H1790V1153" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S04-arrow)"/><text x="1418" y="519" font-size="17" fill="#475f88">虚线：文明代表／接口关联</text><g class='place' data-key='SER-S04-11' role='button' tabindex='0' aria-label='实物库存 ≠ 仓单：合法承运者收费、保险与限载；超售不增加实物。；限制：账面凭证不能生出晶体，失效库存须赔付。'><title>实物库存 ≠ 仓单 · C03:52</title><rect x="95" y="1515" width="790" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="109" y="1530" width="6" height="29" rx="2" fill="#475f88"/><text x="125" y="1553" font-size="22" font-weight="650" class="node-label">实物库存 ≠ 仓单</text><text x="125" y="1587" font-size="17" fill="#63777b">守住仓库不等于有冷却船位；仓单必须核对现货</text><text x="125" y="1614" font-size="17" fill="#63777b">运费、保险、返航储备由真实承运者承担并收取</text><text x="871" y="1654" font-size="12" text-anchor="end" fill="#63777b">C03 · 52</text></g><g class='place' data-key='SER-S04-12' role='button' tabindex='0' aria-label='居民维生先于主角装备：护库、保冷却、维持民用订单不能靠占一处全得。；限制：冷却断供会报废晶体，意识退出不运实物。'><title>居民维生先于主角装备 · C03:56</title><rect x="975" y="1515" width="790" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="989" y="1530" width="6" height="29" rx="2" fill="#475f88"/><text x="1005" y="1553" font-size="22" font-weight="650" class="node-label">居民维生先于主角装备</text><text x="1005" y="1587" font-size="17" fill="#63777b">护库／护补给／护关口只能有限分配</text><text x="1005" y="1614" font-size="17" fill="#63777b">普通投射退出不搬物；跨界交易另走合法实体额度</text><text x="1751" y="1654" font-size="12" text-anchor="end" fill="#63777b">C03 · 56</text></g><line x1="65" y1="1710" x2="1835" y2="1710" stroke="#aab6b5"/><text x="65" y="1743" font-size="17" fill="#63777b">依据 C03「接入文明的独立性」「全域组织与资源通道」：四文明、三路线、仓单与实物；U06「六大陆与核心」。</text><text x="65" y="1771" font-size="17" fill="#63777b">线长仅为读图布局，不给未定吨位、航时、交通工程或文明源端精确星图；三线不可互相免费替代。</text><rect x="65" y="1810" width="12" height="5" fill="#f6f4ed"/><rect x="82" y="1810" width="12" height="5" fill="#e9eef0"/><rect x="99" y="1810" width="12" height="5" fill="#e7e9db"/><rect x="116" y="1810" width="12" height="5" fill="#253e44"/><rect x="133" y="1810" width="12" height="5" fill="#63777b"/><rect x="150" y="1810" width="12" height="5" fill="#aab6b5"/><rect x="167" y="1810" width="12" height="5" fill="#7b9389"/><rect x="184" y="1810" width="12" height="5" fill="#548398"/><rect x="201" y="1810" width="12" height="5" fill="#73876a"/><rect x="218" y="1810" width="12" height="5" fill="#537362"/><rect x="235" y="1810" width="12" height="5" fill="#a17949"/><rect x="252" y="1810" width="12" height="5" fill="#b16655"/><rect x="269" y="1810" width="12" height="5" fill="#475f88"/><rect x="286" y="1810" width="12" height="5" fill="#ffffff"/><text x="1835" y="1815" font-size="14" text-anchor="end" fill="#63777b">S04 · 系列独立图册 / 拓扑非比例</text></svg>