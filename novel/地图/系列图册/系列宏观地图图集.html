</style></head><body><header><h1>系列宏观设定 · 独立图册</h1><p>三层九格、归墟全域、跨层通路、文明与历史、母界关系及远期空间，独立于第一部当地地图。共8图；每个具名节点可查原设定与能力边界。</p><nav id="tabs"></nav></header><main><div class="tools"><button id="fit">适应宽度</button><button id="minus">缩小</button><button id="plus">放大</button><span id="zoomLabel"></span><label><input id="labels" type="checkbox" checked>节点名称</label><label><input id="routes" type="checkbox" checked>通路关系</label><label><input id="risk" type="checkbox" checked>风险面</label><label><input id="system" type="checkbox" checked>维护关系</label><input id="search" type="search" placeholder="全图册搜索名称 / 编号 / 机制"><button id="download">下载本图 SVG</button></div><div class="layout"><div id="viewport"><div id="map"></div></div><aside class="panel"><div id="detail"></div><h3 id="listTitle"></h3><div class="places" id="places"></div><p class="notice">图册以关系拓扑、载体剖面与机制空间为主；未知坐标、航期、天文直径与建筑尺寸不猜定。窗口位置不是宇宙嵌套的实体比例。<br>六基础大陆与澄岚分清；极渊巨界晶的银河尺度是等效展开，不是地下实体直径。<br>传送、折叠、回程、冷却、适配与维生均须支付预算；箭头不表示免费到达。</p></aside></div></main><footer>离线可用 · 系列独立编号与来源 · 不改知识库或旧稿，不改第一部主角路线</footer><script>

能、转码、适配载体 | 规则灼伤、桥端解体 |","story":"","overview":"水碳生命跨入织律层前，源端维持身体，目的端预置相容物质舱与律晶材料节点；先校核呼吸、代谢和感知的往返状态，再开放自主活动。律晶不取代食物与肉身，失败时退回保留的源端过程。","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-10","SER-S01-12"]},{"id":"SER-S01-12","name":"上下适配：织律 ↔ 源序","region":"第二／第三层","detail":"规则实例与生成依据经互证桥关联。","limit":"维护基准、生成验证与纠错须付费。","source":"U03","line":13,"sourceExcerpt":"| 织律与源序之间 | 规则实例和生成依据的互证桥 | 生成验证、基准维护、纠错 | 错误规则扩散、验证崩溃 |","story":"","overview":"源序侧实体校验阵列以独立基准验证受限规则实例和生成依据，持续输入与连续载体链共同承接意识。验证预算不足便缩小活动范围或逐段回程，独立副本另作新人格。","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-11"]},{"id":"SER-S01-13","name":"高层仍有实体载体","region":"三层共通","detail":"肉体、矿物核、设备、律晶与校验阵列均可承载意识。","limit":"层更高不等于意识可以无依附存在。","source":"U04","line":5,"sourceExcerpt":"生命须具备持续组织、自我维持与适应反馈；意识则是依附稳定载体运行的感知、记忆及自主判断过程。肉体、矿物核、实体设备、律晶节点和源序校验阵列都可成为载体。第二层规则网、第三层生成结构同样必须有具体介质，不能以“更高层”豁免依附条件。","story":"","overview":"连续性核验保留原载体，检查不断供的交接链、独立设备记录和单调事件序号，交接完成才撤原端。两端若已能独立选择，就保护为两个人格，不能删除一端冒充迁移。","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-14"]},{"id":"SER-S01-14","name":"所有接口计入有限账本","region":"三层共通","detail":"期末库存＝期初＋实际输入－实际输出－不可回收损耗。","limit":"锁能不即时可用，回收不得重复记新输入。","source":"U02","line":40,"sourceExcerpt":"任一统计周期采用“期末库存＝期初库存＋实际输入－实际输出－不可回收损耗”。锁能是库存中的不可即时调用部分；维护消耗须单列，已回收的能量不得重复计作新输入。跨层换算使用接口双方校准后的等效可释放能量，不直接相加未经校准的读数。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-13"]},{"id":"SER-S02-01","name":"东岚","region":"北半球东方","detail":"温湿、多海岸；东方接入。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":21,"sourceExcerpt":"| 北半球东部 | 东岚 | 温湿、多海岸及隔海陆块，承担东方接入分区 |","story":"","overview":"东岚的河谷、林地和城港在亿年发展中分化，土地开发、林权争夺与工坊师承改变了种子聚落；今日居民不是等待建造者分配用途的原始群落。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-07"]},{"id":"SER-S02-02","name":"西砾","region":"北半球西方","detail":"干燥矿带、高原；材料加工。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":22,"sourceExcerpt":"| 北半球西部 | 西砾 | 干燥矿带与高原，承担材料加工和西方接入 |","story":"","overview":"西砾矿带经历开井、封井和围绕新水源重建聚落，旧矿井与新住区留下不同世代的劳动和土地关系。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-03","name":"南沧","region":"北半球南方","detail":"湖海与岛链；航运和南方接入。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":23,"sourceExcerpt":"| 北半球南部 | 南沧 | 湖海及岛链密集，承担航运和南方接入 |","story":"","overview":"南沧水栖城与浮台随海岸改变迁移，航路和共生生态成为不同群体的家业，旧种子身份不能代替现居权益。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-04","name":"北霜","region":"北半球北方","detail":"冰原、地下聚落；耐寒载体与北方接入。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":24,"sourceExcerpt":"| 北半球北部 | 北霜 | 寒冷冰原与地下聚落，承担耐寒载体和北方接入 |","story":"","overview":"北霜后裔承接已毁旧林的记忆，经历本地定居、季节迁徙和仓储城群兴起。旧仓继承与后来住民的建城劳动并不总属同一家系；居民留住现城和越冬储备，不恢复成长基金供能。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-05","name":"中衡","region":"北半球中央","detail":"四大陆交通、能源分流与浓缩晶体配给。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":25,"sourceExcerpt":"| 北半球中央 | 中衡 | 四大陆交通、能源分流和浓缩晶体配给枢纽 |","story":"","overview":"中衡转运与认证逐渐形成跨地方的城市网络；极渊凝晶和界面工程吸引高密度家系与工匠。配额、工役和迁民争执伴随资源集中，城市与收益已不是器灵可任意收回的工程资产。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-10"]},{"id":"SER-S02-06","name":"极渊","region":"南极中心","detail":"高压环境；核心维护和主要浓缩产区。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":26,"sourceExcerpt":"| 南极中心 | 极渊 | 高压能量环境，核心维护及主要浓缩产区 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-10"]},{"id":"SER-S02-07","name":"澄岚：银河级承接","region":"东岚外缘隔海","detail":"承接蓝星所在银河系全部生命谱系；展开陆地约3.2万亿平方公里。","limit":"不是第七基础大陆，不把银河承接画成蓝星小岛。","source":"U06","line":30,"sourceExcerpt":"澄岚是东岚外缘隔海的银河系级承接大陆，负责蓝星所在银河系的全部生命谱系与相应生境；不是六基础大陆之一。“外缘陆块”只指相对归墟全域的拓扑地位，不指蓝星尺度的小岛。其有物质接续的展开陆地约3.2万亿平方公里，内部八方按银河星盘八个方位扇区聚合不同源地，盘面高度与距中心远近另作索引；中央天衡中域是澄岚自身的繁华腹地，不是中衡中心大陆，也不产九阶以上专用浓缩晶体。蓝星使用东南万岬域的初渡六区，地方设定与行动另行记录。","story":"","overview":"源地定位正确仍须逐组核验承接容量：适配地表、完整食物网、原料、持续输入、散热和下次补给前备用同时达标。展开面积不生成粮水或载具，未详测谱系的需求仍须实测证明。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-01","SER-S02-08"]},{"id":"SER-S02-08","name":"天衡中域 ≠ 中衡","region":"澄岚内部","detail":"天衡是澄岚繁华腹地；中衡是全域分流大陆。","limit":"天衡不产九阶以上专用浓缩晶体。","source":"U06","line":30,"sourceExcerpt":"澄岚是东岚外缘隔海的银河系级承接大陆，负责蓝星所在银河系的全部生命谱系与相应生境；不是六基础大陆之一。“外缘陆块”只指相对归墟全域的拓扑地位，不指蓝星尺度的小岛。其有物质接续的展开陆地约3.2万亿平方公里，内部八方按银河星盘八个方位扇区聚合不同源地，盘面高度与距中心远近另作索引；中央天衡中域是澄岚自身的繁华腹地，不是中衡中心大陆，也不产九阶以上专用浓缩晶体。蓝星使用东南万岬域的初渡六区，地方设定与行动另行记录。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-07"]},{"id":"SER-S02-09","name":"连续地表展开网络","region":"归墟有效地表","detail":"各段有真实物质、路径、日照、重力、生态条件。","limit":"建设和维生散热付有限预算；接缝不免费搬运。","source":"U06","line":32,"sourceExcerpt":"归墟地表沿长期稳定的空间展开网络获得大于外观球面的有效面积；各段有实际物质、连续路径和可测的日照、重力与生态条件。扩展不复制同一份物质库存，构建、持续接续、维生与散热由归墟有限输入及已配置储能支撑；新承接生命先落实生境容量。普通路面接续与另有资格的实体运输分开，不能通过退出重登或穿过地图接缝免费搬运。亿年自然发展继承已有基底、陆海和水库存，地质运动持续改造各地方山系；百万公里地貌带由多个地方构造区与山系接续，不是一条蓝星尺度的单一山脉。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-10","name":"唯一地下巨界晶","region":"极渊地下","detail":"折叠晶格网络按等效展开尺度计量。","limit":"非银河实体塞球；中衡不是第二颗核心。","source":"U06","line":34,"sourceExcerpt":"巨型界晶位于极渊地下的折叠空间。所谓“银河系大小”是晶格网络等效展开尺度，不是把银河系实体直径塞进星球；折叠拓扑有真实锚点、储能与维护成本。核心集中输入并生成浓缩晶体，产物沿中衡分流，界晶本体不是可无限开采的矿山。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-06","SER-S02-05"]},{"id":"SER-S03-01","name":"有限同层合格输入","region":"载体层高等 → 归墟低等","detail":"界晶集中同层输入，居民与外来者精炼；净余量用于维护与交换。","limit":"不是跨层输入，不增加封闭总体能量。","source":"U06","line":5,"sourceExcerpt":"归墟是第一层低等宇宙内的真实文明世界、能量精炼中转站和意识接入网络，不是制造无限能源的虚拟游戏。界晶集中同层高等宇宙的合格输入，居民和外来者通过修炼精炼能量，净余量用于维护和交换。修炼收益真实，器灵为苏木准备成长条件的利用关系也真实。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-02"]},{"id":"SER-S03-02","name":"地下折叠巨界晶","region":"极渊地下","detail":"晶格银河系大小为等效展开尺度；各锚点与折叠结构真实存在。","limit":"不得画成银河实体塞入星球或无限开采矿山。","source":"U06","line":34,"sourceExcerpt":"巨型界晶位于极渊地下的折叠空间。所谓“银河系大小”是晶格网络等效展开尺度，不是把银河系实体直径塞进星球；折叠拓扑有真实锚点、储能与维护成本。核心集中输入并生成浓缩晶体，产物沿中衡分流，界晶本体不是可无限开采的矿山。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-01","SER-S03-08"]},{"id":"SER-S03-03","name":"核心入口：四项同时核验","region":"极渊受控入口","detail":"太初晶认证、实时体魄、意识同步、设备冗余。","limit":"身份／九阶／核心资格均不授行政统治权。","source":"U06","line":36,"sourceExcerpt":"核心入口同时核验太初晶有效认证、实时体魄承载、意识同步和设备冗余。身份通过不等于身体通过，九阶数字不能自动开门；测试失败要降载或退出。拥有核心认证也不等于取得全域行政统治权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-04","SER-S03-05","SER-S03-06","SER-S03-07"]},{"id":"SER-S03-04","name":"太初晶有效认证","region":"核心核验链","detail":"太初晶有效认证为核心入口必须同时通过的一项。","limit":"任一失败即降载或退出，不以其他项代替。","source":"U06","line":36,"sourceExcerpt":"核心入口同时核验太初晶有效认证、实时体魄承载、意识同步和设备冗余。身份通过不等于身体通过，九阶数字不能自动开门；测试失败要降载或退出。拥有核心认证也不等于取得全域行政统治权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-03"]},{"id":"SER-S03-05","name":"实时体魄承载","region":"核心核验链","detail":"实时体魄承载为核心入口必须同时通过的一项。","limit":"任一失败即降载或退出，不以其他项代替。","source":"U06","line":36,"sourceExcerpt":"核心入口同时核验太初晶有效认证、实时体魄承载、意识同步和设备冗余。身份通过不等于身体通过，九阶数字不能自动开门；测试失败要降载或退出。拥有核心认证也不等于取得全域行政统治权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-03"]},{"id":"SER-S03-06","name":"意识同步","region":"核心核验链","detail":"意识同步为核心入口必须同时通过的一项。","limit":"任一失败即降载或退出，不以其他项代替。","source":"U06","line":36,"sourceExcerpt":"核心入口同时核验太初晶有效认证、实时体魄承载、意识同步和设备冗余。身份通过不等于身体通过，九阶数字不能自动开门；测试失败要降载或退出。拥有核心认证也不等于取得全域行政统治权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-03"]},{"id":"SER-S03-07","name":"设备冗余","region":"核心核验链","detail":"设备冗余为核心入口必须同时通过的一项。","limit":"任一失败即降载或退出，不以其他项代替。","source":"U06","line":36,"sourceExcerpt":"核心入口同时核验太初晶有效认证、实时体魄承载、意识同步和设备冗余。身份通过不等于身体通过，九阶数字不能自动开门；测试失败要降载或退出。拥有核心认证也不等于取得全域行政统治权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-03"]},{"id":"SER-S03-08","name":"凝缩产物：可消耗晶体","region":"极渊凝晶产区","detail":"界晶是通道结构，浓缩晶体是加工后封装的能量产物。","limit":"产物可耗尽，本体不是燃料库。","source":"U06","line":34,"sourceExcerpt":"巨型界晶位于极渊地下的折叠空间。所谓“银河系大小”是晶格网络等效展开尺度，不是把银河系实体直径塞进星球；折叠拓扑有真实锚点、储能与维护成本。核心集中输入并生成浓缩晶体，产物沿中衡分流，界晶本体不是可无限开采的矿山。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-02","SER-S03-09"]},{"id":"SER-S03-09","name":"中衡分流站","region":"北半球中衡","detail":"接收极渊产物并向基础大陆分配。","limit":"不是第二块中心界晶；普通大陆与核心分账。","source":"U06","line":25,"sourceExcerpt":"| 北半球中央 | 中衡 | 四大陆交通、能源分流和浓缩晶体配给枢纽 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S03-08"]},{"id":"SER-S03-10","name":"太初晶独立跨层窗口","region":"受限跨层旁路","detail":"自然遗物早于器灵，保存耦合结构。","limit":"不是巨界晶碎片，不可任意切割复制。","source":"U05","line":7,"sourceExcerpt":"太初晶是自然跨层遗物：织律层与源序层稳定窗口中的长期规则沉积，形成可自组织维持、保存跨层耦合结构的晶格。它先于器灵存在，既非器灵制造物，也非界晶或母晶碎片；切割会损伤耦合结构，不能作为普通通道材料复制。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S03-11","name":"损耗／锚点维护账","region":"晶格及转运网络","detail":"统计实际输入、输出、不可回收损耗，锁能不能即时调用。","limit":"精炼改善可用比例，回收不得重复计数。","source":"U02","line":40,"sourceExcerpt":"任一统计周期采用“期末库存＝期初库存＋实际输入－实际输出－不可回收损耗”。锁能是库存中的不可即时调用部分；维护消耗须单列，已回收的能量不得重复计作新输入。跨层换算使用接口双方校准后的等效可释放能量，不直接相加未经校准的读数。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S04-01","name":"钧环技术协约 · II型","region":"西砾接入","detail":"碳基躯体＋外置骨环＋神经陶层；依赖散热工艺。","limit":"骨环是意识承载链，不能拆作行李。","source":"C03","line":7,"sourceExcerpt":"**钧环技术协约，II型。**主体钧环人以碳基躯体、外置骨环与神经陶层共同承载意识，移除骨环需逐段交接，不能把它当普通装备。恒星环带各居住站按基础人口和维护贡献组成协约议会，工业承包商接受站民负荷审计，工艺署名与竞赛名誉却归各自匠系。经济依赖恒星采能、散热与输能管线，归墟精炼服务能降低损耗，不能增加恒星总输出。连续意识不可恢复地终止就是死亡，档案副本只有继承资格。","story":"","overview":"钧环匠系偏爱可辨的骨环接缝和有署名的散热鳍，为展示工艺押下私储、争抢委托；借竞争者接口可能失去名誉与订单。学徒有人离系取得自己的工艺名，合修因此不能只靠公布负荷解决。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-06"]},{"id":"SER-S04-02","name":"弥珀共鸣共同体 · II型","region":"南沧节点","detail":"菌膜＋矿盐骨架；共享交流网仍有独立人格。","limit":"湿盐保养与独立回传不可合并省费。","source":"C03","line":13,"sourceExcerpt":"**弥珀共鸣共同体，II型。**弥珀人为半透明菌膜与矿盐骨架的共生种族，每个个体都有独立意识；共享菌网是交流载体，不自动构成同一人格。聚落由不同共鸣节群轮值治理，少数节群可退出公共合唱。恒星温差与共生生态供能，公共奖励偏向病弱载体，个人仍可积累私储。死亡是个体自我组织不可恢复，回归菌网保存片段不等于活着。","story":"","overview":"弥珀以独立声部辨认彼此，开放私人声部是信任，却不取消独唱的愿望。远行者追求新声部，留下的伴侣想延续共同节期；分居后公共合唱重排，获准分享的经历不能补回亲密。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-07"]},{"id":"SER-S04-03","name":"硅庭人工生命 · III型","region":"中衡常驻公民庭","detail":"光硅核心＋分布式纠错阵列；新副本为新公民。","limit":"连续链不能离线拆运；算能不等于无限。","source":"C03","line":19,"sourceExcerpt":"**硅庭人工生命，III型。**主体是人工制造却真正形成独立意识的硅庭人，意识依附光硅核心和分布式纠错阵列。制造工厂没有人格所有权，新意识诞生后即取得公民资格；创建副本会形成新的权利主体，而非可删除的备份。各星系公民庭与公共算能署共同治理，多恒星能源网络仍受算能、纠错材料和冷却容量限制。连续载体链破裂判定死亡，备份恢复须声明继承而非复活；它不等同蓝星当前AI。","story":"","overview":"硅庭创作者保留耗能更高的旧光路与慢色谱，连续作品占用算能、冷却和纠错材料。计量员转做航图会失去职业津贴；保住工作阵列也会减掉探索器材，朋友未必一直等候。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-08"]},{"id":"SER-S04-04","name":"赤翎祖庭 · II型","region":"极渊合约祭场","detail":"羽骨有机载体＋胸部结晶索引；祖羽保存记录。","limit":"祖名记录不是活人格；祭场限合约区。","source":"C03","line":25,"sourceExcerpt":"**赤翎祖庭，II型星际祭司文明。**赤翎人为羽骨有机载体，胸部结晶维持记忆索引，祖羽遗物保存先人记录但不普遍存有活人格。各迁徙星团由世袭祭司和航团长共同议事，教职不因接入而改成民主制度。恒星祭场和迁徙航路供能，誓约供献也维持祖名等级与航团声望，存在赎买地位的不平等。它承认死者身份不可出售，允许经仪式认可的继承者续用祖名。","story":"","overview":"赤翎祖名带来航位、祭场和照料，也要求延续祖辈航绩。贫家航绩可能归入庇护宗族，改个人名离团者失去专属泊位；祭期与祖羽封存使年轻航者承担实际风险，接入不改其祭司制度。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-09"]},{"id":"SER-S04-05","name":"北霜冷却海线","region":"北方海路","detail":"冷却便利，冷却物资与能量存储供运输保养。","limit":"本地越冬限额优先，不能抽光冬储。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-08"]},{"id":"SER-S04-06","name":"西砾耐压陆线","region":"西方陆路","detail":"耐压材料充足，支撑封装与维修；可省航时。","limit":"散热昂贵，不能用材料丰富代替冷却。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-01","SER-S04-08"]},{"id":"SER-S04-07","name":"南沧湿盐水路","region":"南方湖海水路","detail":"湿盐补给适合菌膜与水栖载体。","limit":"绕行较远，保养舱与航期都占额度。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-02","SER-S04-08"]},{"id":"SER-S04-08","name":"中衡查验与交割","region":"中央实际停泊点","detail":"材料、冷却、粮食经认证交换晶体。","limit":"查验占用实际泊时，不是路过即清关。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-03","SER-S04-05","SER-S04-06","SER-S04-07","SER-S04-09"]},{"id":"SER-S04-09","name":"极渊封装出库","region":"南极凝晶产区","detail":"高密度晶体须封装、限额和冷却。","limit":"沿途损耗入账，冷却断供仍可报废。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-04","SER-S04-08"]},{"id":"SER-S04-10","name":"东岚材料与接入","region":"东方基础大陆","detail":"温湿多海岸，东方接入与外缘隔海板块。","limit":"不是第四条已命名运输方案，未知线路不硬填。","source":"U06","line":21,"sourceExcerpt":"| 北半球东部 | 东岚 | 温湿、多海岸及隔海陆块，承担东方接入分区 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S04-11","name":"实物库存 ≠ 仓单","region":"晶契仓储／运输","detail":"合法承运者收费、保险与限载；超售不增加实物。","limit":"账面凭证不能生出晶体，失效库存须赔付。","source":"C03","line":52,"sourceExcerpt":"“晶契商盟”经营晶体分级、仓储、保险与结算。浓缩晶体是可消耗的稳定能量封装，界晶是通道结构，两者不能混卖。商盟内部并非同一行动者：合法承运者靠实装货物、安全航期和持续委托盈利，愿支持保库存与维持居民订单；另一些仓单经营者超售未来产能，减产后试图用军备高价订单抢走现货和冷却船位。前者不是无偿善人，会坚持运费、保险与限载，后者也不能靠一张仓单取得不存在的晶体。失效库存须赔付，晶体不自生利息，金融凭证不能冒充物理储备。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-12"]},{"id":"SER-S04-12","name":"居民维生先于主角装备","region":"远期库存保卫","detail":"护库、保冷却、维持民用订单不能靠占一处全得。","limit":"冷却断供会报废晶体，意识退出不运实物。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"库存争夺中，苏木先保居民载体生活，放弃预订的独家承载装备；准备金和高阶私储仍不够覆盖全部订单。部分城市停工，失去连续供给的基础工程报废，产能恢复也不抹掉破产合同与建设窗口。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-11"]},{"id":"SER-S05-01","name":"溯源柱","region":"同步测试／灌注剖面","detail":"逐级测试意识沟通；灌注需要登记输入与承载复测。","limit":"柱层不是宇宙层级，过载即停。","source":"U06","line":66,"sourceExcerpt":"| 溯源柱 | 逐级测试意识沟通与同步，达到灌注段须有登记输入和承载复测 | 提升感知与连接能力；柱层不是宇宙层级，过载即停 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S05-02","name":"炼神塔","region":"分段精炼／热耗剖面","detail":"检测结构、分段精炼，记录热耗与意识负荷。","limit":"不改写人格，不凭空补满能量。","source":"U06","line":67,"sourceExcerpt":"| 炼神塔 | 检测能量结构，分段精炼并记录热耗和意识负荷 | 改善精纯度和控制；不能改写人格、凭空补满能量 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S05-03","name":"万界擂台","region":"载体分组／隔离平面","detail":"双方同意、按载体气量设备分组；观众隔离。","limit":"积分换限时增益或有库存宝物，不授统治权。","source":"U06","line":68,"sourceExcerpt":"| 万界擂台 | 按载体、气量和设备分组，双方同意规则，隔离观众，禁止人格攻击 | 积分兑换限时增益或有库存宝物；比赛不授予统治权 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-09"]},{"id":"SER-S05-04","name":"时渊","region":"固定时域／出入口剖面","detail":"试炼令牌调用已建2、10、100倍时域。","limit":"每次外部≤12h，逐次付维护／寿命／载体预算。","source":"U06","line":69,"sourceExcerpt":"| 时渊 | 通过试炼获令牌，仅调用已建固定时域的2、10、100倍档；每次外部时长不超过12小时 | 额外经历与训练；逐次支付维护、寿命及载体成本，预算不足降档，不回到过去 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-05","SER-S05-06","SER-S05-07","SER-S05-08"]},{"id":"SER-S05-05","name":"固定 2 倍时域","region":"时渊固定档","detail":"外部上限12h时，相应域内经历上限为24h（倍率乘法，非额外保证）。","limit":"预算不足降档；不能自选任意倍率或回到过去。","source":"U06","line":69,"sourceExcerpt":"| 时渊 | 通过试炼获令牌，仅调用已建固定时域的2、10、100倍档；每次外部时长不超过12小时 | 额外经历与训练；逐次支付维护、寿命及载体成本，预算不足降档，不回到过去 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-04"]},{"id":"SER-S05-06","name":"固定 10 倍时域","region":"时渊固定档","detail":"外部上限12h时，相应域内经历上限为120h（倍率乘法，非额外保证）。","limit":"预算不足降档；不能自选任意倍率或回到过去。","source":"U06","line":69,"sourceExcerpt":"| 时渊 | 通过试炼获令牌，仅调用已建固定时域的2、10、100倍档；每次外部时长不超过12小时 | 额外经历与训练；逐次支付维护、寿命及载体成本，预算不足降档，不回到过去 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-04"]},{"id":"SER-S05-07","name":"固定 100 倍时域","region":"时渊固定档","detail":"外部上限12h时，相应域内经历上限为1200h（倍率乘法，非额外保证）。","limit":"预算不足降档；不能自选任意倍率或回到过去。","source":"U06","line":69,"sourceExcerpt":"| 时渊 | 通过试炼获令牌，仅调用已建固定时域的2、10、100倍档；每次外部时长不超过12小时 | 额外经历与训练；逐次支付维护、寿命及载体成本，预算不足降档，不回到过去 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-04"]},{"id":"SER-S05-08","name":"回传校准与输出限额","region":"时渊出口","detail":"退出须校准回传；高倍率不保证外部肉体同步获得全部增长。","limit":"输出能量另受连接额度限制。","source":"U06","line":71,"sourceExcerpt":"擂台常规比赛启用败退保护，但保护失效仍可能伤亡，不将参赛者视为可消耗材料。时渊退出须校准回传，高倍率不保证外部肉体同步获得全部增长；输出能量另受连接额度限制。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-04"]},{"id":"SER-S05-09","name":"败退保护与真实风险","region":"万界擂台退出区","detail":"常规保护并非绝对，失败仍可能伤亡。","limit":"原住民不是可刷新或可消耗材料。","source":"U06","line":71,"sourceExcerpt":"擂台常规比赛启用败退保护，但保护失效仍可能伤亡，不将参赛者视为可消耗材料。时渊退出须校准回传，高倍率不保证外部肉体同步获得全部增长；输出能量另受连接额度限制。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S05-03"]},{"id":"SER-S06-01","name":"混沌母界 · 第一层高等","region":"母宇宙","detail":"母界及子界的总量有限，成形锁能和反哺滞后造成存续压力。","limit":"不是第二层；高等不免除衰退与成本。","source":"C01","line":31,"sourceExcerpt":"母子宇宙合计能量有限。精炼改善结构、纯度与可用比例，不增加总量；新生宇宙将大量能量锁入膨胀、物质与生命，回流通常迟于母界支出。老化母界又需更多能量维持结构，遂出现繁荣与短期存续相冲突的危机。压缩训练和减少浪费能争取时间，不能彻底消除这项结构账。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-02","SER-S06-04"]},{"id":"SER-S06-02","name":"穗庭 · 第一层中等","region":"闻绛子宇宙","detail":"闻绛已孕育穗庭，维护迁民、界籍、粮能与航路。","limit":"她是地脉，不是隐蔽高层全能存在。","source":"C02","line":5,"sourceExcerpt":"苏木的生父名陆澄，混沌圣脉，任正统续衡议盟的子界维护监察，掌握孕界债务、公共储备与宝库出入档案。他习惯留在母界，珍惜旧庭的亲族往来，曾希望子女长大后仍能在自己熟悉的地方生活。生母闻绛为混沌地脉，是档案整理者与迁民组织者，已孕育第一层中等子宇宙“穗庭”。她擅长住民登记、航路协调和粮能配置，更愿在穗庭长期居住，经营当地河季、作物和自己的交往。她的能力止于地脉及已经建成的子界，没有隐蔽的更高层身份。夫妻相爱，却一直未能把母界监察的生活与穗庭的生活合成一处。","story":"","overview":"陆澄珍惜母界旧庭的亲族往来，闻绛更愿经营穗庭的河季、作物与朋友；夫妻相爱，却未能把两种生活合在一处。政变将家庭拆散，闻绛感激婴儿获救，也怨随机送离的风险由陆澄独自决定。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-01","SER-S06-03"]},{"id":"SER-S06-03","name":"续穗迁民局与民用通道","region":"穗庭／母界交换","detail":"居民议会授权粮能、船队、档案；保存副本并安置迁民。","limit":"闻绛知道婴儿逃出，不知道蓝星坐标；不能无成本收容。","source":"C02","line":33,"sourceExcerpt":"闻绛确定留守穗庭，主持“续穗迁民局”。穗庭居民与她共同度过配给、改种和迁民安置，她也在这里拥有不依附陆家宗族的朋友与生活。她保留孩子的界籍副本，却不把所有新生儿都看作失子补偿，不要求住民替自己等待。她以住民议会授权动员粮能、维护船队和档案人员，限流、内部配给及母子交换仍不可少。她知道婴儿已逃出，但不知道蓝星坐标；可以拒绝两派征用迁民通道，无法凭地脉能力强攻母界。","story":"","overview":"闻绛与居民共同度过配给、改种和迁民安置，在穗庭已有不依附陆家宗族的生活。她急于见丈夫，曾考虑交出私人储备，却拒绝让军需挤掉已登记民用船位，因而遭亲族指责。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-02"]},{"id":"SER-S06-04","name":"静衡囚域","region":"母界内部","detail":"陆澄肉体与意识依稳定材料、节流维生结构低耗维持。","limit":"限制行动与摄取；并非无依附悬空意识。","source":"C02","line":31,"sourceExcerpt":"陆澄抵抗失败后被长期低耗囚禁于母界“静衡囚域”。囚域以稳定材料和节流维生结构维持他的意识与肉体，限制行动、交流与能量摄取。陆离留他是为审问遗物去向、牵制正统及避免杀兄引发政治反噬，也始终不肯接受兄长至死不认可自己。维持一个无法反驳的囚徒并没有恢复早年的亲近，陆澄的长期损伤反而使那份认可越来越不可能。囚禁是真实压制，不是替兄长安排潜伏任务。","story":"","overview":"陆离既想审问遗物去向、牵制正统，也不肯接受兄长始终拒绝认可自己。维持一个无法反驳的囚徒没有恢复早年的亲近，长期损伤反而使那份认可越来越不可能。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-01","SER-S06-11"]},{"id":"SER-S06-05","name":"随机低等子宇宙通道","region":"第一层同层跨界","detail":"陆澄盗太初晶融体后把婴儿小星球推向随机通道，只求逃政变。","limit":"未直接选择蓝星，未知坐标不猜。","source":"C02","line":21,"sourceExcerpt":"陆澄从宝库征调与护界军轮换中察觉行动端倪。早年的碑文只让他相信一件辅助遗物可能维持脆弱载体、协助避险；他不知道太初晶的自然跨层来历，也不知道孩子携带主宰结构。他盗出被族人长期当作普通辅助神器的太初晶，为婴儿佩戴并促成融体，将载有孩子的小星球推向随机低等子宇宙通道，目的只有逃离政变。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-06","SER-S06-12"]},{"id":"SER-S06-06","name":"低等宇宙长漂流","region":"随机入口后的未知路线","detail":"约100亿年按当地历，器灵不能稳定控制方向；晶格补给维生。","limit":"生物成长停滞不让外部时间倒流。","source":"U05","line":24,"sourceExcerpt":"| 长漂流 | 到达低等宇宙后漂流约100亿年，方向无法稳定控制 | 婴儿生物成长停滞，晶格被动补给用于维生和修复 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-05","SER-S06-07"]},{"id":"SER-S06-07","name":"蓝星终点与沉寂","region":"第一层低等宇宙","detail":"到蓝星后沉寂20多亿年，器灵缓慢恢复。","limit":"不是陆澄选择的目的地，也不是器灵安排养父母身份。","source":"U05","line":25,"sourceExcerpt":"| 蓝星沉寂 | 到达蓝星后沉寂20多亿年，器灵缓慢恢复 | 不是器灵安排了养父母的宇宙身份 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-06","SER-S06-08","SER-S06-10"]},{"id":"SER-S06-08","name":"苏木：蓝星收养后成长","region":"蓝星地表","detail":"2029解除成长停滞、置于可发现处、被收养；正常成长恢复。","limit":"特征屏蔽继续；血缘不抹除蓝星养育。","source":"U05","line":27,"sourceExcerpt":"| 2029 | 解除生物成长停滞，将婴儿置于人类可发现处，随后被收养 | 正常成长恢复，远距离血脉特征屏蔽继续 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-07"]},{"id":"SER-S06-09","name":"归墟 · 第一层低等","region":"归墟独立真实世界","detail":"同层合格输入精炼中转与意识接入，不是虚拟游戏。","limit":"蓝星与归墟均为第一层低等，不是上下层。","source":"U06","line":5,"sourceExcerpt":"归墟是第一层低等宇宙内的真实文明世界、能量精炼中转站和意识接入网络，不是制造无限能源的虚拟游戏。界晶集中同层高等宇宙的合格输入，居民和外来者通过修炼精炼能量，净余量用于维护和交换。修炼收益真实，器灵为苏木准备成长条件的利用关系也真实。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-10"]},{"id":"SER-S06-10","name":"蓝星 ↔ 归墟投射链","region":"两端连续载体","detail":"本地身体留在蓝星，归墟真实临时物质体经双向链路行动。","limit":"普通物品与背包不随退出返回；非婴儿漂流路线。","source":"U03","line":25,"sourceExcerpt":"投射不搬走本地身体。源端保持意识连续载体，目的端使用真实的临时物质承载体，通过双向链路运行感知与行动；画面外观可以模拟，意识不能无依附漂浮。链路传回的是经历、知识和受额度约束的能量，不包含装备背包。投射体只是一段连接中的承载，不是自动诞生的第二个人格。","story":"","overview":"归墟临时承载体从目的端真实原料或库存分配，进食、代谢和脱落物都有物质去向。退出或投射死亡只回收合格部分，残料与污染由当地处理；异地回收不能随断线瞬移，独立物品另账保管。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-07","SER-S06-09"]},{"id":"SER-S06-11","name":"囚域维生交接 → 康复载体","region":"远期释放的必要设施链","detail":"先接可持续康复载体及合法安置点，再解除旧囚域连接。","limit":"其他囚禁者不能留在断供设施；自由不消除损伤。","source":"C02","line":43,"sourceExcerpt":"陆澄获得自由是母界停战、民用供给与迁民航道安排的一项后果，不是围困行动的唯一目标。释放须先把囚域维生接到可持续的康复载体与合法安置点，不能以战胜陆离自动消除长期损伤；也不能先带走他而把其他囚禁者留在断供的设施中。闻绛仍需完成居民撤离与粮能职责，陆澄只能逐步恢复生活，团聚不自动变成全家共同远行。血缘重聚不取代养育事实：苏正淮确已死亡，不能被复活、替身或“其实是生父”的改写取消；木向岚恢复自由后的损伤与家庭缺席同样保留。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-04"]},{"id":"SER-S06-12","name":"追查线索 ≠ 蓝星坐标","region":"母界筛查端","detail":"扑空后发现潜在价值；随机记录残缺，屏蔽切断特征关联。","limit":"普通归墟精炼数据无法直接定位苏木。","source":"C02","line":27,"sourceExcerpt":"扑空后，陆离才对残余融体读数、被盗物品记录与候选法进行比对，发现失踪婴儿很可能比原先预计更有价值。这是追查线索，不是已经取得准确身份与去向。他扩大跨界观测，但随机通道记录残缺，后续屏蔽又切断特征关联，不能由归墟普通精炼数据直接定位苏木。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-05"]},{"id":"SER-S07-01","name":"源端：三组织与旧航路合同","region":"第一载体层外来源端","detail":"环门勘采队、协律采矿社、海冕殖留团使用旧联合体航路与合同。","limit":"不编造源端星图；不是混沌统一军，也不是今日四文明。","source":"C04","line":7,"sourceExcerpt":"远古陨石携带自然界晶落入蓝星，散布矿脉和交换节点；它与后来随机漂来的太初晶完全独立。第一批“环门勘采队”测绘矿藏，建立运输及能流参照；其后“协律采矿社”以修炼教育培养劳工，修建多地接口；“海冕殖留团”建立海上殖居网络，有成员选择与本土社会结合。三者皆为第一载体层的外来文明组织，不是混沌族统一殖民军，也不等于今日全部接入文明。它们曾共用“烁环采掠联合体”的合同与航路登记，联合体不是统一国家，烁环返航站是其跨界航路终端。联合体后来解体，终端与未结债权转由独立遗址清算团保管，旧组织的待遇承诺没有自动转为清算团义务；信标收件与失效协议详见[守门人传承](05-守门人传承与非首部组织.md)。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-02","SER-S07-03","SER-S07-04","SER-S07-05","SER-S07-06","SER-S07-07"]},{"id":"SER-S07-02","name":"昆仑：晶陶维护阵列","region":"协律＋本土维护","detail":"山腹晶陶阵列保留各人格；九重增城为分区检验，弱水为低稳定隔离带。","limit":"意识必须有载体；维护与本土权益不能省略。","source":"C04","line":17,"sourceExcerpt":"昆仑曾由协律采矿社管理员群与蓝星本土维护者共同运行。“西王母”是管理员职衔在本土的文化化称呼，并非唯一永生神。早期合作者带回技术、培养亲属，维护家系由此兴盛；外来者离开后，本土守望者依附山腹晶陶阵列接管节点，各自人格与共同维护层并存。九重增城仍逐区检验承载，弱水则是载体稳定性低的隔离带，必须以实际保护结构渡过。","story":"","overview":"干线断供让自愿驻守逐渐成为难以退出的绑定。后裔为供养阵列放弃别处生活，有家系舍不得撤掉已无人格存续的维护位；守望者也为保存旧城还是停用低效段争执。减负能留下离开的余量，不能让死者回来。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-03","name":"冈仁波齐：参照核","region":"环门勘采队","detail":"矿晶＋反馈回路承载缄默者，提供坐标参照与清噪。","limit":"非规则本体；清噪不抹除人格或罪责。","source":"C04","line":25,"sourceExcerpt":"环门勘采队校准原有矿层形成参照核，长期稳定后，矿晶和反馈回路中产生节点意识“缄默者”。它记得的是反复测量、偏差与校正，不是人类王朝的完整兴亡。洪灾令外环参数漂移，核心却保持清醒。外界不断更换名称和朝圣仪式，它仍保留旧参照，以便新旧扰动有可比较的依据；它既非宇宙规则本体，也不等于现实宗教所供奉的神。","story":"","overview":"缄默者担心主动修复改变比较基准，宁可保存参照，也让急需救助者等待。外围维护者有人继续守候，有人改用较不稳定却能及时工作的校准点；清噪过度会连同哀伤损伤与死者有关的记忆。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-04","name":"百慕大：防御入口","region":"海冕外围防务","detail":"海底防御接阿布祖信息夹层；封存晶核承载最后守卫。","limit":"回程损坏／敌我表失效；非全部亚特兰蒂斯实体。","source":"C04","line":33,"sourceExcerpt":"海冕殖留团外围防务局的海底装置连接折叠信息夹层“阿布祖”。最后守卫者依附封存晶核，保存基地撤离账、断线名单与防御记录。这里的历史停在仓促撤离：有人得到离港命令，有人只等来断线，后来销毁基地的命令与留下保全舱的行动并不出自同一批人。百慕大是西侧防御入口，不是亚特兰蒂斯全部实体。","story":"","overview":"最后守卫者不愿删去旧断线名单，怕再次遗弃待核验者，将保存证据与继续封锁捆在一起。救援先修回程、分流和冷却；核验会确认许多早已死亡的人，撤去防御也不能使他们返航。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01","SER-S07-07"]},{"id":"SER-S07-05","name":"马丘比丘：山地载体库","region":"海冕遗留＋太阳祭司","detail":"石晶复合节点；能流积累与载体转换／继承记录。","limit":"交接证据缺失，不把祖名等同活本人。","source":"C04","line":41,"sourceExcerpt":"海冕殖留时期留下山地载体库，后世本土太阳祭司修复、增建，把自己的师承与祖名封入石晶复合节点。光明体系处理积累与能流，黑太阳体系研究载体转换和继承身份。外来技术经过祭司世代改造，不再只是原殖留团的设备说明；各祖名保留程度不同，有的仍有连续过程，有的只剩记录。","story":"","overview":"黑太阳家系曾把重建者当作归来的先人，祭职和亲属照料据此延续。交接证据重核后，一些重生者只被证实为继承者；后人失去旧相伴，新主体却能摆脱扮演祖先的任务，宗教祖名不能剥夺其选择。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-06","name":"吉萨：赫尔墨斯知识载体","region":"协律记录工程＋本土营造","detail":"托特／赫尔墨斯同一编写者，自愿驻留晶陶，编写适配与失败报告。","limit":"非卡壳审判者；完整知识非全三层全知。","source":"C04","line":51,"sourceExcerpt":"托特与赫尔墨斯是同一外来知识编写者的两种文化称呼。他与协律采矿社记录工程师、本土营造和维护群体合作，将修炼、界面适配及失败报告编码于晶陶载体，自愿驻留以继续讲授和校核。他不是困在杜亚特等待净化的审判者，保存的完整也只指当年编写范围，不是三层宇宙的全知。","story":"","overview":"托特坚持连同失败、施工争执和署名一起讲授，部分后世家系却只传扬成功段、利用缺页扩大地位。完整读取损伤某些家族的光荣，也恢复被删贡献；教学磨损晶陶，他宁愿降低授课速度也不删失败页。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-07","name":"亚特兰蒂斯：盐晶集体","region":"海冕成员＋本土共同体","detail":"东大西洋海底折叠主核，盐晶与记忆阵列承载清醒集体。","limit":"波塞冬不无损恢复，成员意见与权利独立。","source":"C04","line":59,"sourceExcerpt":"波塞冬与本土共同体在海冕殖留时期建设基地，主核位于东大西洋海底折叠区，百慕大是远端防御入口。基地物质层在撤离中被毁，幸存保全舱将居民意识交织于盐晶与记忆阵列，形成清醒但意见不一的集体主体。共同体保存了主动殖留者与采掠主力的分歧，也保存漫长共居后的生活，而不只是毁灭那一刻。","story":"","overview":"盐晶共居形成真实亲密，也令成员害怕私人记忆被吸纳。分离者未必能带走两人的全部旧经历，留下者担心复制后的新主体公开隐私；未获授权的片段不复制，技术成功仍会改变共同关系。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01","SER-S07-04"]},{"id":"SER-S07-08","name":"守门席","region":"守门人十二职责席","detail":"召集议会、代表已通过决议、紧急暂停危险仪式","limit":"不独享全部十二段授权，不可永久废席","source":"C05","line":15,"sourceExcerpt":"| 守门席 | 召集议会、代表已通过决议、紧急暂停危险仪式 | 不独享全部十二段授权，不可永久废席 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-09","name":"典藏席","region":"守门人十二职责席","detail":"保存原始档案、登记版本与访问日志","limit":"不得销毁犯罪材料或独占历史结论","source":"C05","line":16,"sourceExcerpt":"| 典藏席 | 保存原始档案、登记版本与访问日志 | 不得销毁犯罪材料或独占历史结论 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-10","name":"觅晶席","region":"守门人十二职责席","detail":"分配近距勘测、核验样本来源","limit":"不能凭异常认定主宰身份或无限追踪","source":"C05","line":17,"sourceExcerpt":"| 觅晶席 | 分配近距勘测、核验样本来源 | 不能凭异常认定主宰身份或无限追踪 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-11","name":"镇讯席","region":"守门人十二职责席","detail":"维护抑制信号的封装与屏蔽设施","limit":"不得把所有外部通信列为敌意","source":"C05","line":18,"sourceExcerpt":"| 镇讯席 | 维护抑制信号的封装与屏蔽设施 | 不得把所有外部通信列为敌意 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-12","name":"返航席","region":"守门人十二职责席","detail":"保管旧信标与返航协议","limit":"不得自行启动邀请或承诺他族效忠","source":"C05","line":19,"sourceExcerpt":"| 返航席 | 保管旧信标与返航协议 | 不得自行启动邀请或承诺他族效忠 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-13","name":"运储席","region":"守门人十二职责席","detail":"安排运输、仓储、实体交接与保险","limit":"不绕过当地边境和归墟物质额度","source":"C05","line":20,"sourceExcerpt":"| 运储席 | 安排运输、仓储、实体交接与保险 | 不绕过当地边境和归墟物质额度 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-14","name":"医载席","region":"守门人十二职责席","detail":"检验承载安全、治疗受损成员","limit":"不强制实验、不以净化抹除人格","source":"C05","line":21,"sourceExcerpt":"| 医载席 | 检验承载安全、治疗受损成员 | 不强制实验、不以净化抹除人格 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-15","name":"遗产席","region":"守门人十二职责席","detail":"协调六遗产外围接触与保管合同","limit":"不替核心主体授予读取资格","source":"C05","line":22,"sourceExcerpt":"| 遗产席 | 协调六遗产外围接触与保管合同 | 不替核心主体授予读取资格 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-16","name":"传习席","region":"守门人十二职责席","detail":"分段授课、训练及兼容资格认证","limit":"不把学员永久绑定为私产","source":"C05","line":23,"sourceExcerpt":"| 传习席 | 分段授课、训练及兼容资格认证 | 不把学员永久绑定为私产 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-17","name":"外交席","region":"守门人十二职责席","detail":"与节点研究团和地方机构订约","limit":"不自行出让居民主权及公共设施","source":"C05","line":24,"sourceExcerpt":"| 外交席 | 与节点研究团和地方机构订约 | 不自行出让居民主权及公共设施 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-18","name":"算储席","region":"守门人十二职责席","detail":"预算、缴费、用途审计与赔付准备金","limit":"不以账面收益冒充实际能量","source":"C05","line":25,"sourceExcerpt":"| 算储席 | 预算、缴费、用途审计与赔付准备金 | 不以账面收益冒充实际能量 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-19","name":"察责席","region":"守门人十二职责席","detail":"调查越权、受理申诉、申请暂停涉事执行者","limit":"不代替司法判罪，不封禁独立证人","source":"C05","line":26,"sourceExcerpt":"| 察责席 | 调查越权、受理申诉、申请暂停涉事执行者 | 不代替司法判罪，不封禁独立证人 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-20","name":"七席常规／九席高危","region":"十二段授权与主体同意","detail":"信标、危险联合读取、大额征用须九席及受影响主体授权。","limit":"医载或察责可短停；独立复核，不授基础协议修改权。","source":"C05","line":28,"sourceExcerpt":"常规事项七席同意；启动信标、危险遗产联合读取或大额征用须九席同意，并取得被影响主体授权。医载、察责任一席可短期暂停高危项目，后续由独立复核决定续停，避免少数席无限否决。十二段授权拼合只是旧记录读取条件，不是更改器灵基础协议的权限，更不保证自动发出“宇宙独立宣言”。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-21","SER-S07-22","SER-S07-23","SER-S07-24"]},{"id":"SER-S07-21","name":"烁环返航站：真实收件端","region":"第一载体层高等宇宙","detail":"独立遗址清算团核验债权、回收危险设备，旧联合体已经解体。","limit":"旧提升承诺失效；清算团不拥有蓝星主权。","source":"C05","line":36,"sourceExcerpt":"信标实际收件端是载体层高等宇宙中的烁环返航站，原烁环采掠联合体的航线登记设施。联合体已经解体，返航站由独立遗址清算团接管，只核验遗产债权和回收危险设备，不再兑现旧雇佣的技术提升与政治地位承诺。守门人译本遗漏了组织存续及授权有效的条件。清算团既无蓝星主权，也不将守门人自动收为属民；世代效忠不会换来他们等候的身份。","story":"","overview":"返航站回送署名清算通知，要求停止自动供能。返航席支持者藏原函、灭灯派删核债条款、利用派争代理生意；典藏和察责副本互校后揭露藏函删译。有人撤捐，有人私下续供，隔离信标、停提取回路和撤供才真正停止旧邀请；有限偿付买不回世代守候的人生。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-22","name":"外国节点研究联合团","region":"现代计量／冷却／证据保全","detail":"经授权交换技术数据，独立复核、退出与非敏感发表。","limit":"资助不控制继承者，不占核心、不公开人格隐私。","source":"C05","line":50,"sourceExcerpt":"“外国节点研究联合团”由吉萨、百慕大等外围研究站和各国学术团队签订项目章程。它提供现代计量、冷却设备与证据保全，收益是经过授权的技术数据、训练和风险预警；拥有复核、退出及发表非敏感结果的权利，不得擅自占领遗产核心、公开人格隐私或以资助控制继承者。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-23","name":"遗产继承者议约","region":"兼容经验／日志／维护合同","detail":"地方保管群与授权代表交换维护基金、安置及文化资料权。","limit":"不能替全部核心签字，传承不豁免侵权。","source":"C05","line":52,"sourceExcerpt":"“遗产继承者议约”由昆仑维护者、太阳祭司后人、亚特兰蒂斯授权代表和其他地方保管群组成。它提供兼容经验、旧日志与合法接触，换取维护基金、安置及文化资料保管权。成员可拒绝读取，必须区分祖名、遗物所有权与活人格权；议约不能替所有遗产签字，也不能因传承历史豁免当代侵权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-24","name":"子界自治网","region":"穗庭／母界／归墟联络站","detail":"交换迁民名额、载体维护与锁能审计。","limit":"仅同意的运输／数据权，无统一统治或强制征兵。","source":"C05","line":54,"sourceExcerpt":"“子界自治网”由穗庭迁民局、母界子界联席及归墟根籍代表互设联络站。它交换迁民名额、载体维护和锁能审计，收益是回流上限、互助储备和不受孕界家族转卖的公民身份。网络尊重地方制度，只有经同意的运输与数据权，无强制征兵、统一统治或全面关断母界的权力。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S08-01","name":"异质旅伴独立远行","region":"第一层大陆与终端","detail":"混编队搬材料、核转接并接回误判者；载体需求决定路线。","limit":"保养舱／回程／带宽／居留均有限，不按苏木身体统排。","source":"C06","line":17,"sourceExcerpt":"核心行动是一支由不同载体组成的跨区混编远行队，协同工坊与巡界群落搬运适配材料、核实中衡转接及各区终端的实际边界，并接回误判滞留者。钧环骨环不能拆作行李，散热鳍占货位；弥珀须保湿盐与独立声部回传；硅庭核心和纠错阵列不能离线拆运；赤翎祖羽封存又与查验相争。西砾陆线省航时但散热昂贵，北霜海线冷却便利却受越冬配额限制，南沧水路适配菌膜但绕行较远。终端带宽、保养舱、回程余量与地方居留许可共同决定路线，不能靠苏木提高修为一项解决。","story":"","overview":"旅伴为署名、声部、慢色谱工期和祖名航位各作选择。苏木的统一航期容不下这些目标，队伍靠改装、减货与轮换接回滞留者；有人只同行一段。退役舱与记忆损伤之外，错过的共同节期、职业窗口和专属泊位也没有恢复。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-02"]},{"id":"SER-S08-02","name":"中衡临时试验出发区","region":"第一层归墟","detail":"北霜断供后改中衡转运，冷却只买居民用后余量。","limit":"运输更远、试验次数少，不能新源无损补齐。","source":"C06","line":41,"sourceExcerpt":"断供使事件4的北霜试验出发港取消，已排定的冷却船位退回地方越冬。实验团改从中衡临时转运区出发，冷却只买得到居民用后余量，增加运输、减少测试，苏木装备升级延后。器灵保有其他工程能力，却没有另一条现成路线填平该地缺口，旧港准备也不能全数搬到新港。","story":"","overview":"北霜后裔从旧林记忆走到定居、迁徙、建仓和现城贸易，早期根籍没有记全后世转让与劳动。他们接手旧仓维修、关闭基金提取，不接受为返乡再迁一次；偿付承认现居权，却不购买恢复供能。原试验港的冷却船位退回地方越冬，旧港准备不能全搬到中衡。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-01","SER-S08-03"]},{"id":"SER-S08-03","name":"第一层实验接收环","region":"第一层耦合端","detail":"太初晶、中心晶体、双方许可与散热储备支持有限实验桥。","limit":"首环永久报废，库存损失真实；不是全族跃迁。","source":"C06","line":53,"sourceExcerpt":"投入为中心浓缩晶体、太初晶稳定窗口、第二层织律载体及散热储备，事件3造成的出发地与冷却缺口仍在。苏木提供特殊耦合结构，不能代替双方许可、研究与其他资源。返回损耗大于预估，第一层接收环永久报废，部分跨层库存耗尽。试验确认织律层可以重建能流关联，却须占用载体并支付维持；工程所得只是一条可限流关闭的实验通道，不是无限能源或全族跃迁。太初晶窗口使用权与苏木人格权分开，公共试验不取得本体全部权限。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-02","SER-S08-04"]},{"id":"SER-S08-04","name":"衡织公社：织律载体端","region":"第二层有限节点","detail":"与第一层实验团只交换测量结构与有限能量。","limit":"首轮不输入完整人格，公共工程不取得太初晶全部权限。","source":"C06","line":47,"sourceExcerpt":"已有背景：太初晶是比器灵古老的自然跨层遗物，器灵来自第二织律层、相遇后依附；其独立来历不等于文明已有公共跨层工程。首次公开验证由第一层多方实验团与第二层“衡织公社”的接口维护者共同完成，只输送测量结构与有限能量，不把任何人的完整人格输入首轮试验。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-03","SER-S08-05","SER-S08-09"]},{"id":"SER-S08-05","name":"律晶节点：位移／能流阻力","region":"第二层实测范围","detail":"同一测量结构在律晶节点表现为位移和阻力变化。","limit":"作用依附节点既有规则，离开不持续。","source":"C06","line":49,"sourceExcerpt":"探索对象是同一动作在不同物质节点上的关联差异：同样推送一枚测量结构，在律晶节点表现为位移与能流阻力变化，在另一组场节点却改变局部连通次序，原先视作近路的方向会接回出发口。作用依附各节点的既有规则与有限相容域，离开节点不持续生效。必须送出、接回、换节点再测，不能凭第一层更高总能量推断织律层怎么运行，也不能拿器灵残缺旧经验当全域地图。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-04","SER-S08-06"]},{"id":"SER-S08-06","name":"场节点：连通次序改变","region":"第二层实测范围","detail":"另一场节点可改变局部连接，近路可能返回出发口。","limit":"必须送出接回换节点，旧经验不是全域地图。","source":"C06","line":49,"sourceExcerpt":"探索对象是同一动作在不同物质节点上的关联差异：同样推送一枚测量结构，在律晶节点表现为位移与能流阻力变化，在另一组场节点却改变局部连通次序，原先视作近路的方向会接回出发口。作用依附各节点的既有规则与有限相容域，离开节点不持续生效。必须送出、接回、换节点再测，不能凭第一层更高总能量推断织律层怎么运行，也不能拿器灵残缺旧经验当全域地图。","story":"","overview":"第一次按器灵旧路判断，未接回约定测量结构与数据，又耗掉储备。苏木随后在获准的实测节点中隔开不相容段、串联可相接段，成功回收并亲手绘成有限往返航图。衡织维护者拒绝连续加测，下一轮须缩样或等待；航图覆盖测试负荷，不替未测路径担保。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-05"]},{"id":"SER-S08-07","name":"母界围困：粮能／迁民／囚域","region":"第一层高等母界","detail":"有限航期护民用船位与维生交接，分开军需和民用口。","limit":"穗庭军需不得挤掉民用船位；集中囚域护送会失守其他航口。","source":"C06","line":59,"sourceExcerpt":"行动集中在有限航期内护住已登记的粮能运输与迁民航道、完成囚域维生交接，并分开军需与民用提取口。正统宗族想保核心城及祖庭，保全会争维生工时，自治联席要留子界冬储与船位，越界同盟要维持阵列和护航军需。闻绛急于见陆澄，却拒绝以穗庭安全通道的军需优先权换提前释放，招致陆家亲族指责；陆澄也不授其子家族资源绝对权。苏木若把护送力量全投囚域，粮能船与迁民口便会失守，最终只能随多方转运一起完成囚域交接。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-08"]},{"id":"SER-S08-08","name":"三组接口互相制衡","region":"母界及子界实体供给","detail":"母界库存／旧子界回流／民用维生以转运和独立核验制衡。","limit":"任何一方单征失去其他安全供给，不是宣言替代物流。","source":"C06","line":63,"sourceExcerpt":"四方依靠护航、现场转运和维生交接，共同接管母界库存、旧子界回流、民用维生三组接口。分段密钥限制开口，独立库存核验确认实物，分开的供能段只能在各自负荷范围内接续；任何一方强提都会失去另外两组的安全供给，迁民航道则让地方真正能将人口与储备移走。陆离失去启动强制阵列所需的军需和回流份额，仍有研究者、宗族与武装支持，却凑不齐三组输入。他不愿毁掉仅存设施，也不愿放弃未来继续研究的机会，遂接受限期停战与受监测的自愿研究。他仍相信整体继承值得押注，对兄长的拒绝仍怀怨，停战出自物理制衡和政治失势，不是转善。","story":"","overview":"连续载体试验确认断链只产生继承者，原人格死亡。部分研究者退出，另一些宗族接受继承家长并逼亲属交配额，护界武装仍支持陆离。军需、回流和维生互相制衡才使他凑不齐强制阵列输入，停战来自失势与设施依赖，不是转善。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-07"]},{"id":"SER-S08-09","name":"第三层：序格与互证载体","region":"源序层有限兼容域","detail":"公共谱院与商庭各有规则生成和兼容载体。","limit":"不是全宇宙主人，不增加第四层。","source":"C06","line":77,"sourceExcerpt":"已有背景：第三源序层以稳定序格载体保存规则生成与兼容条件。“序庭公共谱院”维护开放谱档，“封谱商庭”经营私人兼容许可，双方均非全宇宙主人；源序层低中高是自身承载差，本系列没有第四层。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-04","SER-S08-10","SER-S08-11"]},{"id":"SER-S08-10","name":"开放基础谱支路","region":"源序校验与迁接","detail":"适配旧节点广，可地方修补，但校验慢、缓冲多。","limit":"开放不免费供维护，可能错过航期。","source":"C06","line":79,"sourceExcerpt":"前两层通道扩张后，竞争围绕有限序格、校验工时、维护能量与迁接航期展开。开放基础谱可携带、可由地方修补，适配旧节点范围广，但校验慢、要多留缓冲；商业改进针对部分高负荷节点压低延迟和损耗，能抢在窗口关闭前完成迁接，却收费更高、换供应者需重做验证。封谱商庭要求永久排他有经营动机，不能因此认定其技术全无价值；公共谱院也不能靠免费开放就补足维护预算。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-09","SER-S08-12"]},{"id":"SER-S08-11","name":"商业改进支路","region":"源序许可与迁接","detail":"部分高负荷节点低延迟／低损耗，需付许可费。","limit":"换供应者重验证，商业有价值但不得强永久排他。","source":"C06","line":79,"sourceExcerpt":"前两层通道扩张后，竞争围绕有限序格、校验工时、维护能量与迁接航期展开。开放基础谱可携带、可由地方修补，适配旧节点范围广，但校验慢、要多留缓冲；商业改进针对部分高负荷节点压低延迟和损耗，能抢在窗口关闭前完成迁接，却收费更高、换供应者需重做验证。封谱商庭要求永久排他有经营动机，不能因此认定其技术全无价值；公共谱院也不能靠免费开放就补足维护预算。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-09","SER-S08-12"]},{"id":"SER-S08-12","name":"非排他研究回程支路","region":"三层选定既有节点","detail":"苏木实测与双方授权在有限范围迁接研究回程。","limit":"不增容量；商用费照付；非唯一接口或全域万能航图。","source":"C06","line":83,"sourceExcerpt":"苏木在不同层的有限节点比较兼容路径、试行迁接并争取地方授权。快速商用支路降低部分节点的延迟，却锁定许可成本；开放路线兼容面较广，需更多校验工时和缓冲，混接另须边界验证。他使用事件4亲手航图的有限路径经验，结合两层维护者及源序侧校验，在地方选定范围内完成一条非排他的研究回程支路。它依靠既有节点和实测，不增加物理容量，商用部分照付许可；额外验证使他错过部分其他航期，无法同时替航团保住旧祭期与全部返航名额。衡织维护者和第一层自治联席也按自己的载体、预算选择路线，并不把全部居民押给一个方案。","story":"","overview":"苏木以本人有限航图经验、两层维护者和源序侧校验完成选定范围的非排他研究回程。商业段许可照付，额外验证使他错过其他航期；这条既有节点支路没有新增容量，也不能替航团保住旧祭期和全部返航名额。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-10","SER-S08-11","SER-S08-13","SER-S08-14"]},{"id":"SER-S08-13","name":"永久弃用的旧端口","region":"转换中的载体／航期缺口","detail":"新旧无法同时保养，部分旧通道永久弃用。","limit":"拒接主体仍有权利，不补等价通道抹掉损失。","source":"C06","line":85,"sourceExcerpt":"转换期间，新旧端口无法同时保养，部分旧通道永久弃用。拒绝新标准的航团仍可保留祖羽与祭司制度，却失去原祖名航路；留在新节点的翎民不能返回旧祭场，与当地亲族共同生活的人也无法沿旧路再相见。宗族为谁承担断路责任分裂，有人继续沿用祖名但失去航绩认可，有人改个人名留居，曾离团的人也不因此自动摆脱对故乡的依恋。其他旧载体社区同样失去接入机会，旧独家谱权资产失效，开放和商业双方都有未能维持的端口。苏木的有限研究支路覆盖选定节点，不通往这些永久弃用通道的旧返回地，后续也不补成等价复原路线。","story":"","overview":"旧端口连接的祭场承载祖辈供献、亲族照料与航绩核认，不是换泊位就能替代。断路后有人续祖名却失去认可，有人改个人名留居，离团者也仍眷恋故乡。研究回程支路不通往这些永久弃用通道的旧返回地，后续不补等价复原路线。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-12"]},{"id":"SER-S08-14","name":"有限航图与各自生活","region":"系列远期边界","detail":"苏木保有分批探索与返日常；陆澄康复、闻绛职责节奏独立。","limit":"不要求所有文明永远同路，自然消亡与真实死亡仍在。","source":"C06","line":95,"sourceExcerpt":"苏木保留亲手绘成的有限往返航图、经许可的非排他研究回程支路，以及小规模分批探索、跨层学习、与不同伙伴合作及返回日常生活的能力；不必以终身承担唯一接口换所有人续命，也不能向各文明保证一次合作便永远同路。远行可继续，但只在已确立的三层与预算内开展，不以新的秘密解释既有胜利。陆澄逐步康复，仍想重建熟悉的亲族往来；闻绛完成公共职责后回到穗庭的河季与朋友中，不愿再以等待为全部生活。苏木与他们往来，也保有自己的日常，血缘相认没有补齐家庭缺席。","story":"","overview":"有限往返航图和研究支路让苏木继续分批探索，也返回自己的日常。陆澄康复后仍想重建熟悉的亲族往来，闻绛回到穗庭的河季与朋友中；相认不补齐家庭缺席。旧林、报废试验环、断裂祖名航路和已经分开的关系仍是各自生活的一部分。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-12"]},{"id":"SER-S08-15","name":"独立旅程，不是逐章时间线","region":"系列图册读法","detail":"事件有远行、库存、城市、往返实验、围困与兼容竞争等不同体验。","limit":"连线表示空间、物流和载体依赖；间距不推定航期或逐章次序。","source":"INDEX","line":19,"sourceExcerpt":"系列事件从混编远行和误判救援开始，继而争夺真正可运走的晶体库存。北霜后裔关掉成长基金的提取口，留下自己的城市，苏木只好换港出发；他在陌生织律节点一次次送出测量结构，想亲手画成能往返的航图。母界围困要求先护粮能、迁民与囚域维生，血亲团聚随之而来，却不是所有人的目的。已经独立生活的继承者不肯接回旧人的人生任务；更高层的迁接又使一支赤翎航团永久失去祖名返回地。苏木保住一条有限研究支路，不能替他们把故乡接回来。最后，各种生活仍在继续，有人同行，有人另走自己的路。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]}],"sheets":[{"id":"S01","title":"三层九格存在结构与上下适配","filename":"S01-三层九格存在结构与上下适配.svg","width":1900,"height":1800,"points":[{"id":"SER-S01-01","name":"源序低等","region":"源序层","detail":"生成核＋校验阵列；有限跨层输入；核介质过程生命","limit":"生成偏差超过纠错 ":17,"sourceExcerpt":"| 载体低等 | 单一主时空，局部循环孤立 | 初始储能、恒星释放、有限交换 | 肉体、矿物核、实体设备 | 时空闭合面与交换点 | 补充物质，接通循环，增设缓冲 | 储能枯竭或时空支撑失稳 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S01-08","name":"载体中等","region":"载体层","detail":"多区域时空＋联络带；多星系与配给；复合实体","limit":"联络带断裂会发生区域脱落","source":"U01","line":18,"sourceExcerpt":"| 载体中等 | 多区域时空及稳定联络带 | 多星系释放、母界配给、回收 | 肉体与跨区域复合实体 | 各域共同闭合面 | 整合联络带，减少传输耗散 | 联络带断裂引发区域脱落 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S01-09","name":"载体高等","region":"载体层","detail":"主时空＋自主子界接口；库存与成熟反哺；大型实体群","limit":"子界锁能／共振可令母界塌缩","source":"U01","line":19,"sourceExcerpt":"| 载体高等 | 大尺度主时空及众多自主子界接口 | 巨量库存、成熟子界反哺 | 宇宙级通道生命、大型实体群 | 主界边界与受控子界口 | 提升调度、承载与反哺效率 | 锁能积累、接口共振致主界塌缩 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S01-10","name":"同层实体通道","region":"第一层内部","detail":"时空锚、实体通道与边界缓冲连接同层不同等级。","limit":"须支付搬运、定位、冷却与应力成本。","source":"U03","line":9,"sourceExcerpt":"| 载体层同层 | 时空锚、实体通道与边界缓冲 | 搬运、边界应力、定位和冷却 | 航路偏移、实体撕裂、漂流 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-11"]},{"id":"SER-S01-11","name":"上下适配：载体 ↔ 织律","region":"第一／第二层","detail":"物质状态与规则状态双向耦合；不能只吸能量。","limit":"转码、供能与适配载体不可省略。","source":"U03","line":12,"sourceExcerpt":"| 载体与织律之间 | 物质状态和规则状态的双向耦合桥 | 输入供能、转码、适配载体 | 规则灼伤、桥端解体 |","story":"","overview":"水碳生命跨入织律层前，源端维持身体，目的端预置相容物质舱与律晶材料节点；先校核呼吸、代谢和感知的往返状态，再开放自主活动。律晶不取代食物与肉身，失败时退回保留的源端过程。","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-10","SER-S01-12"]},{"id":"SER-S01-12","name":"上下适配：织律 ↔ 源序","region":"第二／第三层","detail":"规则实例与生成依据经互证桥关联。","limit":"维护基准、生成验证与纠错须付费。","source":"U03","line":13,"sourceExcerpt":"| 织律与源序之间 | 规则实例和生成依据的互证桥 | 生成验证、基准维护、纠错 | 错误规则扩散、验证崩溃 |","story":"","overview":"源序侧实体校验阵列以独立基准验证受限规则实例和生成依据，持续输入与连续载体链共同承接意识。验证预算不足便缩小活动范围或逐段回程，独立副本另作新人格。","sections":[],"storyLine":0,"storySource":"","related":["SER-S01-11"]},{"id":"SER-S01-13","name":"高层仍有 陆块，承担东方接入分区 |","story":"","overview":"东岚的河谷、林地和城港在亿年发展中分化，土地开发、林权争夺与工坊师承改变了种子聚落；今日居民不是等待建造者分配用途的原始群落。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-07"]},{"id":"SER-S02-02","name":"西砾","region":"北半球西方","detail":"干燥矿带、高原；材料加工。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":22,"sourceExcerpt":"| 北半球西部 | 西砾 | 干燥矿带与高原，承担材料加工和西方接入 |","story":"","overview":"西砾矿带经历开井、封井和围绕新水源重建聚落，旧矿井与新住区留下不同世代的劳动和土地关系。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-03","name":"南沧","region":"北半球南方","detail":"湖海与岛链；航运和南方接入。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":23,"sourceExcerpt":"| 北半球南部 | 南沧 | 湖海及岛链密集，承担航运和南方接入 |","story":"","overview":"南沧水栖城与浮台随海岸改变迁移，航路和共生生态成为不同群体的家业，旧种子身份不能代替现居权益。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-04","name":"北霜","region":"北半球北方","detail":"冰原、地下聚落；耐寒载体与北方接入。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":24,"sourceExcerpt":"| 北半球北部 | 北霜 | 寒冷冰原与地下聚落，承担耐寒载体和北方接入 |","story":"","overview":"北霜后裔承接已毁旧林的记忆，经历本地定居、季节迁徙和仓储城群兴起。旧仓继承与后来住民的建城劳动并不总属同一家系；居民留住现城和越冬储备，不恢复成长基金供能。","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-05","name":"中衡","region":"北半球中央","detail":"四大陆交通、能源分流与浓缩晶体配给。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":25,"sourceExcerpt":"| 北半球中央 | 中衡 | 四大陆交通、能源分流和浓缩晶体配给枢纽 |","story":"","overview":"中衡转运与认证逐渐形成跨地方的城市网络；极渊凝晶和界面工程吸引高密度家系与工匠。配额、工役和迁民争执伴随资源集中，城市与收益已不是器灵可任意收回的工程资产。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-10"]},{"id":"SER-S02-06","name":"极渊","region":"南极中心","detail":"高压环境；核心维护和主要浓缩产区。","limit":"轮廓为拓扑绘图，不给未测海岸、国界或尺度。","source":"U06","line":26,"sourceExcerpt":"| 南极中心 | 极渊 | 高压能量环境，核心维护及主要浓缩产区 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-10"]},{"id":"SER-S02-07","name":"澄岚：银河级承接","region":"东岚外缘隔海","detail":"承接蓝星所在银河系全部生命谱系；展开陆地约3.2万亿平方公里。","limit":"不是第七基础大陆，不把银河承接画成蓝星小岛。","source":"U06","line":30,"sourceExcerpt":"澄岚是东岚外缘隔海的银河系级承接大陆，负责蓝星所在银河系的全部生命谱系与相应生境；不是六基础大陆之一。“外缘陆块”只指相对归墟全域的拓扑地位，不指蓝星尺度的小岛。其有物质接续的展开陆地约3.2万亿平方公里，内部八方按银河星盘八个方位扇区聚合不同源地，盘面高度与距中心远近另作索引；中央天衡中域是澄岚自身的繁华腹地，不是中衡中心大陆，也不产九阶以上专用浓缩晶体。蓝星使用东南万岬域的初渡六区，地方设定与行动另行记录。","story":"","overview":"源地定位正确仍须逐组核验承接容量：适配地表、完整食物网、原料、持续输入、散热和下次补给前备用同时达标。展开面积不生成粮水或载具，未详测谱系的需求仍须实测证明。","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-01","SER-S02-08"]},{"id":"SER-S02-08","name":"天衡中域 ≠ 中衡","region":"澄岚内部","detail":"天衡是澄岚繁华腹地；中衡是全域分流大陆。","limit":"天衡不产九阶以上专用浓缩晶体。","source":"U06","line":30,"sourceExcerpt":"澄岚是东岚外缘隔海的银河系级承接大陆，负责蓝星所在银河系的全部生命谱系与相应生境；不是六基础大陆之一。“外缘陆块”只指相对归墟全域的拓扑地位，不指蓝星尺度的小岛。其有物质接续的展开陆地约3.2万亿平方公里，内部八方按银河星盘八个方位扇区聚合不同源地，盘面高度与距中心远近另作索引；中央天衡中域是澄岚自身的繁华腹地，不是中衡中心大陆，也不产九阶以上专用浓缩晶体。蓝星使用东南万岬域的初渡六区，地方设定与行动另行记录。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-07"]},{"id":"SER-S02-09","name":"连续地表展开网络","region":"归墟有效地表","detail":"各段有真实物质、路径、日照、重力、生态条件。","limit":"建设和维生散热付有限预算；接缝不免费搬运。","source":"U06","line":32,"sourceExcerpt":"归墟地表沿长期稳定的空间展开网络获得大于外观球面的有效面积；各段有实际物质、连续路径和可测的日照、重力与生态条件。扩展不复制同一份物质库存，构建、持续接续、维生与散热由归墟有限输入及已配置储能支撑；新承接生命先落实生境容量。普通路面接续与另有资格的实体运输分开，不能通过退出重登或穿过地图接缝免费搬运。亿年自然发展继承已有基底、陆海和水库存，地质运动持续改造各地方山系；百万公里地貌带由多个地方构造区与山系接续，不是一条蓝星尺度的单一山脉。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S02-10","name":"唯一地下巨界晶","region":"极渊地下","detail":"折叠晶格网络按等效展开尺度计量。","limit":"非银河实体塞球；中衡不是第二颗核心。","source":"U06","line":34,"sourceExcerpt":"巨型界晶位于极渊地下的折叠空间。所谓“银河系大小”是晶格网络等效展开尺度，不是把银河系实体直径塞进星球；折叠拓扑有真实锚点、储能与维护成本。核心集中输入并生成浓缩晶体，产物沿中衡分流，界晶本体不是可无限开采的矿山。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S02-06","SER-S02-05"]}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"1750\" viewBox=\"0 0 1900 1750\" role=\"img\" aria-labelledby=\"S02-title S02-desc\" font-family=\"PingFang SC, Microsoft YaHei, sans-serif\" fill=\"{{ink}}\">\u003ctitle id=\"S02-title\">归墟 · 六基础大陆与银河承接拓扑\u003c/title>\u003cdesc id=\"S02-desc\">北半球：东／西 "{{muted}}\">依据 U06「本质与建设历时」「六大陆与核心」；U05「两种晶体不能混用」；U02「循环账本」。同层与跨层输入分账。\u003c/text>\u003crect x=\"65\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{paper}}\"/>\u003crect x=\"82\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{sea}}\"/>\u003crect x=\"99\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{land}}\"/>\u003crect x=\"116\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{ink}}\"/>\u003crect x=\"133\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{muted}}\"/>\u003crect x=\"150\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{line}}\"/>\u003crect x=\"167\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{coast}}\"/>\u003crect x=\"184\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{water}}\"/>\u003crect x=\"201\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{terrain}}\"/>\u003crect x=\"218\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{road}}\"/>\u003crect x=\"235\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{old}}\"/>\u003crect x=\"252\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{risk}}\"/>\u003crect x=\"269\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{system}}\"/>\u003crect x=\"286\" y=\"1740\" width=\"12\" height=\"5\" fill=\"{{inverse}}\"/>\u003ctext x=\"1835\" y=\"1745\" font-size=\"14\" text-anchor=\"end\" fill=\"{{muted}}\">S03 · 系列独立图册 / 拓扑非比例\u003c/text>\u003c/svg>"},{"id":"S04","title":"四文明与三条实体物流","filename":"S04-四文明与三条实体物流.svg","width":1900,"height":1850,"points":[{"id":"SER-S04-01","name":"钧环技术协约 · II型","region":"西砾接入","detail":"碳基躯体＋外置骨环＋神经陶层；依赖散热工艺。","limit":"骨环是意识承载链，不能拆作行李。","source":"C03","line":7,"sourceExcerpt":"**钧环技术协约，II型。**主体钧环人以碳基躯体、外置骨环与神经陶层共同承载意识，移除骨环需逐段交接，不能把它当普通装备。恒星环带各居住站按基础人口和维护贡献组成协约议会，工业承包商接受站民负荷审计，工艺署名与竞赛名誉却归各自匠系。经济依赖恒星采能、散热与输能管线，归墟精炼服务能降低损耗，不能增加恒星总输出。连续意识不可恢复地终止就是死亡，档案副本只有继承资格。","story":"","overview":"钧环匠系偏爱可辨的骨环接缝和有署名的散热鳍，为展示工艺押下私储、争抢委托；借竞争者接口可能失去名誉与订单。学徒有人离系取得自己的工艺名，合修因此不能只靠公布负荷解决。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-06"]},{"id":"SER-S04-02","name":"弥珀共鸣共同体 · II型","region":"南沧节点","detail":"菌膜＋矿盐骨架；共享交流网仍有独立人格。","limit":"湿盐保养与独立回传不可合并省费。","source":"C03","line":13,"sourceExcerpt":"**弥珀共鸣共同体，II型。**弥珀人为半透明菌膜与矿盐骨架的共生种族，每个个体都有独立意识；共享菌网是交流载体，不自动构成同一人格。聚落由不同共鸣节群轮值治理，少数节群可退出公共合唱。恒星温差与共生生态供能，公共奖励偏向病弱载体，个人仍可积累私储。死亡是个体自我组织不可恢复，回归菌网保存片段不等于活着。","story":"","overview":"弥珀以独立声部辨认彼此，开放私人声部是信任，却不取消独唱的愿望。远行者追求新声部，留下的伴侣想延续共同节期；分居后公共合唱重排，获准分享的经历不能补回亲密。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-07"]},{"id":"SER-S04-03","name":"硅庭人工生命 · III型","region":"中衡常驻公民庭","detail":"光硅核心＋分布式纠错阵列；新副本为新公民。","limit":"连续链不能离线拆运；算能不等于无限。","source":"C03","line":19,"sourceExcerpt":"**硅庭人工生命，III型。**主体是人工制造却真正形成独立意识的硅庭人，意识依附光硅核心和分布式纠错阵列。制造工厂没有人格所有权，新意识诞生后即取得公民资格；创建副本会形成新的权利主体，而非可删除的备份。各星系公民庭与公共算能署共同治理，多恒星能源网络仍受算能、纠错材料和冷却容量限制。连续载体链破裂判定死亡，备份恢复须声明继承而非复活；它不等同蓝星当前AI。","story":"","overview":"硅庭创作者保留耗能更高的旧光路与慢色谱，连续作品占用算能、冷却和纠错材料。计量员转做航图会失去职业津贴；保住工作阵列也会减掉探索器材，朋友未必一直等候。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-08"]},{"id":"SER-S04-04","name":"赤翎祖庭 · II型","region":"极渊合约祭场","detail":"羽骨有机载体＋胸部结晶索引；祖羽保存记录。","limit":"祖名记录不是活人格；祭场限合约区。","source":"C03","line":25,"sourceExcerpt":"**赤翎祖庭，II型星际祭司文明。**赤翎人为羽骨有机载体，胸部结晶维持记忆索引，祖羽遗物保存先人记录但不普遍存有活人格。各迁徙星团由世袭祭司和航团长共同议事，教职不因接入而改成民主制度。恒星祭场和迁徙航路供能，誓约供献也维持祖名等级与航团声望，存在赎买地位的不平等。它承认死者身份不可出售，允许经仪式认可的继承者续用祖名。","story":"","overview":"赤翎祖名带来航位、祭场和照料，也要求延续祖辈航绩。贫家航绩可能归入庇护宗族，改个人名离团者失去专属泊位；祭期与祖羽封存使年轻航者承担实际风险，接入不改其祭司制度。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-09"]},{"id":"SER-S04-05","name":"北霜冷却海线","region":"北方海路","detail":"冷却便利，冷却物资与能量存储供运输保养。","limit":"本地越冬限额优先，不能抽光冬储。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-08"]},{"id":"SER-S04-06","name":"西砾耐压陆线","region":"西方陆路","detail":"耐压材料充足，支撑封装与维修；可省航时。","limit":"散热昂贵，不能用材料丰富代替 方接入分区 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S04-11","name":"实物库存 ≠ 仓单","region":"晶契仓储／运输","detail":"合法承运者收费、保险与限载；超售不增加实物。","limit":"账面凭证不能生出晶体，失效库存须赔付。","source":"C03","line":52,"sourceExcerpt":"“晶契商盟”经营晶体分级、仓储、保险与结算。浓缩晶体是可消耗的稳定能量封装，界晶是通道结构，两者不能混卖。商盟内部并非同一行动者：合法承运者靠实装货物、安全航期和持续委托盈利，愿支持保库存与维持居民订单；另一些仓单经营者超售未来产能，减产后试图用军备高价订单抢走现货和冷却船位。前者不是无偿善人，会坚持运费、保险与限载，后者也不能靠一张仓单取得不存在的晶体。失效库存须赔付，晶体不自生利息，金融凭证不能冒充物理储备。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-12"]},{"id":"SER-S04-12","name":"居民维生先于主角装备","region":"远期库存保卫","detail":"护库、保冷却、维持民用订单不能靠占一处全得。","limit":"冷却断供会报废晶体，意识退出不运实物。","source":"C03","line":56,"sourceExcerpt":"四基础大陆通过海路运送材料、冷却物资及粮食，经中衡认证后换取极渊晶体；极渊高密度资源必须封装、限额和冷却，沿途损耗入账。运输要在北霜冷却但受越冬限额的海线、西砾耐压材料充足但散热昂贵的陆线、南沧湿盐补给便利但绕行较远的水路间取舍，中衡查验也占用实际停泊时间。护住极渊仓库却丢掉冷却补给，晶体仍会报废；抢占关口只能获得局部航期，不能免费换出整条物流。普通意识退出不搬运实物，跨界物质交易只能使用另有额度的合法实体通道。","story":"","overview":"库存争夺中，苏木先保居民载体生活，放弃预订的独家承载装备；准备金和高阶私储仍不够覆盖全部订单。部分城市停工，失去连续供给的基础工程报废，产能恢复也不抹掉破产合同与建设窗口。","sections":[],"storyLine":0,"storySource":"","related":["SER-S04-11"]}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"1850\" viewBox=\"0 0 1900 1850\" role=\"img\" aria-labelledby=\"S04-title S04-desc\" font-family=\"PingFang SC, Microsoft YaHei, sans-serif\" fill=\"{{ink}}\">\u003ctitle id=\"S04-title\">四文明 · 三条实体物流与归墟转运瓶颈\u003c/title>\u003cdesc id=\"S04-desc\">实线是人员／实装材料运输；三线为方案取舍而非测距航图；型别只描述能源与组织范围，不代表宇宙层级。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。\u003c/desc>\u003cdefs>\u003cmarker id=\"S04-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"context-stroke\"/>\u003c/marker>\u003cpattern id=\"S04-strata\" width=\"28\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 18H28M0 6H15\" stroke=\"{{terrain}}\" opacity=\".22\"/>\u003c/pattern>\u003cstyle>.place{cursor:pointer}.place:focus{outline: "1670\" font-size=\"17\" fill=\"{{muted}}\">倍率换算只是12h×固定档的经历上界，不新增可用能量、长寿保证或外部肉身同步成长；退出不是物品传送。\u003c/text>\u003ctext x=\"65\" y=\"1698\" font-size=\"17\" fill=\"{{muted}}\">依据 U06《归墟全域构造与文明接入》「四类标志设施」：入场规则、败退保护、固定时域与回传校准。\u003c/text>\u003crect x=\"65\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{paper}}\"/>\u003crect x=\"82\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{sea}}\"/>\u003crect x=\"99\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{land}}\"/>\u003crect x=\"116\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{ink}}\"/>\u003crect x=\"133\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{muted}}\"/>\u003crect x=\"150\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{line}}\"/>\u003crect x=\"167\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{coast}}\"/>\u003crect x=\"184\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{water}}\"/>\u003crect x=\"201\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{terrain}}\"/>\u003crect x=\"218\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{road}}\"/>\u003crect x=\"235\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{old}}\"/>\u003crect x=\"252\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{risk}}\"/>\u003crect x=\"269\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{system}}\"/>\u003crect x=\"286\" y=\"1737\" width=\"12\" height=\"5\" fill=\"{{inverse}}\"/>\u003ctext x=\"1835\" y=\"1742\" font-size=\"14\" text-anchor=\"end\" fill=\"{{muted}}\">S05 · 系列独立图册 / 拓扑非比例\u003c/text>\u003c/svg>"},{"id":"S06","title":"母界穗庭囚域与随机漂流关系","filename":"S06-母界穗庭囚域与随机漂流关系.svg","width":1900,"height":1850,"points":[{"id":"SER-S06-01","name":"混沌母界 · 第一层高等","region":"母宇宙","detail":"母界及子界的总量有限，成形锁能和反哺滞后造成存续压力。","limit":"不是第二层；高等不免除衰退与成本。","source":"C01","line":31,"sourceExcerpt":"母子宇宙合计能量有限。精炼改善结构、纯度与可用比例，不增加总量；新生宇宙将大量能量锁入膨胀、物质与生命，回流通常迟于母界支出。老化母界又需更多能量维持结构，遂出现繁荣与短期存续相冲突的危机。压缩训练和减少浪费能争取时间，不能彻底消除这项结构账。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-02","SER-S06-04"]},{"id":"SER-S06-02","name":"穗庭 · 第一层中等","region":"闻绛子宇宙","detail":"闻绛已孕育穗庭，维护迁民、界籍、粮能与航路。","limit":"她是地脉，不是隐蔽高层全能存在。","source":"C02","line":5,"sourceExcerpt":"苏木的生父名陆澄，混沌圣脉，任正统续衡议盟的子界维护监察，掌握孕界债务、公共储备与宝库出入档案。他习惯留在母界，珍惜旧庭的亲族往来，曾希望子女长大后仍能在自己熟悉的地方生活。生母闻绛为混沌地脉，是档案整理者与迁民组织者，已孕育第一层中等子宇宙“穗庭”。她擅长住民登记、航路协调和粮能配置，更愿在穗庭长期居住，经营当地河季、作物和自己的交往。她的能力止于地脉及已经建成的子界，没有隐蔽的更高层身份。夫妻相爱，却一直未能把母界监察的生活与穗庭的生活合成一处。","story":"","overview":"陆澄珍惜母界旧庭的亲族往来，闻绛更愿经营穗庭的河季、作物与朋友；夫妻相爱，却未能把两种生活合在一处。政变将家庭拆散，闻绛感激婴儿获救，也怨随机送离的风险由陆澄独自决定。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-01","SER-S06-03"]},{"id":"SER-S06-03","name":"续穗迁民局与民用通道","region":"穗庭／母界交换","detail":"居民议会授权粮能、船队、档案；保存副本并安置迁民。","limit":"闻绛知道婴儿逃出，不知道蓝星坐标；不能无成本收容。","source":"C02","line":33,"sourceExcerpt":"闻绛确定留守穗庭，主持“续穗迁民局”。穗庭居民与她共同度过配给、改种和迁民安置，她也在这里拥有不依附陆家宗族的朋友与生活。她保留孩子的界籍副本，却不把所有新生儿都看作失子补偿，不要求住民替自己等待。她以住民议会授权动员粮能、维护船队和档案人员，限流、内部配给及母子交换仍不可少。她知道婴儿已逃出，但不知道蓝星坐标；可以拒绝两派征用迁民通道，无法凭地脉能力强攻母界。","story":"","overview":"闻绛与居民共同度过配给、改种和迁民安置，在穗庭已有不依附陆家宗族的生活。她急于见丈夫，曾考虑交出私人储备，却拒绝让军需挤掉已登记民用船位，因而遭亲族指责。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-02"]},{"id":"SER-S06-04","name":"静衡囚域","region":"母界内部","detail":"陆澄肉体与意识依稳定材料、节流维生结构低耗维持。","limit":"限制行动与摄取；并非无依附悬空意识。","source":"C02","line":31,"sourceExcerpt":"陆澄抵抗失败后被长期低耗囚禁于母界“静衡囚域”。囚域以稳定材料和节流维生结构维持他的意识与肉体，限制行动、交流与能量摄取。陆离留他是为审问遗物去向、牵制正统及避免杀兄引发政治反噬，也始终不肯接受兄长至死不认可自己。维持一个无法反驳的囚徒并没有恢复早年的亲近，陆澄的长期损伤反而使那份认可越来越不可能。囚禁是真实压制，不是替兄长安排潜伏任务。","story":"","overview":"陆离既想审问遗物去向、牵制正统，也不肯接受兄长始终拒绝认可自己。维持一个无法反驳的囚徒没有恢复早年的亲近，长期损伤反而使那份认可越来越不可能。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-01","SER-S06-11"]},{"id":"SER-S06-05","name":"随机低等子宇宙通道","region":"第一层同层跨界","detail":"陆澄盗太初晶融体后把婴儿小星球推向随机通道，只求逃政变。","limit":"未直接选择蓝星，未知坐标不猜。","source":"C02","line":21,"sourceExcerpt":"陆澄从宝库征调与护界军轮换中察觉行动端倪。早年的碑文只让他相信一件辅助遗物可能维持脆弱载体、协助避险；他不知道太初晶的自然跨层来历，也不知道孩子携带主宰结构。他盗出被族人长期当作普通辅助神器的太初晶，为婴儿佩戴并促成融体，将载有孩子的小星球推向随机低等子宇宙通道，目的只有逃离政变。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-06","SER-S06-12"]},{"id":"SER-S06-06","name":"低等宇宙长漂流","region":"随机入口后的未知路线","detail":"约100亿年按当地历，器灵不能稳定控制方向；晶格补给维生。","limit":"生物成长停滞不让外部时间倒流。","source":"U05","line":24,"sourceExcerpt":"| 长漂流 | 到达低等宇宙后漂流约100亿年，方向无法稳定控制 | 婴儿生物成长停滞，晶格被动补给用于维生和修复 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-05","SER-S06-07"]},{"id":"SER-S06-07","name":"蓝星终点与沉寂","region":"第一层低等宇宙","detail":"到蓝星后沉寂20多亿年，器灵缓慢恢复。","limit":"不是陆澄选择的目的地，也不是器灵安排养父母身份。","source":"U05","line":25,"sourceExcerpt":"| 蓝星沉寂 | 到达蓝星后沉寂20多亿年，器灵缓慢恢复 | 不是器灵安排了养父母的宇宙身份 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-06","SER-S06-08","SER-S06-10"]},{"id":"SER-S06-08","name":"苏木：蓝星收养后成长","region":"蓝星地表","detail":"2029解除成长停滞、置于可发现处、被收养；正常成长恢复。","limit":"特征屏蔽继续；血缘不抹除蓝星养育。","source":"U05","line":27,"sourceExcerpt":"| 2029 | 解除生物成长停滞，将婴儿置于人类可发现处，随后被收养 | 正常成长恢复，远距离血脉特征屏蔽继续 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-07"]},{"id":"SER-S06-09","name":"归墟 · 第一层低等","region":"归墟独立真实世界","detail":"同层合格输入精炼中转与意识接入，不是虚拟游戏。","limit":"蓝星与归墟均为第一层低等，不是上下层。","source":"U06","line":5,"sourceExcerpt":"归墟是第一层低等宇宙内的真实文明世界、能量精炼中转站和意识接入网络，不是制造无限能源的虚拟游戏。界晶集中同层高等宇宙的合格输入，居民和外来者通过修炼精炼能量，净余量用于维护和交换。修炼收益真实，器灵为苏木准备成长条件的利用关系也真实。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-10"]},{"id":"SER-S06-10","name":"蓝星 ↔ 归墟投射链","region":"两端连续载体","detail":"本地身体留在蓝星，归墟真实临时物质体经双向链路行动。","limit":"普通物品与背包不随退出返回；非婴儿漂流路线。","source":"U03","line":25,"sourceExcerpt":"投射不搬走本地身体。源端保持意识连续载体，目的端使用真实的临时物质承载体，通过双向链路运行感知与行动；画面外观可以模拟，意识不能无依附漂浮。链路传回的是经历、知识和受额度约束的能量，不包含装备背包。投射体只是一段连接中的承载，不是自动诞生的第二个人格。","story":"","overview":"归墟临时承载体从目的端真实原料或库存分配，进食、代谢和脱落物都有物质去向。退出或投射死亡只回收合格部分，残料与污染由当地处理；异地回收不能随断线瞬移，独立物品另账保管。","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-07","SER-S06-09"]},{"id":"SER-S06-11","name":"囚域维生交接 → 康复载体","region":"远期释放的必要设施链","detail":"先接可持续康复载体及合法安置点，再解除旧囚域连接。","limit":"其他囚禁者不能留在断供设施；自由不消除损伤。","source":"C02","line":43,"sourceExcerpt":"陆澄获得自由是母界停战、民用供给与迁民航道安排的一项后果，不是围困行动的唯一目标。释放须先把囚域维生接到可持续的康复载体与合法安置点，不能以战胜陆离自动消除长期损伤；也不能先带走他而把其他囚禁者留在断供的设施中。闻绛仍需完成居民撤离与粮能职责，陆澄只能逐步恢复生活，团聚不自动变成全家共同远行。血缘重聚不取代养育事实：苏正淮确已死亡，不能被复活、替身或“其实是生父”的改写取消；木向岚恢复自由后的损伤与家庭缺席同样保留。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-04"]},{"id":"SER-S06-12","name":"追查线索 ≠ 蓝星坐标","region":"母界筛查端","detail":"扑空后发现潜在价值；随机记录残缺，屏蔽切断特征关联。","limit":"普通归墟精炼数据无法直接定位苏木。","source":"C02","line":27,"sourceExcerpt":"扑空后，陆离才对残余融体读数、被盗物品记录与候选法进行比对，发现失踪婴儿很可能比原先预计更有价值。这是追查线索，不是已经取得准确身份与去向。他扩大跨界观测，但随机通道记录残缺，后续屏蔽又切断特征关联，不能由归墟普通精炼数据直接定位苏木。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S06-05"]}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"1850\" viewBox=\"0 0 1900 1850\" role=\"img\" aria-labelledby=\"S06-title S06-desc\" font-family=\"PingFang SC, Microsoft YaHei, sans-serif\" fill=\"{{ink}}\">\u003ctitle id=\"S06-title\">母界／穗庭／静衡囚域 · 随机漂流与蓝星终点\u003c/title>\u003cdesc id=\"S06-desc\">同层等级位置与载体去向图；曲线不表示直达星路、共同公历或线性旅行年表；未知坐标保留未知。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。\u003c/desc>\u003cdefs>\u003cmarker id=\"S06-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"context-stroke\"/>\u003c/marker>\u003cpattern id=\"S06-strata\" width=\"28\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 18H28M0 6H15\" stroke=\"{{terrain}}\" opacity=\".22\"/>\u003c/pattern>\u003cstyle>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:{{risk}};stroke-width:4}.halo{paint-order:stroke;stroke:{{paper}};stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}\u003c/style>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"1900\" height=\"1850\" fill=\"{{paper}}\"/>\u003crect x=\"0\" y=\"0\" width=\"18\" height=\"1850\" fill=\"{{system}}\"/>\u003ctext x=\"66\" y=\"65\" font-size=\"36\" font-weight=\"700\">母界／穗庭／静衡囚域 · 随机漂流与蓝星终点\u003c/text>\u003ctext x=\"66\" y=\"109\" font-size=\"18\" fill=\"{{muted}}\">同层等级位置与载体去向图；曲线不表示直达星路、共同公历或线性旅行年表；未知坐标保留未知\u003c/text>\u003ctext x=\"1834\" y=\"65\" font-size=\"28\" text-anchor=\"end\" fill=\"{{old}}\">S06\u003c/text>\u003cline x1=\"65\" y1=\"133\" x2=\"1835\" y2=\"133\" stroke=\"{{line}}\"/>\u003crect x=\"80\" y=\"195\" width=\"1740\" height=\"630\" rx=\"35\" fill=\"{{sea}}\" stroke=\"{{water}}\"/>\u003ctext x=\"108\" y=\"235\" font-size=\"25\" font-weight=\"650\">第一载体层 · 高等母界 ↔ 中等穗庭 ↔ 随机低等入口\u003c/text>\u003cg class='place' data-key='SER-S06-01' role='button' tabindex='0' aria-label='混沌母界 · 第一层高等：母界及子界的总量有限，成形锁能和反哺滞后造成存续压力。；限制：不是第二层；高等不免除衰退与成本。'>\u003ctitle>混沌母界 · 第一层高等 · C01:31\u003c/title>\u003cellipse cx=\"480\" cy=\"510\" rx=\"322\" ry=\"223\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"3\"/>\u003ctext x=\"260\" y=\"381\" font-size=\"30\" font-weight=\"650\">混沌母界\u003c/text>\u003ctext x=\"260\" y=\"419\" font-size=\"19\" fill=\"{{muted}}\">第一层 · 高等\u003c/text>\u003ctext x=\"260\" y=\"451\" font-size=\"19\" fill=\"{{muted}}\">公共库存／子界锁能／接口维护\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S06-04' role='button' tabindex='0' aria-label='静衡囚域：陆澄肉体与意识依稳定材料、节流维生结构低耗维持。；限制：限制行动与摄取；并非无依附悬空意识。'>\u003ctitle>静衡囚域 · C02:31\u003c/title>\u003crect x=\"256\" y=\"513\" width=\"420\" height=\"151\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"270\" y=\"528\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"286\" y=\"551\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">静衡囚域\u003c/text>\u003ctext x=\"286\" y=\"585\" font-size=\"17\" fill=\"{{muted}}\">陆澄：肉体＋意识持续维生\u003c/text>\u003ctext x=\"286\" y=\"612\" font-size=\"17\" fill=\"{{muted}}\">材料稳定／低耗／交流受限\u003c/text>\u003ctext x=\"662\" y=\"652\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C02 · 31\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S06-02' role='button' tabindex='0' aria-label='穗庭 · 第一层中等：闻绛已孕育穗庭，维护迁民、界籍、粮能与航路。；限制：她是地脉，不是隐蔽高层全能存在。'>\u003ctitle>穗庭 · 第一层中等 · C02:5\u003c/title>\u003crect x=\"1120\" y=\"331\" width=\"590\" height=\"155\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"1134\" y=\"346\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"1150\" y=\"369\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">穗庭 · 第一层中等\u003c/text>\u003ctext x=\"1150\" y=\"403\" font-size=\"17\" fill=\"{{muted}}\">闻绛：地脉／已孕育中等子界\u003c/text>\u003ctext x=\"1150\" y=\"430\" font-size=\"17\" fill=\"{{muted}}\">住民／粮能／维护船队／界籍副本\u003c/text>\u003ctext x=\"1696\" y=\"474\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C02 · 5\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S06-03' role='button' tabindex='0' aria-label='续穗迁民局与民用通道：居民议会授权粮能、船队、档案；保存副本并安置迁民。；限制：闻绛知道婴儿逃出，不知道蓝星坐标；不能无成本收容。'>\u003ctitle>续穗迁民局与民用通道 · C02:33\u003c/title>\u003crect x=\"1120\" y=\"564\" width=\"590\" height=\"164\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"1134\" y=\"579\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"1150\" y=\"602\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">续穗迁民局与民用通道\u003c/text>\u003ctext x=\"1150\" y=\"636\" font-size=\"17\" fill=\"{{muted}}\">授权民用迁移与配给\u003c/text>\u003ctext x=\"1150\" y=\"663\" font-size=\"17\" fill=\"{{muted}}\">母子交换限流；不知蓝星坐标\u003c/text>\u003ctext x=\"1696\" y=\"716\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C02 · 33\u003c/text>\u003c/g>\u003cpath d=\"M795 451H1117\" fill=\"none\" stroke=\"{{road}}\" stroke-width=\"18\" opacity=\".13\"/>\u003cpath d=\"M795 451H1117\" class=\"route-layer\" fill=\"none\" stroke=\"{{road}}\" stroke-width=\"3.5\"  marker-end=\"url(#S06-arrow)\"/>\u003cpath d=\"M1120 684H860V560H797\" class=\"route-layer\" fill=\"none\" stroke=\"{{water}}\" stroke-width=\"3.5\"  marker-end=\"url(#S06-arrow)\"/>\u003ctext x=\"819\" y=\"410\" font-size=\"18\" fill=\"{{road}}\">登记迁民／粮能\u003c/text>\u003ctext x=\"818\" y=\"729\" font-size=\"17\" fill=\"{{water}}\">母子配给／净余量反馈\u003c/text>\u003cg class='place' data-key='SER-S06-05' role='button' tabindex='0' aria-label='随机低等子宇宙通道：陆澄盗太初晶融体后把婴儿小星球推向随机通道，只求逃政变。；限制：未直接选择蓝星，未知坐标不猜。'>\u003ctitle>随机低等子宇宙通道 · C02:21\u003c/title>\u003ccircle cx=\"787\" cy=\"781\" r=\"15\" fill=\"{{risk}}\" stroke=\"{{paper}}\" stroke-width=\"4\"/>\u003ccircle cx=\"787\" cy=\"781\" r=\"23\" fill=\"none\" stroke=\"{{risk}}\" stroke-width=\"1.5\"/>\u003ctext x=\"811\" y=\"773\" font-size=\"23\" text-anchor=\"start\" font-weight=\"650\" class=\"node-label halo\">随机低等子宇宙通道\u003c/text>\u003ctext x=\"811\" y=\"803\" font-size=\"17\" fill=\"{{muted}}\" text-anchor=\"start\" class=\"node-label halo\">同层随机入口\u003c/text>\u003ctext x=\"811\" y=\"829\" font-size=\"17\" fill=\"{{muted}}\" text-anchor=\"start\" class=\"node-label halo\">非选择蓝星\u003c/text>\u003c/g>\u003cpath d=\"M790 803Q680 923 569 954\" class=\"route-layer\" fill=\"none\" stroke=\"{{old}}\" stroke-width=\"3.5\"  marker-end=\"url(#S06-arrow)\"/>\u003cg class='place' data-key='SER-S06-12' role='button' tabindex='0' aria-label='追查线索 ≠ 蓝星坐标：扑空后发现潜在价值；随机记录残缺，屏蔽切断特征关联。；限制：普通归墟精炼数据无法直接定位苏木。'>\u003ctitle>追查线索 ≠ 蓝星坐标 · C02:27\u003c/title>\u003crect x=\"1130\" y=\"860\" width=\"660\" height=\"137\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"1144\" y=\"875\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"1160\" y=\"898\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">追查线索 ≠ 蓝星坐标\u003c/text>\u003ctext x=\"1160\" y=\"932\" font-size=\"17\" fill=\"{{muted}}\">记录残缺＋特征屏蔽 → 不能精确追踪\u003c/text>\u003ctext x=\"1160\" y=\"959\" font-size=\"17\" fill=\"{{muted}}\">源端方位／星图／坐标不推定\u003c/text>\u003ctext x=\"1776\" y=\"985\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C02 · 27\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S06-
