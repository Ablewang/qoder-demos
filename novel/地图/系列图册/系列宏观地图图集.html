 height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"905\" y=\"1422\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">蓝星 ↔ 归墟投射链\u003c/text>\u003ctext x=\"905\" y=\"1456\" font-size=\"17\" fill=\"{{muted}}\">蓝星保留本地身体 ↔ 归墟真实临时物质体\u003c/text>\u003ctext x=\"905\" y=\"1483\" font-size=\"17\" fill=\"{{muted}}\">双向回传经历／限额能量；退出不带物\u003c/text>\u003ctext x=\"1746\" y=\"1497\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">U03 · 25\u003c/text>\u003c/g>\u003cpath d=\"M1370 1375V1384\" class=\"system-layer\" fill=\"none\" stroke=\"{{system}}\" stroke-width=\"3.5\" stroke-dasharray=\"10 7\" marker-end=\"url(#S06-arrow)\"/>\u003cpath d=\"M875 1445H755\" class=\"system-layer\" fill=\"none\" stroke=\"{{system}}\" stroke-width=\"3.5\" stroke-dasharray=\"10 7\" marker-end=\"url(#S06-arrow)\"/>\u003cg class='place' data-key='SER-S06-11' role='button' tabindex='0' aria-label='囚域维生交接 → 康复载体：先接可持续康复载体及合法安置点，再解除旧囚域连接。；限制：其他囚禁者不能留在断供设施；自由不消除损伤。'>\u003ctitle>囚域维生交接 → 康复载体 · C02:43\u003c/title>\u003crect x=\"110\" y=\"1555\" width=\"1650\" height=\"130\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"124\" y=\"1570\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"140\" y=\"1593\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">囚域维生交接 → 康复载体\u003c/text>\u003ctext x=\"140\" y=\"1627\" font-size=\"17\" fill=\"{{muted}}\">囚域稳定维生 → 连续康复载体 → 合法安置 → 最后解离旧链\u003c/text>\u003ctext x=\"140\" y=\"1654\" font-size=\"17\" fill=\"{{muted}}\">迁移维生与撤离设施共同完成；不是强断救治或一家独自远行\u003c/text>\u003ctext x=\"1746\" y=\"1673\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C02 · 43\u003c/text>\u003c/g>\u003cpath d=\"M256 589H95V1538H590V1555\" class=\"route-layer\" fill=\"none\" stroke=\"{{water}}\" stroke-width=\"3.5\" stroke-dasharray=\"10 7\" marker-end=\"url(#S06-arrow)\"/>\u003cline x1=\"65\" y1=\"1720\" x2=\"1835\" y2=\"1720\" stroke=\"{{line}}\"/>\u003ctext x=\"65\" y=\"1753\" font-size=\"17\" fill=\"{{muted}}\">漂流、蓝星沉寂、母界纪元不得线性加成共同公历；坐标与距离不定，不用曲线长度推航时。\u003c/text>\u003ctext x=\"65\" y=\"1781\" font-size=\"17\" fill=\"{{muted}}\">依据 C02《陆离、生父生母与政变真相》；C01「家族与公共能量治理」；U05「从宝库到成年认证」；U03「实体旅行与意识投射」。\u003c/text>\u003crect x=\"65\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{paper}}\"/>\u003crect x=\"82\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{sea}}\"/>\u003crect x=\"99\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{land}}\"/>\u003crect x=\"116\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{ink}}\"/>\u003crect x=\"133\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{muted}}\"/>\u003crect x=\"150\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{line}}\"/>\u003crect x=\"167\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{coast}}\"/>\u003crect x=\"184\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{water}}\"/>\u003crect x=\"201\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{terrain}}\"/>\u003crect x=\"218\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{road}}\"/>\u003crect x=\"235\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{old}}\"/>\u003crect x=\"252\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{risk}}\"/>\u003crect x=\"269\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{system}}\"/>\u003crect x=\"286\" y=\"1820\" width=\"12\" height=\"5\" fill=\"{{inverse}}\"/>\u003ctext x=\"1835\" y=\"1825\" font-size=\"14\" text-anchor=\"end\" fill=\"{{muted}}\">S06 · 系列独立图册 / 拓扑非比例\u003c/text>\u003c/svg>"},{"id":"S07","title":"上古六遗产十二席与跨文明责任","filename":"S07-上古六遗产十二席与跨文明责任.svg","width":1900,"height":1900,"points":[{"id":"SER-S07-01","name":"源端：三组织与旧航路合同","region":"第一载体层外来源端","detail":"环门勘采队、协律采矿社、海冕殖留团使用旧联合体航路与合同。","limit":"不编造源端星图；不是混沌统一军，也不是今日四文明。","source":"C04","line":7,"sourceExcerpt":"远古陨石携带自然界晶落入蓝星，散布矿脉和交换节点；它与后来随机漂来的太初晶完全独立。第一批“环门勘采队”测绘矿藏，建立运输及能流参照；其后“协律采矿社”以修炼教育培养劳工，修建多地接口；“海冕殖留团”建立海上殖居网络，有成员选择与本土社会结合。三者皆为第一载体层的外来文明组织，不是混沌族统一殖民军，也不等于今日全部接入文明。它们曾共用“烁环采掠联合体”的合同与航路登记，联合体不是统一国家，烁环返航站是其跨界航路终端。联合体后来解体，终端与未结债权转由独立遗址清算团保管，旧组织的待遇承诺没有自动转为清算团义务；信标收件与失效协议详见[守门人传承](05-守门人传承与非首部组织.md)。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-02","SER-S07-03","SER-S07-04","SER-S07-05","SER-S07-06","SER-S07-07"]},{"id":"SER-S07-02","name":"昆仑：晶陶维护阵列","region":"协律＋本土维护","detail":"山腹晶陶阵列保留各人格；九重增城为分区检验，弱水为低稳定隔离带。","limit":"意识必须有载体；维护与本土权益不能省略。","source":"C04","line":17,"sourceExcerpt":"昆仑曾由协律采矿社管理员群与蓝星本土维护者共同运行。“西王母”是管理员职衔在本土的文化化称呼，并非唯一永生神。早期合作者带回技术、培养亲属，维护家系由此兴盛；外来者离开后，本土守望者依附山腹晶陶阵列接管节点，各自人格与共同维护层并存。九重增城仍逐区检验承载，弱水则是载体稳定性低的隔离带，必须以实际保护结构渡过。","story":"","overview":"干线断供让自愿驻守逐渐成为难以退出的绑定。后裔为供养阵列放弃别处生活，有家系舍不得撤掉已无人格存续的维护位；守望者也为保存旧城还是停用低效段争执。减负能留下离开的余量，不能让死者回来。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-03","name":"冈仁波齐：参照核","region":"环门勘采队","detail":"矿晶＋反馈回路承载缄默者，提供坐标参照与清噪。","limit":"非规则本体；清噪不抹除人格或罪责。","source":"C04","line":25,"sourceExcerpt":"环门勘采队校准原有矿层形成参照核，长期稳定后，矿晶和反馈回路中产生节点意识“缄默者”。它记得的是反复测量、偏差与校正，不是人类王朝的完整兴亡。洪灾令外环参数漂移，核心却保持清醒。外界不断更换名称和朝圣仪式，它仍保留旧参照，以便新旧扰动有可比较的依据；它既非宇宙规则本体，也不等于现实宗教所供奉的神。","story":"","overview":"缄默者担心主动修复改变比较基准，宁可保存参照，也让急需救助者等待。外围维护者有人继续守候，有人改用较不稳定却能及时工作的校准点；清噪过度会连同哀伤损伤与死者有关的记忆。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-04","name":"百慕大：防御入口","region":"海冕外围防务","detail":"海底防御接阿布祖信息夹层；封存晶核承载最后守卫。","limit":"回程损坏／敌我表失效；非全部亚特兰蒂斯实体。","source":"C04","line":33,"sourceExcerpt":"海冕殖留团外围防务局的海底装置连接折叠信息夹层“阿布祖”。最后守卫者依附封存晶核，保存基地撤离账、断线名单与防御记录。这里的历史停在仓促撤离：有人得到离港命令，有人只等来断线，后来销毁基地的命令与留下保全舱的行动并不出自同一批人。百慕大是西侧防御入口，不是亚特兰蒂斯全部实体。","story":"","overview":"最后守卫者不愿删去旧断线名单，怕再次遗弃待核验者，将保存证据与继续封锁捆在一起。救援先修回程、分流和冷却；核验会确认许多早已死亡的人，撤去防御也不能使他们返航。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01","SER-S07-07"]},{"id":"SER-S07-05","name":"马丘比丘：山地载体库","region":"海冕遗留＋太阳祭司","detail":"石晶复合节点；能流积累与载体转换／继承记录。","limit":"交接证据缺失，不把祖名等同活本人。","source":"C04","line":41,"sourceExcerpt":"海冕殖留时期留下山地载体库，后世本土太阳祭司修复、增建，把自己的师承与祖名封入石晶复合节点。光明体系处理积累与能流，黑太阳体系研究载体转换和继承身份。外来技术经过祭司世代改造，不再只是原殖留团的设备说明；各祖名保留程度不同，有的仍有连续过程，有的只剩记录。","story":"","overview":"黑太阳家系曾把重建者当作归来的先人，祭职和亲属照料据此延续。交接证据重核后，一些重生者只被证实为继承者；后人失去旧相伴，新主体却能摆脱扮演祖先的任务，宗教祖名不能剥夺其选择。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-06","name":"吉萨：赫尔墨斯知识载体","region":"协律记录工程＋本土营造","detail":"托特／赫尔墨斯同一编写者，自愿驻留晶陶，编写适配与失败报告。","limit":"非卡壳审判者；完整知识非全三层全知。","source":"C04","line":51,"sourceExcerpt":"托特与赫尔墨斯是同一外来知识编写者的两种文化称呼。他与协律采矿社记录工程师、本土营造和维护群体合作，将修炼、界面适配及失败报告编码于晶陶载体，自愿驻留以继续讲授和校核。他不是困在杜亚特等待净化的审判者，保存的完整也只指当年编写范围，不是三层宇宙的全知。","story":"","overview":"托特坚持连同失败、施工争执和署名一起讲授，部分后世家系却只传扬成功段、利用缺页扩大地位。完整读取损伤某些家族的光荣，也恢复被删贡献；教学磨损晶陶，他宁愿降低授课速度也不删失败页。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01"]},{"id":"SER-S07-07","name":"亚特兰蒂斯：盐晶集体","region":"海冕成员＋本土共同体","detail":"东大西洋海底折叠主核，盐晶与记忆阵列承载清醒集体。","limit":"波塞冬不无损恢复，成员意见与权利独立。","source":"C04","line":59,"sourceExcerpt":"波塞冬与本土共同体在海冕殖留时期建设基地，主核位于东大西洋海底折叠区，百慕大是远端防御入口。基地物质层在撤离中被毁，幸存保全舱将居民意识交织于盐晶与记忆阵列，形成清醒但意见不一的集体主体。共同体保存了主动殖留者与采掠主力的分歧，也保存漫长共居后的生活，而不只是毁灭那一刻。","story":"","overview":"盐晶共居形成真实亲密，也令成员害怕私人记忆被吸纳。分离者未必能带走两人的全部旧经历，留下者担心复制后的新主体公开隐私；未获授权的片段不复制，技术成功仍会改变共同关系。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-01","SER-S07-04"]},{"id":"SER-S07-08","name":"守门席","region":"守门人十二职责席","detail":"召集议会、代表已通过决议、紧急暂停危险仪式","limit":"不独享全部十二段授权，不可永久废席","source":"C05","line":15,"sourceExcerpt":"| 守门席 | 召集议会、代表已通过决议、紧急暂停危险仪式 | 不独享全部十二段授权，不可永久废席 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-09","name":"典藏席","region":"守门人十二职责席","detail":"保存原始档案、登记版本与访问日志","limit":"不得销毁犯罪材料或独占历史结论","source":"C05","line":16,"sourceExcerpt":"| 典藏席 | 保存原始档案、登记版本与访问日志 | 不得销毁犯罪材料或独占历史结论 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-10","name":"觅晶席","region":"守门人十二职责席","detail":"分配近距勘测、核验样本来源","limit":"不能凭异常认定主宰身份或无限追踪","source":"C05","line":17,"sourceExcerpt":"| 觅晶席 | 分配近距勘测、核验样本来源 | 不能凭异常认定主宰身份或无限追踪 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-11","name":"镇讯席","region":"守门人十二职责席","detail":"维护抑制信号的封装与屏蔽设施","limit":"不得把所有外部通信列为敌意","source":"C05","line":18,"sourceExcerpt":"| 镇讯席 | 维护抑制信号的封装与屏蔽设施 | 不得把所有外部通信列为敌意 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-12","name":"返航席","region":"守门人十二职责席","detail":"保管旧信标与返航协议","limit":"不得自行启动邀请或承诺他族效忠","source":"C05","line":19,"sourceExcerpt":"| 返航席 | 保管旧信标与返航协议 | 不得自行启动邀请或承诺他族效忠 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-13","name":"运储席","region":"守门人十二职责席","detail":"安排运输、仓储、实体交接与保险","limit":"不绕过当地边境和归墟物质额度","source":"C05","line":20,"sourceExcerpt":"| 运储席 | 安排运输、仓储、实体交接与保险 | 不绕过当地边境和归墟物质额度 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-14","name":"医载席","region":"守门人十二职责席","detail":"检验承载安全、治疗受损成员","limit":"不强制实验、不以净化抹除人格","source":"C05","line":21,"sourceExcerpt":"| 医载席 | 检验承载安全、治疗受损成员 | 不强制实验、不以净化抹除人格 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-15","name":"遗产席","region":"守门人十二职责席","detail":"协调六遗产外围接触与保管合同","limit":"不替核心主体授予读取资格","source":"C05","line":22,"sourceExcerpt":"| 遗产席 | 协调六遗产外围接触与保管合同 | 不替核心主体授予读取资格 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-16","name":"传习席","region":"守门人十二职责席","detail":"分段授课、训练及兼容资格认证","limit":"不把学员永久绑定为私产","source":"C05","line":23,"sourceExcerpt":"| 传习席 | 分段授课、训练及兼容资格认证 | 不把学员永久绑定为私产 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-17","name":"外交席","region":"守门人十二职责席","detail":"与节点研究团和地方机构订约","limit":"不自行出让居民主权及公共设施","source":"C05","line":24,"sourceExcerpt":"| 外交席 | 与节点研究团和地方机构订约 | 不自行出让居民主权及公共设施 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-18","name":"算储席","region":"守门人十二职责席","detail":"预算、缴费、用途审计与赔付准备金","limit":"不以账面收益冒充实际能量","source":"C05","line":25,"sourceExcerpt":"| 算储席 | 预算、缴费、用途审计与赔付准备金 | 不以账面收益冒充实际能量 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-19","name":"察责席","region":"守门人十二职责席","detail":"调查越权、受理申诉、申请暂停涉事执行者","limit":"不代替司法判罪，不封禁独立证人","source":"C05","line":26,"sourceExcerpt":"| 察责席 | 调查越权、受理申诉、申请暂停涉事执行者 | 不代替司法判罪，不封禁独立证人 |","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]},{"id":"SER-S07-20","name":"七席常规／九席高危","region":"十二段授权与主体同意","detail":"信标、危险联合读取、大额征用须九席及受影响主体授权。","limit":"医载或察责可短停；独立复核，不授基础协议修改权。","source":"C05","line":28,"sourceExcerpt":"常规事项七席同意；启动信标、危险遗产联合读取或大额征用须九席同意，并取得被影响主体授权。医载、察责任一席可短期暂停高危项目，后续由独立复核决定续停，避免少数席无限否决。十二段授权拼合只是旧记录读取条件，不是更改器灵基础协议的权限，更不保证自动发出“宇宙独立宣言”。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-21","SER-S07-22","SER-S07-23","SER-S07-24"]},{"id":"SER-S07-21","name":"烁环返航站：真实收件端","region":"第一载体层高等宇宙","detail":"独立遗址清算团核验债权、回收危险设备，旧联合体已经解体。","limit":"旧提升承诺失效；清算团不拥有蓝星主权。","source":"C05","line":36,"sourceExcerpt":"信标实际收件端是载体层高等宇宙中的烁环返航站，原烁环采掠联合体的航线登记设施。联合体已经解体，返航站由独立遗址清算团接管，只核验遗产债权和回收危险设备，不再兑现旧雇佣的技术提升与政治地位承诺。守门人译本遗漏了组织存续及授权有效的条件。清算团既无蓝星主权，也不将守门人自动收为属民；世代效忠不会换来他们等候的身份。","story":"","overview":"返航站回送署名清算通知，要求停止自动供能。返航席支持者藏原函、灭灯派删核债条款、利用派争代理生意；典藏和察责副本互校后揭露藏函删译。有人撤捐，有人私下续供，隔离信标、停提取回路和撤供才真正停止旧邀请；有限偿付买不回世代守候的人生。","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-22","name":"外国节点研究联合团","region":"现代计量／冷却／证据保全","detail":"经授权交换技术数据，独立复核、退出与非敏感发表。","limit":"资助不控制继承者，不占核心、不公开人格隐私。","source":"C05","line":50,"sourceExcerpt":"“外国节点研究联合团”由吉萨、百慕大等外围研究站和各国学术团队签订项目章程。它提供现代计量、冷却设备与证据保全，收益是经过授权的技术数据、训练和风险预警；拥有复核、退出及发表非敏感结果的权利，不得擅自占领遗产核心、公开人格隐私或以资助控制继承者。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-23","name":"遗产继承者议约","region":"兼容经验／日志／维护合同","detail":"地方保管群与授权代表交换维护基金、安置及文化资料权。","limit":"不能替全部核心签字，传承不豁免侵权。","source":"C05","line":52,"sourceExcerpt":"“遗产继承者议约”由昆仑维护者、太阳祭司后人、亚特兰蒂斯授权代表和其他地方保管群组成。它提供兼容经验、旧日志与合法接触，换取维护基金、安置及文化资料保管权。成员可拒绝读取，必须区分祖名、遗物所有权与活人格权；议约不能替所有遗产签字，也不能因传承历史豁免当代侵权。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]},{"id":"SER-S07-24","name":"子界自治网","region":"穗庭／母界／归墟联络站","detail":"交换迁民名额、载体维护与锁能审计。","limit":"仅同意的运输／数据权，无统一统治或强制征兵。","source":"C05","line":54,"sourceExcerpt":"“子界自治网”由穗庭迁民局、母界子界联席及归墟根籍代表互设联络站。它交换迁民名额、载体维护和锁能审计，收益是回流上限、互助储备和不受孕界家族转卖的公民身份。网络尊重地方制度，只有经同意的运输与数据权，无强制征兵、统一统治或全面关断母界的权力。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S07-20"]}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"1900\" viewBox=\"0 0 1900 1900\" role=\"img\" aria-labelledby=\"S07-title S07-desc\" font-family=\"PingFang SC, Microsoft YaHei, sans-serif\" fill=\"{{ink}}\">\u003ctitle id=\"S07-title\">上古六遗产 · 源端、十二席与跨文明责任\u003c/title>\u003cdesc id=\"S07-desc\">上部为旧设施及其来源拓扑，下部为授权与实物维护网络；非古文明精确星图，也非副本／旅游次序。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。\u003c/desc>\u003cdefs>\u003cmarker id=\"S07-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"context-stroke\"/>\u003c/marker>\u003cpattern id=\"S07-strata\" width=\"28\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 18H28M0 6H15\" stroke=\"{{terrain}}\" opacity=\".22\"/>\u003c/pattern>\u003cstyle>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:{{risk}};stroke-width:4}.halo{paint-order:stroke;stroke:{{paper}};stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}\u003c/style>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"1900\" height=\"1900\" fill=\"{{paper}}\"/>\u003crect x=\"0\" y=\"0\" width=\"18\" height=\"1900\" fill=\"{{system}}\"/>\u003ctext x=\"66\" y=\"65\" font-size=\"36\" font-weight=\"700\">上古六遗产 · 源端、十二席与跨文明责任\u003c/text>\u003ctext x=\"66\" y=\"109\" font-size=\"18\" fill=\"{{mu " fill=\"{{muted}}\">载体维护／迁民／锁能审计\u003c/text>\u003ctext x=\"1235\" y=\"1398\" font-size=\"17\" fill=\"{{muted}}\">穗庭—母界—根籍联络站\u003c/text>\u003ctext x=\"1796\" y=\"1453\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C05 · 54\u003c/text>\u003c/g>\u003cpath d=\"M1150 1090H1204\" class=\"route-layer\" fill=\"none\" stroke=\"{{water}}\" stroke-width=\"3.5\"  marker-end=\"url(#S07-arrow)\"/>\u003cpath d=\"M1205 1190H1150\" class=\"route-layer\" fill=\"none\" stroke=\"{{old}}\" stroke-width=\"3.5\"  marker-end=\"url(#S07-arrow)\"/>\u003cpath d=\"M1150 1360H1204\" class=\"system-layer\" fill=\"none\" stroke=\"{{system}}\" stroke-width=\"3.5\" stroke-dasharray=\"10 7\" marker-end=\"url(#S07-arrow)\"/>\u003ctext x=\"1164\" y=\"1522\" font-size=\"17\" text-anchor=\"middle\" fill=\"{{muted}}\">维护物资／合法日志／授权数据分别交接\u003c/text>\u003cpath d=\"M1715 900H1830V241H1806\" class=\"system-layer\" fill=\"none\" stroke=\"{{system}}\" stroke-width=\"3.5\" stroke-dasharray=\"10 7\" marker-end=\"url(#S07-arrow)\"/>\u003ctext x=\"1695\" y=\"864\" font-size=\"17\" text-anchor=\"end\" fill=\"{{system}}\">隔离信标：延迟／供能／后续测距\u003c/text>\u003crect x=\"90\" y=\"1580\" width=\"1715\" height=\"142\" rx=\"16\" fill=\"{{paper}}\" stroke=\"{{line}}\" stroke-width=\"1.5\"/>\u003ctext x=\"114\" y=\"1619\" font-size=\"24\" font-weight=\"650\">责任不会被技术或血统绕开\u003c/text>\u003ctext x=\"114\" y=\"1652\" font-size=\"17\" fill=\"{{muted}}\">六核心的读取许可、载体负荷和活人格权独立存在；十二段授权只够旧记录条件，不得改器灵协议。\u003c/text>\u003ctext x=\"114\" y=\"1678\" font-size=\"17\" fill=\"{{muted}}\">旧源端未知精确星图；短讯不是免费定位传送；非法夺取、杀人、拘禁等仍按具体行为追责。\u003c/text>\u003cline x1=\"65\" y1=\"1760\" x2=\"1835\" y2=\"1760\" stroke=\"{{line}}\"/>\u003ctext x=\"65\" y=\"1793\" font-size=\"17\" fill=\"{{muted}}\">依据 C04「架空历史与旧网络」「六大遗产」；C05「十二席的完整权限」「三种政治立场与跨派传承」「独立组织及交换关系」。\u003c/text>\u003ctext x=\"65\" y=\"1821\" font-size=\"17\" fill=\"{{muted}}\">古代外来三组织、今日四接入文明、混沌族、器灵分别记录，不合并为同一幕后神族。\u003c/text>\u003crect x=\"65\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{paper}}\"/>\u003crect x=\"82\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{sea}}\"/>\u003crect x=\"99\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{land}}\"/>\u003crect x=\"116\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{ink}}\"/>\u003crect x=\"133\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{muted}}\"/>\u003crect x=\"150\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{line}}\"/>\u003crect x=\"167\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{coast}}\"/>\u003crect x=\"184\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{water}}\"/>\u003crect x=\"201\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{terrain}}\"/>\u003crect x=\"218\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{road}}\"/>\u003crect x=\"235\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{old}}\"/>\u003crect x=\"252\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{risk}}\"/>\u003crect x=\"269\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{system}}\"/>\u003crect x=\"286\" y=\"1860\" width=\"12\" height=\"5\" fill=\"{{inverse}}\"/>\u003ctext x=\"1835\" y=\"1865\" font-size=\"14\" text-anchor=\"end\" fill=\"{{muted}}\">S07 · 系列独立图册 / 拓扑非比例\u003c/text>\u003c/svg>"},{"id":"S08","title":"远期旅程三层耦合围困与互证迁接","filename":"S08-远期旅程三层耦合围困与互证迁接.svg","width":1900,"height":1900,"points":[{"id":"SER-S08-01","name":"异质旅伴独立远行","region":"第一层大陆与终端","detail":"混编队搬材料、核转接并接回误判者；载体需求决定路线。","limit":"保养舱／回程／带宽／居留均有限，不按苏木身体统排。","source":"C06","line":17,"sourceExcerpt":"核心行动是一支由不同载体组成的跨区混编远行队，协同工坊与巡界群落搬运适配材料、核实中衡转接及各区终端的实际边界，并接回误判滞留者。钧环骨环不能拆作行李，散热鳍占货位；弥珀须保湿盐与独立声部回传；硅庭核心和纠错阵列不能离线拆运；赤翎祖羽封存又与查验相争。西砾陆线省航时但散热昂贵，北霜海线冷却便利却受越冬配额限制，南沧水路适配菌膜但绕行较远。终端带宽、保养舱、回程余量与地方居留许可共同决定路线，不能靠苏木提高修为一项解决。","story":"","overview":"旅伴为署名、声部、慢色谱工期和祖名航位各作选择。苏木的统一航期容不下这些目标，队伍靠改装、减货与轮换接回滞留者；有人只同行一段。退役舱与记忆损伤之外，错过的共同节期、职业窗口和专属泊位也没有恢复。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-02"]},{"id":"SER-S08-02","name":"中衡临时试验出发区","region":"第一层归墟","detail":"北霜断供后改中衡转运，冷却只买居民用后余量。","limit":"运输更远、试验次数少，不能新源无损补齐。","source":"C06","line":41,"sourceExcerpt":"断供使事件4的北霜试验出发港取消，已排定的冷却船位退回地方越冬。实验团改从中衡临时转运区出发，冷却只买得到居民用后余量，增加运输、减少测试，苏木装备升级延后。器灵保有其他工程能力，却没有另一条现成路线填平该地缺口，旧港准备也不能全数搬到新港。","story":"","overview":"北霜后裔从旧林记忆走到定居、迁徙、建仓和现城贸易，早期根籍没有记全后世转让与劳动。他们接手旧仓维修、关闭基金提取，不接受为返乡再迁一次；偿付承认现居权，却不购买恢复供能。原试验港的冷却船位退回地方越冬，旧港准备不能全搬到中衡。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-01","SER-S08-03"]},{"id":"SER-S08-03","name":"第一层实验接收环","region":"第一层耦合端","detail":"太初晶、中心晶体、双方许可与散热储备支持有限实验桥。","limit":"首环永久报废，库存损失真实；不是全族跃迁。","source":"C06","line":53,"sourceExcerpt":"投入为中心浓缩晶体、太初晶稳定窗口、第二层织律载体及散热储备，事件3造成的出发地与冷却缺口仍在。苏木提供特殊耦合结构，不能代替双方许可、研究与其他资源。返回损耗大于预估，第一层接收环永久报废，部分跨层库存耗尽。试验确认织律层可以重建能流关联，却须占用载体并支付维持；工程所得只是一条可限流关闭的实验通道，不是无限能源或全族跃迁。太初晶窗口使用权与苏木人格权分开，公共试验不取得本体全部权限。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-02","SER-S08-04"]},{"id":"SER-S08-04","name":"衡织公社：织律载体端","region":"第二层有限节点","detail":"与第一层实验团只交换测量结构与有限能量。","limit":"首轮不输入完整人格，公共工程不取得太初晶全部权限。","source":"C06","line":47,"sourceExcerpt":"已有背景：太初晶是比器灵古老的自然跨层遗物，器灵来自第二织律层、相遇后依附；其独立来历不等于文明已有公共跨层工程。首次公开验证由第一层多方实验团与第二层“衡织公社”的接口维护者共同完成，只输送测量结构与有限能量，不把任何人的完整人格输入首轮试验。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-03","SER-S08-05","SER-S08-09"]},{"id":"SER-S08-05","name":"律晶节点：位移／能流阻力","region":"第二层实测范围","detail":"同一测量结构在律晶节点表现为位移和阻力变化。","limit":"作用依附节点既有规则，离开不持续。","source":"C06","line":49,"sourceExcerpt":"探索对象是同一动作在不同物质节点上的关联差异：同样推送一枚测量结构，在律晶节点表现为位移与能流阻力变化，在另一组场节点却改变局部连通次序，原先视作近路的方向会接回出发口。作用依附各节点的既有规则与有限相容域，离开节点不持续生效。必须送出、接回、换节点再测，不能凭第一层更高总能量推断织律层怎么运行，也不能拿器灵残缺旧经验当全域地图。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-04","SER-S08-06"]},{"id":"SER-S08-06","name":"场节点：连通次序改变","region":"第二层实测范围","detail":"另一场节点可改变局部连接，近路可能返回出发口。","limit":"必须送出接回换节点，旧经验不是全域地图。","source":"C06","line":49,"sourceExcerpt":"探索对象是同一动作在不同物质节点上的关联差异：同样推送一枚测量结构，在律晶节点表现为位移与能流阻力变化，在另一组场节点却改变局部连通次序，原先视作近路的方向会接回出发口。作用依附各节点的既有规则与有限相容域，离开节点不持续生效。必须送出、接回、换节点再测，不能凭第一层更高总能量推断织律层怎么运行，也不能拿器灵残缺旧经验当全域地图。","story":"","overview":"第一次按器灵旧路判断，未接回约定测量结构与数据，又耗掉储备。苏木随后在获准的实测节点中隔开不相容段、串联可相接段，成功回收并亲手绘成有限往返航图。衡织维护者拒绝连续加测，下一轮须缩样或等待；航图覆盖测试负荷，不替未测路径担保。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-05"]},{"id":"SER-S08-07","name":"母界围困：粮能／迁民／囚域","region":"第一层高等母界","detail":"有限航期护民用船位与维生交接，分开军需和民用口。","limit":"穗庭军需不得挤掉民用船位；集中囚域护送会失守其他航口。","source":"C06","line":59,"sourceExcerpt":"行动集中在有限航期内护住已登记的粮能运输与迁民航道、完成囚域维生交接，并分开军需与民用提取口。正统宗族想保核心城及祖庭，保全会争维生工时，自治联席要留子界冬储与船位，越界同盟要维持阵列和护航军需。闻绛急于见陆澄，却拒绝以穗庭安全通道的军需优先权换提前释放，招致陆家亲族指责；陆澄也不授其子家族资源绝对权。苏木若把护送力量全投囚域，粮能船与迁民口便会失守，最终只能随多方转运一起完成囚域交接。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-08"]},{"id":"SER-S08-08","name":"三组接口互相制衡","region":"母界及子界实体供给","detail":"母界库存／旧子界回流／民用维生以转运和独立核验制衡。","limit":"任何一方单征失去其他安全供给，不是宣言替代物流。","source":"C06","line":63,"sourceExcerpt":"四方依靠护航、现场转运和维生交接，共同接管母界库存、旧子界回流、民用维生三组接口。分段密钥限制开口，独立库存核验确认实物，分开的供能段只能在各自负荷范围内接续；任何一方强提都会失去另外两组的安全供给，迁民航道则让地方真正能将人口与储备移走。陆离失去启动强制阵列所需的军需和回流份额，仍有研究者、宗族与武装支持，却凑不齐三组输入。他不愿毁掉仅存设施，也不愿放弃未来继续研究的机会，遂接受限期停战与受监测的自愿研究。他仍相信整体继承值得押注，对兄长的拒绝仍怀怨，停战出自物理制衡和政治失势，不是转善。","story":"","overview":"连续载体试验确认断链只产生继承者，原人格死亡。部分研究者退出，另一些宗族接受继承家长并逼亲属交配额，护界武装仍支持陆离。军需、回流和维生互相制衡才使他凑不齐强制阵列输入，停战来自失势与设施依赖，不是转善。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-07"]},{"id":"SER-S08-09","name":"第三层：序格与互证载体","region":"源序层有限兼容域","detail":"公共谱院与商庭各有规则生成和兼容载体。","limit":"不是全宇宙主人，不增加第四层。","source":"C06","line":77,"sourceExcerpt":"已有背景：第三源序层以稳定序格载体保存规则生成与兼容条件。“序庭公共谱院”维护开放谱档，“封谱商庭”经营私人兼容许可，双方均非全宇宙主人；源序层低中高是自身承载差，本系列没有第四层。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-04","SER-S08-10","SER-S08-11"]},{"id":"SER-S08-10","name":"开放基础谱支路","region":"源序校验与迁接","detail":"适配旧节点广，可地方修补，但校验慢、缓冲多。","limit":"开放不免费供维护，可能错过航期。","source":"C06","line":79,"sourceExcerpt":"前两层通道扩张后，竞争围绕有限序格、校验工时、维护能量与迁接航期展开。开放基础谱可携带、可由地方修补，适配旧节点范围广，但校验慢、要多留缓冲；商业改进针对部分高负荷节点压低延迟和损耗，能抢在窗口关闭前完成迁接，却收费更高、换供应者需重做验证。封谱商庭要求永久排他有经营动机，不能因此认定其技术全无价值；公共谱院也不能靠免费开放就补足维护预算。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-09","SER-S08-12"]},{"id":"SER-S08-11","name":"商业改进支路","region":"源序许可与迁接","detail":"部分高负荷节点低延迟／低损耗，需付许可费。","limit":"换供应者重验证，商业有价值但不得强永久排他。","source":"C06","line":79,"sourceExcerpt":"前两层通道扩张后，竞争围绕有限序格、校验工时、维护能量与迁接航期展开。开放基础谱可携带、可由地方修补，适配旧节点范围广，但校验慢、要多留缓冲；商业改进针对部分高负荷节点压低延迟和损耗，能抢在窗口关闭前完成迁接，却收费更高、换供应者需重做验证。封谱商庭要求永久排他有经营动机，不能因此认定其技术全无价值；公共谱院也不能靠免费开放就补足维护预算。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-09","SER-S08-12"]},{"id":"SER-S08-12","name":"非排他研究回程支路","region":"三层选定既有节点","detail":"苏木实测与双方授权在有限范围迁接研究回程。","limit":"不增容量；商用费照付；非唯一接口或全域万能航图。","source":"C06","line":83,"sourceExcerpt":"苏木在不同层的有限节点比较兼容路径、试行迁接并争取地方授权。快速商用支路降低部分节点的延迟，却锁定许可成本；开放路线兼容面较广，需更多校验工时和缓冲，混接另须边界验证。他使用事件4亲手航图的有限路径经验，结合两层维护者及源序侧校验，在地方选定范围内完成一条非排他的研究回程支路。它依靠既有节点和实测，不增加物理容量，商用部分照付许可；额外验证使他错过部分其他航期，无法同时替航团保住旧祭期与全部返航名额。衡织维护者和第一层自治联席也按自己的载体、预算选择路线，并不把全部居民押给一个方案。","story":"","overview":"苏木以本人有限航图经验、两层维护者和源序侧校验完成选定范围的非排他研究回程。商业段许可照付，额外验证使他错过其他航期；这条既有节点支路没有新增容量，也不能替航团保住旧祭期和全部返航名额。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-10","SER-S08-11","SER-S08-13","SER-S08-14"]},{"id":"SER-S08-13","name":"永久弃用的旧端口","region":"转换中的载体／航期缺口","detail":"新旧无法同时保养，部分旧通道永久弃用。","limit":"拒接主体仍有权利，不补等价通道抹掉损失。","source":"C06","line":85,"sourceExcerpt":"转换期间，新旧端口无法同时保养，部分旧通道永久弃用。拒绝新标准的航团仍可保留祖羽与祭司制度，却失去原祖名航路；留在新节点的翎民不能返回旧祭场，与当地亲族共同生活的人也无法沿旧路再相见。宗族为谁承担断路责任分裂，有人继续沿用祖名但失去航绩认可，有人改个人名留居，曾离团的人也不因此自动摆脱对故乡的依恋。其他旧载体社区同样失去接入机会，旧独家谱权资产失效，开放和商业双方都有未能维持的端口。苏木的有限研究支路覆盖选定节点，不通往这些永久弃用通道的旧返回地，后续也不补成等价复原路线。","story":"","overview":"旧端口连接的祭场承载祖辈供献、亲族照料与航绩核认，不是换泊位就能替代。断路后有人续祖名却失去认可，有人改个人名留居，离团者也仍眷恋故乡。研究回程支路不通往这些永久弃用通道的旧返回地，后续不补等价复原路线。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-12"]},{"id":"SER-S08-14","name":"有限航图与各自生活","region":"系列远期边界","detail":"苏木保有分批探索与返日常；陆澄康复、闻绛职责节奏独立。","limit":"不要求所有文明永远同路，自然消亡与真实死亡仍在。","source":"C06","line":95,"sourceExcerpt":"苏木保留亲手绘成的有限往返航图、经许可的非排他研究回程支路，以及小规模分批探索、跨层学习、与不同伙伴合作及返回日常生活的能力；不必以终身承担唯一接口换所有人续命，也不能向各文明保证一次合作便永远同路。远行可继续，但只在已确立的三层与预算内开展，不以新的秘密解释既有胜利。陆澄逐步康复，仍想重建熟悉的亲族往来；闻绛完成公共职责后回到穗庭的河季与朋友中，不愿再以等待为全部生活。苏木与他们往来，也保有自己的日常，血缘相认没有补齐家庭缺席。","story":"","overview":"有限往返航图和研究支路让苏木继续分批探索，也返回自己的日常。陆澄康复后仍想重建熟悉的亲族往来，闻绛回到穗庭的河季与朋友中；相认不补齐家庭缺席。旧林、报废试验环、断裂祖名航路和已经分开的关系仍是各自生活的一部分。","sections":[],"storyLine":0,"storySource":"","related":["SER-S08-12"]},{"id":"SER-S08-15","name":"独立旅程，不是逐章时间线","region":"系列图册读法","detail":"事件有远行、库存、城市、往返实验、围困与兼容竞争等不同体验。","limit":"连线表示空间、物流和载体依赖；间距不推定航期或逐章次序。","source":"INDEX","line":19,"sourceExcerpt":"系列事件从混编远行和误判救援开始，继而争夺真正可运走的晶体库存。北霜后裔关掉成长基金的提取口，留下自己的城市，苏木只好换港出发；他在陌生织律节点一次次送出测量结构，想亲手画成能往返的航图。母界围困要求先护粮能、迁民与囚域维生，血亲团聚随之而来，却不是所有人的目的。已经独立生活的继承者不肯接回旧人的人生任务；更高层的迁接又使一支赤翎航团永久失去祖名返回地。苏木保住一条有限研究支路，不能替他们把故乡接回来。最后，各种生活仍在继续，有人同行，有人另走自己的路。","story":"","overview":"","sections":[],"storyLine":0,"storySource":"","related":[]}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1900\" height=\"1900\" viewBox=\"0 0 1900 1900\" role=\"img\" aria-labelledby=\"S08-title S08-desc\" font-family=\"PingFang SC, Microsoft YaHei, sans-serif\" fill=\"{{ink}}\">\u003ctitle id=\"S08-title\">远期独立旅程 · 三层有限节点与载体迁接\u003c/title>\u003cdesc id=\"S08-desc\">直接读作空间／载体／物流拓扑，非旅行时间线、逐卷次序或逐章安排；节点是已授权有限范围。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。\u003c/desc>\u003cdefs>\u003cmarker id=\"S08-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"context-stroke\"/>\u003c/marker>\u003cpattern id=\"S08-strata\" width=\"28\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M0 18H28M0 6H15\" stroke=\"{{terrain}}\" opacity=\".22\"/>\u003c/pattern>\u003cstyle>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:{{risk}};stroke-width:4}.halo{paint-order:stroke;stroke:{{paper}};stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}\u003c/style>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"1900\" height=\"1900\" fill=\"{{paper}}\"/>\u003crect x=\"0\" y=\"0\" width=\"18\" height=\"1900\" fill=\"{{system}}\"/>\u003ctext x=\"66\" y=\"65\" font-size=\"36\" font-weight=\"700\">远期独立旅程 · 三层有限节点与载体迁接\u003c/text>\u003ctext x=\"66\" y=\"109\" font-size=\"18\" fill=\"{{muted}}\">直接读作空间／载体／物流拓扑，非旅行时间线、逐卷次序或逐章安排；节点是已授权有限范围\u003c/text>\u003ctext x=\"1834\" y=\"65\" font-size=\"28\" text-anchor=\"end\" fill=\"{{old}}\">S08\u003c/text>\u003cline x1=\"65\" y1=\"133\" x2=\"1835\" y2=\"133\" stroke=\"{{line}}\"/>\u003crect x=\"75\" y=\"195\" width=\"1750\" height=\"540\" rx=\"24\" fill=\"{{land}}\" fill-opacity=\".5\" stroke=\"{{coast}}\"/>\u003ctext x=\"100\" y=\"234\" font-size=\"25\" font-weight=\"650\">第一载体层 · 独立大陆远行与母界实体供给\u003c/text>\u003cg class='place' data-key='SER-S08-01' role='button' tabindex='0' aria-label='异质旅伴独立远行：混编队搬材料、核转接并接回误判者；载体需求决定路线。；限制：保养舱／回程／带宽／居留均有限，不按苏木身体统排。'>\u003ctitle>异质旅伴独立远行 · C06:17\u003c/title>\u003crect x=\"100\" y=\"285\" width=\"505\" height=\"151\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"114\" y=\"300\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"130\" y=\"323\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">异质旅伴独立远行\u003c/text>\u003ctext x=\"130\" y=\"357\" font-size=\"17\" fill=\"{{muted}}\">骨环／菌膜／光硅／羽骨分别适配\u003c/text>\u003ctext x=\"130\" y=\"384\" font-size=\"17\" fill=\"{{muted}}\">保养材料／独立回传分别核验\u003c/text>\u003ctext x=\"591\" y=\"424\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C06 · 17\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S08-02' role='button' tabindex='0' aria-label='中衡临时试验出发区：北霜断供后改中衡转运，冷却只买居民用后余量。；限制：运输更远、试验次数少，不能新源无损补齐。'>\u003ctitle>中衡临时试验出发区 · C06:41\u003c/title>\u003crect x=\"665\" y=\"285\" width=\"505\" height=\"151\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"679\" y=\"300\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"695\" y=\"323\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">中衡临时试验出发区\u003c/text>\u003ctext x=\"695\" y=\"357\" font-size=\"17\" fill=\"{{muted}}\">北霜断供 → 中衡改出发\u003c/text>\u003ctext x=\"695\" y=\"384\" font-size=\"17\" fill=\"{{muted}}\">居民用后冷却余量按实际采购\u003c/text>\u003ctext x=\"1156\" y=\"424\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C06 · 41\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S08-03' role='button' tabindex='0' aria-label='第一层实验接收环：太初晶、中心晶体、双方许可与散热储备支持有限实验桥。；限制：首环永久报废，库存损失真实；不是全族跃迁。'>\u003ctitle>第一层实验接收环 · C06:53\u003c/title>\u003crect x=\"675\" y=\"517\" width=\"495\" height=\"150\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"689\" y=\"532\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"705\" y=\"555\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">第一层实验接收环\u003c/text>\u003ctext x=\"705\" y=\"589\" font-size=\"17\" fill=\"{{muted}}\">稳定窗口＋浓缩晶体＋散热\u003c/text>\u003ctext x=\"705\" y=\"616\" font-size=\"17\" fill=\"{{muted}}\">测量结构往返；旧首环已报废\u003c/text>\u003ctext x=\"1156\" y=\"655\" font-size=\"12\" text-anchor=\"end\" fill=\"{{muted}}\">C06 · 53\u003c/text>\u003c/g>\u003cg class='place' data-key='SER-S08-07' role='button' tabindex='0' aria-label='母界围困：粮能／迁民／囚域：有限航期护民用船位与维生交接，分开军需和民用口。；限制：穗庭军需不得挤掉民用船位；集中囚域护送会失守其他航口。'>\u003ctitle>母界围困：粮能／迁民／囚域 · C06:59\u003c/title>\u003crect x=\"1250\" y=\"285\" width=\"530\" height=\"151\" rx=\"12\" fill=\"{{land}}\" stroke=\"{{coast}}\" stroke-width=\"2\"/>\u003crect x=\"1264\" y=\"300\" width=\"6\" height=\"29\" rx=\"2\" fill=\"{{system}}\"/>\u003ctext x=\"1280\" y=\"323\" font-size=\"22\" font-weight=\"650\" class=\"node-label\">母界围困：粮能／迁民／囚域\u003c/text>\u003ctext x=\"1280\" y=\"357\" font-size=\"17\" fill=\"{{muted}}\">粮能船／迁民口／囚域康复\u003c/text>\u003ctext x=\"1280\" y=\"384\" font-size=\"17\" fill=\"{{muted}}\">不是只破囚域的一条救父路\u003c/text>\u003ctext x=\"1766\" y=\"424\" font-size=\"12 height=\"5\" fill=\"{{terrain}}\"/>\u003crect x=\"218\" y=\"1879\" width=\"12\" height=\"5\" fill=\"{{road}}\"/>\u003crect x=\"235\" y=\"1879\" width=\"12\" height=\"5\" fill=\"{{old}}\"/>\u003crect x=\"252\" y=\"1879\" width=\"12\" height=\"5\" fill=\"{{risk}}\"/>\u003crect x=\"269\" y=\"1879\" width=\"12\" height=\"5\" fill=\"{{system}}\"/>\u003crect x=\"286\" y=\"1879\" width=\"12\" height=\"5\" fill=\"{{inverse}}\"/>\u003ctext x=\"1835\" y=\"1884\" font-size=\"14\" text-anchor=\"end\" fill=\"{{muted}}\">S08 · 系列独立图册 / 拓扑非比例\u003c/text>\u003c/svg>"}]};const COLORS={"paper":"#f6f4ed","sea":"#e9eef0","land":"#e7e9db","ink":"#253e44","muted":"#63777b","line":"#aab6b5","coast":"#7b9389","water":"#548398","terrain":"#73876a","road":"#537362","old":"#a17949","risk":"#b16655","system":"#475f88","inverse":"#ffffff"};const requested=Number(location.hash.match(/^#map-(\d+)$/)?.[1]);let sheet=Number.isInteger(requested)&&requested>0&&requested<=DATA.sheets.length?requested-1:0,selected='',zoom=.5;const $=id=>document.getElementById(id);const safe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const paint=s=>s.replace(/\{\{(\w+)\}\}/g,(_,key)=>COLORS[key]||COLORS.ink);
function list(){const q=$('search').value.trim().toLowerCase();const pool=q?DATA.points:DATA.sheets[sheet].points;const ps=pool.filter(p=>!q||[p.id,p.name,p.region,p.detail,p.limit,p.story,p.overview].join(' ').toLowerCase().includes(q));$('listTitle').textContent=ps.length+' 个节点'+(q?' · 全图册搜索':'');$('places').innerHTML=ps.map(p=>'<button data-place="'+safe(p.id)+'">'+safe(p.id+' '+p.name)+'</button>').join('')}
function detail(){const p=DATA.points.find(p=>p.id===selected);if(!p){$('detail').innerHTML='<h2>'+safe(DATA.sheets[sheet].title)+'</h2><p>点击图形节点查看原文、资源条件与不可越过的限制。</p>';return}const maps=DATA.sheets.map((s,i)=>({s,i})).filter(({s,i})=>i!==sheet&&s.points.some(q=>q.id===p.id));const links=maps.length?'<h3>其他图页</h3>'+maps.map(({s,i})=>'<button data-sheet="'+i+'">'+safe(s.title)+'</button>').join(''):'';const related=p.related.length?'<h3>关联节点</h3>'+p.related.map(id=>{const q=DATA.points.find(q=>q.id===id);return '<button data-place="'+safe(id)+'">'+safe(id+' '+q.name)+'</button>'}).join(''):'';const history=p.overview||p.story;const paragraphs=history?'<h3>背景与机制</h3>'+history.split('\n\n').map(s=>'<p>'+safe(s)+'</p>').join(''):'';const source=DATA.sources[p.source];$('detail').innerHTML='<div class="location">'+safe(p.id+' / '+p.region)+'</div><h2>'+safe(p.name)+'</h2><h3>结构与作用</h3><p>'+safe(p.detail)+'</p><h3>资源、风险与边界</h3><p>'+safe(p.limit)+'</p>'+links+paragraphs+related+'<h3>设定依据</h3><a href="file://'+encodeURI('/Users/wangyong/yong/qoder/novel/系列总设定/'+source)+'#L'+p.line+'">'+safe(source+':'+p.line)+'</a>'}
function setZoom(z){zoom=Math.max(.1,Math.min(2.5,z));$('map').style.width=1900*zoom+'px';const svg=$('map').querySelector('svg');if(svg){svg.style.width='100%';svg.style.height='auto'}$('zoomLabel').textContent=Math.round(zoom*100)+'%'}function fit(){setZoom(($('viewport').clientWidth-2)/1900)}
function draw(){let svg=paint(DATA.sheets[sheet].svg);for(const[id,cls]of[['labels','node-label'],['routes','route-layer'],['risk','risk-layer'],['system','system-layer']])if(!$(id).checked)svg=svg.replace('</svg>','<style>.'+cls+'{display:none}</style></svg>');$('map').innerHTML=svg;$('map').querySelectorAll('[data-key="'+selected+'"]').forEach(el=>el.classList.add('chosen'));$('tabs').innerHTML=DATA.sheets.map((s,i)=>'<button data-tab="'+i+'" class="'+(sheet===i?'active':'')+'">'+safe(s.title)+'</button>').join('');list();detail();setZoom(zoom)}
function choose(id){if(!DATA.sheets[sheet].points.some(p=>p.id===id)){const destination=DATA.sheets.findIndex(s=>s.points.some(p=>p.id===id));if(destination>=0){sheet=destination;$('search').value='';$('viewport').scrollTo(0,0)}}selected=id;draw();document.querySelector('.panel').scrollTop=0}
$('tabs').addEventListener('click',e=>{const el=e.target.closest('[data-tab]');if(!el)return;sheet=Number(el.dataset.tab);selected='';$('viewport').scrollTo(0,0);draw();fit()});$('places').addEventListener('click',e=>{const el=e.target.closest('[data-place]');if(el)choose(el.dataset.place)});$('detail').addEventListener('click',e=>{const link=e.target.closest('[data-sheet]');if(link){sheet=Number(link.dataset.sheet);$('search').value='';$('viewport').scrollTo(0,0);draw();fit();return}const el=e.target.closest('[data-place]');if(el)choose(el.dataset.place)});$('map').addEventListener('click',e=>{const el=e.target.closest('[data-key]');if(el)choose(el.dataset.key)});$('map').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('[data-key]');if(el){e.preventDefault();choose(el.dataset.key)}});$('search').oninput=list;for(const id of['labels','routes','risk','system'])$(id).onchange=draw;$('fit').onclick=fit;$('plus').onclick=()=>setZoom(zoom*1.25);$('minus').onclick=()=>setZoom(zoom/1.25);$('download').onclick=()=>{const blob=new Blob([paint(DATA.sheets[sheet].svg)],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=DATA.sheets[sheet].filename;a.click();URL.revokeObjectURL(url)};const vp=$('viewport');let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('[data-key]'))return;drag={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop};vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(drag){vp.scrollLeft=drag.l-e.clientX+drag.x;vp.scrollTop=drag.t-e.clientY+drag.y}});vp.addEventListener('pointerup',()=>drag=null);vp.addEventListener('pointercancel',()=>drag=null);vp.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:1/1.08))},{passive:false});draw();fit();
</script></body></html>
