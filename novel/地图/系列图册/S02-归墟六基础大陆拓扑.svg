<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1750" viewBox="0 0 1900 1750" role="img" aria-labelledby="S02-title S02-desc" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><title id="S02-title">归墟 · 六基础大陆与银河承接拓扑</title><desc id="S02-desc">北半球：东／西／南／北四方＋中央中衡；南极极渊；拓扑投影并非比例世界地图。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。</desc><defs><marker id="S02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="S02-strata" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 18H28M0 6H15" stroke="#73876a" opacity=".22"/></pattern><style>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:#b16655;stroke-width:4}.halo{paint-order:stroke;stroke:#f6f4ed;stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}</style></defs><rect x="0" y="0" width="1900" height="1750" fill="#f6f4ed"/><rect x="0" y="0" width="18" height="1750" fill="#475f88"/><text x="66" y="65" font-size="36" font-weight="700">归墟 · 六基础大陆与银河承接拓扑</text><text x="66" y="109" font-size="18" fill="#63777b">北半球：东／西／南／北四方＋中央中衡；南极极渊；拓扑投影并非比例世界地图</text><text x="1834" y="65" font-size="28" text-anchor="end" fill="#a17949">S02</text><line x1="65" y1="133" x2="1835" y2="133" stroke="#aab6b5"/><rect x="70" y="190" width="1240" height="1135" rx="160" fill="#e9eef0" stroke="#548398" stroke-width="2"/><line x1="115" y1="1000" x2="1260" y2="1000" stroke="#548398" stroke-dasharray="12 10"/><text x="118" y="982" font-size="17" fill="#548398">赤道示意分隔 · 五大陆均在北半球</text><g class='place' data-key='SER-S02-01' role='button' tabindex='0' aria-label='东岚：温湿、多海岸；东方接入。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>东岚 · U06:21</title><path d="M945 406L1089 390L1190 477L1172 607L1065 668L940 609L910 501Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="1030" y="525" font-size="30" font-weight="650" class="node-label">东岚</text><text x="1030" y="559" font-size="18" fill="#63777b">东方接入</text><text x="1030" y="587" font-size="18" fill="#63777b">温湿／海岸</text></g><g class='place' data-key='SER-S02-02' role='button' tabindex='0' aria-label='西砾：干燥矿带、高原；材料加工。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>西砾 · U06:22</title><path d="M161 418L302 377L422 444L449 544L395 644L238 674L141 579Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="275" y="521" font-size="30" font-weight="650" class="node-label">西砾</text><text x="275" y="555" font-size="18" fill="#63777b">西方接入</text><text x="275" y="583" font-size="18" fill="#63777b">矿带／高原</text></g><g class='place' data-key='SER-S02-03' role='button' tabindex='0' aria-label='南沧：湖海与岛链；航运和南方接入。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>南沧 · U06:23</title><path d="M520 772L640 709L784 744L886 821L838 936L700 971L565 916L496 845Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="650" y="839" font-size="30" font-weight="650" class="node-label">南沧</text><text x="650" y="873" font-size="18" fill="#63777b">南方接入</text><text x="650" y="901" font-size="18" fill="#63777b">湖海／岛链</text></g><g class='place' data-key='SER-S02-04' role='button' tabindex='0' aria-label='北霜：冰原、地下聚落；耐寒载体与北方接入。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>北霜 · U06:24</title><path d="M460 270L574 223L732 219L853 283L838 375L721 411L563 390L461 353Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="620" y="322" font-size="30" font-weight="650" class="node-label">北霜</text><text x="620" y="356" font-size="18" fill="#63777b">北方接入</text><text x="620" y="384" font-size="18" fill="#63777b">冰原／地下聚落</text></g><g class='place' data-key='SER-S02-05' role='button' tabindex='0' aria-label='中衡：四大陆交通、能源分流与浓缩晶体配给。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>中衡 · U06:25</title><path d="M546 484L688 432L831 492L841 609L724 670L570 634L509 565Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="625" y="539" font-size="30" font-weight="650" class="node-label">中衡</text><text x="625" y="573" font-size="18" fill="#63777b">中央分流</text><text x="625" y="601" font-size="18" fill="#63777b">不是核心</text></g><g class='place' data-key='SER-S02-06' role='button' tabindex='0' aria-label='极渊：高压环境；核心维护和主要浓缩产区。；限制：轮廓为拓扑绘图，不给未测海岸、国界或尺度。'><title>极渊 · U06:26</title><path d="M480 1158L564 1070L734 1052L860 1142L839 1262L677 1295L533 1259Z" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="600" y="1166" font-size="30" font-weight="650" class="node-label">极渊</text><text x="600" y="1200" font-size="18" fill="#63777b">南极中心</text><text x="600" y="1228" font-size="18" fill="#63777b">凝晶／高压</text></g><path d="M183 600L218 493L272 591L307 456L360 573M473 291H812M490 327H821" fill="none" stroke="#73876a" stroke-width="2"/><path d="M556 874Q680 817 812 899M971 462Q1012 563 1155 535" fill="none" stroke="#548398" stroke-width="3"/><circle cx="914" cy="923" r="18" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><circle cx="463" cy="900" r="18" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><circle cx="1071" cy="696" r="18" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><circle cx="1214" cy="630" r="18" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M430 530H520" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M430 530H520" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><path d="M707 413V435" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M707 413V435" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><path d="M844 543H907" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M844 543H907" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><path d="M682 710V670" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M682 710V670" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><path d="M730 1070V1026H927V678" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M730 1070V1026H927V678" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><text x="930" y="995" font-size="17" fill="#537362">封装晶体 → 中衡分流</text><rect x="1360" y="235" width="465" height="722" rx="16" fill="#e9eef0" stroke="#aab6b5"/><text x="1384" y="276" font-size="23" font-weight="650">东岚外缘 · 独立展开窗</text><g class='place' data-key='SER-S02-07' role='button' tabindex='0' aria-label='澄岚：银河级承接：承接蓝星所在银河系全部生命谱系；展开陆地约3.2万亿平方公里。；限制：不是第七基础大陆，不把银河承接画成蓝星小岛。'><title>澄岚：银河级承接 · U06:30</title><path d="M1400 390L1510 326L1739 356L1780 551L1712 712L1515 754L1403 633Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="1470" y="434" font-size="30" font-weight="650">澄岚</text><text x="1430" y="476" font-size="18" fill="#63777b">银河系级承接大陆</text><text x="1430" y="510" font-size="18" fill="#63777b">全部生命谱系与生境</text><text x="1430" y="544" font-size="18" fill="#63777b">展开陆地约3.2万亿 km²</text><text x="1430" y="578" font-size="18" fill="#63777b">面积绝不与主图按像素比较</text></g><path d="M1190 492Q1280 371 1400 410" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M1190 492Q1280 371 1400 410" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S02-arrow)"/><text x="1198" y="341" font-size="18" fill="#548398">隔海接续</text><g class='place' data-key='SER-S02-08' role='button' tabindex='0' aria-label='天衡中域 ≠ 中衡：天衡是澄岚繁华腹地；中衡是全域分流大陆。；限制：天衡不产九阶以上专用浓缩晶体。'><title>天衡中域 ≠ 中衡 · U06:30</title><circle cx="1565" cy="667" r="15" fill="#a17949" stroke="#f6f4ed" stroke-width="4"/><circle cx="1565" cy="667" r="23" fill="none" stroke="#a17949" stroke-width="1.5"/><text x="1589" y="659" font-size="23" text-anchor="start" font-weight="650" class="node-label halo">天衡中域 ≠ 中衡</text><text x="1589" y="689" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">澄岚自身腹地</text></g><g class='place' data-key='SER-S02-09' role='button' tabindex='0' aria-label='连续地表展开网络：各段有真实物质、路径、日照、重力、生态条件。；限制：建设和维生散热付有限预算；接缝不免费搬运。'><title>连续地表展开网络 · U06:32</title><rect x="1360" y="995" width="465" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1374" y="1010" width="6" height="29" rx="2" fill="#475f88"/><text x="1390" y="1033" font-size="22" font-weight="650" class="node-label">连续地表展开网络</text><text x="1390" y="1067" font-size="17" fill="#63777b">物质接续／生态容量先落实</text><text x="1390" y="1094" font-size="17" fill="#63777b">接缝 ≠ 免费实体通道</text><text x="1811" y="1134" font-size="12" text-anchor="end" fill="#63777b">U06 · 32</text></g><g class='place' data-key='SER-S02-10' role='button' tabindex='0' aria-label='唯一地下巨界晶：折叠晶格网络按等效展开尺度计量。；限制：非银河实体塞球；中衡不是第二颗核心。'><title>唯一地下巨界晶 · U06:34</title><circle cx="923" cy="1210" r="15" fill="#475f88" stroke="#f6f4ed" stroke-width="4"/><circle cx="923" cy="1210" r="23" fill="none" stroke="#475f88" stroke-width="1.5"/><text x="947" y="1202" font-size="23" text-anchor="start" font-weight="650" class="node-label halo">唯一地下巨界晶</text><text x="947" y="1232" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">极渊地下</text><text x="947" y="1258" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">晶格等效展开</text></g><rect x="80" y="1390" width="1735" height="155" rx="16" fill="#f6f4ed" stroke="#aab6b5" stroke-width="1.5"/><text x="104" y="1429" font-size="24" font-weight="650">读图边界</text><text x="104" y="1462" font-size="17" fill="#63777b">海域与维护屏障把大陆分开；路线仅表达交换联系，未知距离、海岸细部、航时不推定。</text><text x="104" y="1488" font-size="17" fill="#63777b">四方基础大陆一般一至九阶；中衡／极渊资源支持九阶以上承载，不让居民自动跨层。</text><line x1="65" y1="1580" x2="1835" y2="1580" stroke="#aab6b5"/><text x="65" y="1613" font-size="17" fill="#63777b">依据 U06《归墟全域构造与文明接入》「六大陆与核心」：六大陆、澄岚与天衡、地表展开、地下晶格。</text><text x="65" y="1641" font-size="17" fill="#63777b">六基础大陆名称固定；澄岚是承接窗口，不作为第七块基础大陆计数。</text><rect x="65" y="1680" width="12" height="5" fill="#f6f4ed"/><rect x="82" y="1680" width="12" height="5" fill="#e9eef0"/><rect x="99" y="1680" width="12" height="5" fill="#e7e9db"/><rect x="116" y="1680" width="12" height="5" fill="#253e44"/><rect x="133" y="1680" width="12" height="5" fill="#63777b"/><rect x="150" y="1680" width="12" height="5" fill="#aab6b5"/><rect x="167" y="1680" width="12" height="5" fill="#7b9389"/><rect x="184" y="1680" width="12" height="5" fill="#548398"/><rect x="201" y="1680" width="12" height="5" fill="#73876a"/><rect x="218" y="1680" width="12" height="5" fill="#537362"/><rect x="235" y="1680" width="12" height="5" fill="#a17949"/><rect x="252" y="1680" width="12" height="5" fill="#b16655"/><rect x="269" y="1680" width="12" height="5" fill="#475f88"/><rect x="286" y="1680" width="12" height="5" fill="#ffffff"/><text x="1835" y="1685" font-size="14" text-anchor="end" fill="#63777b">S02 · 系列独立图册 / 拓扑非比例</text></svg>