<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1800" viewBox="0 0 1900 1800" role="img" aria-labelledby="S05-title S05-desc" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><title id="S05-title">系列标志设施 · 实体剖面与固定时域</title><desc id="S05-desc">设施为全域机制示意，地点／尺寸未定；不安插为第一部设施，不把塔层当三层宇宙。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。</desc><defs><marker id="S05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="S05-strata" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 18H28M0 6H15" stroke="#73876a" opacity=".22"/></pattern><style>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:#b16655;stroke-width:4}.halo{paint-order:stroke;stroke:#f6f4ed;stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}</style></defs><rect x="0" y="0" width="1900" height="1800" fill="#f6f4ed"/><rect x="0" y="0" width="18" height="1800" fill="#475f88"/><text x="66" y="65" font-size="36" font-weight="700">系列标志设施 · 实体剖面与固定时域</text><text x="66" y="109" font-size="18" fill="#63777b">设施为全域机制示意，地点／尺寸未定；不安插为第一部设施，不把塔层当三层宇宙</text><text x="1834" y="65" font-size="28" text-anchor="end" fill="#a17949">S05</text><line x1="65" y1="133" x2="1835" y2="133" stroke="#aab6b5"/><rect x="80" y="195" width="535" height="680" rx="16" fill="#f6f4ed" stroke="#aab6b5" stroke-width="1.5"/><text x="104" y="234" font-size="24" font-weight="650">溯源柱：负荷向上检验</text><rect x="690" y="195" width="535" height="680" rx="16" fill="#f6f4ed" stroke="#aab6b5" stroke-width="1.5"/><text x="714" y="234" font-size="24" font-weight="650">炼神塔：分段精炼回路</text><rect x="1300" y="195" width="535" height="680" rx="16" fill="#f6f4ed" stroke="#aab6b5" stroke-width="1.5"/><text x="1324" y="234" font-size="24" font-weight="650">万界擂台：同意与隔离</text><g class='place' data-key='SER-S05-01' role='button' tabindex='0' aria-label='溯源柱：逐级测试意识沟通；灌注需要登记输入与承载复测。；限制：柱层不是宇宙层级，过载即停。'><title>溯源柱 · U06:66</title><g transform="translate(348 498) scale(1.7)"><path d="M-48 65L-34-80L0-115L34-80L48 65Z" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><line x1="-38" y1="-60" x2="38" y2="-60" fill="none" stroke="#aab6b5" stroke-width="1.5"/><line x1="-38" y1="-20" x2="38" y2="-20" fill="none" stroke="#aab6b5" stroke-width="1.5"/><line x1="-38" y1="20" x2="38" y2="20" fill="none" stroke="#aab6b5" stroke-width="1.5"/><line x1="-38" y1="60" x2="38" y2="60" fill="none" stroke="#aab6b5" stroke-width="1.5"/><rect x="-12" y="37" width="24" height="28" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/></g><circle cx="348" cy="650" r="40" fill="#e9eef0" stroke="#548398" stroke-width="2"/><text x="129" y="743" font-size="18" font-weight="650">低负荷沟通 → 同步复测 → 合格灌注</text></g><path d="M130 667H245" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><path d="M454 655H522V371H405" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><text x="122" y="785" font-size="18" fill="#63777b">登记输入与承载复测后才到灌注段</text><text x="122" y="815" font-size="18" fill="#63777b">测试不通过就止步／减载</text><g class='place' data-key='SER-S05-02' role='button' tabindex='0' aria-label='炼神塔：检测结构、分段精炼，记录热耗与意识负荷。；限制：不改写人格，不凭空补满能量。'><title>炼神塔 · U06:67</title><rect x="831" y="366" width="250" height="291" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="850" y="405" width="210" height="51" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><text x="955" y="439" font-size="19" text-anchor="middle">结构检测</text><rect x="850" y="477" width="210" height="51" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><text x="955" y="511" font-size="19" text-anchor="middle">分段精炼</text><rect x="850" y="549" width="210" height="51" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><text x="955" y="583" font-size="19" text-anchor="middle">控制复核</text><g transform="translate(955 688) scale(0.6)"><path d="M0-50L35-25L42 25L0 55L-42 25L-35-25Z" fill="#475f88" fill-opacity=".16" stroke="#475f88" stroke-width="3"/><path d="M0-50V55M-35-25L42 25M35-25L-42 25M-42 25H42" fill="none" stroke="#aab6b5" stroke-width="1.5"/></g></g><path d="M742 420H831" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><path d="M1082 478H1170V693" class="risk-layer" fill="none" stroke="#b16655" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><path d="M1160 731q-14-19 0-41M1186 731q-14-19 0-41" fill="none" stroke="#b16655" stroke-width="3"/><text x="1112" y="768" font-size="18" fill="#b16655">热耗排出</text><text x="730" y="808" font-size="18" fill="#63777b">精纯度改善 ≠ 总量增加</text><g class='place' data-key='SER-S05-03' role='button' tabindex='0' aria-label='万界擂台：双方同意、按载体气量设备分组；观众隔离。；限制：积分换限时增益或有库存宝物，不授统治权。'><title>万界擂台 · U06:68</title><circle cx="1567" cy="499" r="169" fill="#e9eef0" stroke="#7b9389" stroke-width="3"/><circle cx="1567" cy="499" r="115" fill="#e7e9db" stroke="#475f88" stroke-width="2"/><line x1="1428" y1="499" x2="1706" y2="499" fill="none" stroke="#aab6b5" stroke-width="1.5"/><circle cx="1516" cy="499" r="18" fill="#537362"/><circle cx="1617" cy="499" r="18" fill="#a17949"/><text x="1567" y="690" font-size="19" text-anchor="middle">双侧入场／观众隔离环</text></g><g class='place' data-key='SER-S05-09' role='button' tabindex='0' aria-label='败退保护与真实风险：常规保护并非绝对，失败仍可能伤亡。；限制：原住民不是可刷新或可消耗材料。'><title>败退保护与真实风险 · U06:71</title><circle cx="1410" cy="760" r="15" fill="#b16655" stroke="#f6f4ed" stroke-width="4"/><circle cx="1410" cy="760" r="23" fill="none" stroke="#b16655" stroke-width="1.5"/><text x="1434" y="752" font-size="23" text-anchor="start" font-weight="650" class="node-label halo">败退保护与真实风险</text><text x="1434" y="782" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">保护失效仍会伤亡</text></g><path d="M1715 653V793H1786" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><rect x="80" y="930" width="1755" height="613" rx="16" fill="#f6f4ed" stroke="#aab6b5" stroke-width="1.5"/><text x="104" y="969" font-size="24" font-weight="650">时渊：固定域与外部载体并存</text><text x="104" y="1002" font-size="17" fill="#63777b">下图为设施连接，不是把过去、现在、未来三个时间点连起来；每次外部运行不超过12小时。</text><g class='place' data-key='SER-S05-04' role='button' tabindex='0' aria-label='时渊：试炼令牌调用已建2、10、100倍时域。；限制：每次外部≤12h，逐次付维护／寿命／载体预算。'><title>时渊 · U06:69</title><rect x="120" y="1105" width="295" height="194" rx="14" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><text x="144" y="1146" font-size="23" font-weight="650">试炼／令牌／预算</text><text x="144" y="1185" font-size="18" fill="#63777b">外部载体与时钟</text><text x="144" y="1217" font-size="18" fill="#63777b">维护、寿命、载体逐次付</text><text x="144" y="1249" font-size="18" fill="#63777b">不足降档或停止</text></g><g class='place' data-key='SER-S05-05' role='button' tabindex='0' aria-label='固定 2 倍时域：外部上限12h时，相应域内经历上限为24h（倍率乘法，非额外保证）。；限制：预算不足降档；不能自选任意倍率或回到过去。'><title>固定 2 倍时域 · U06:69</title><rect x="530" y="1105" width="330" height="194" rx="12" fill="#e9eef0" stroke="#7b9389" stroke-width="2"/><rect x="544" y="1120" width="6" height="29" rx="2" fill="#475f88"/><text x="560" y="1143" font-size="22" font-weight="650" class="node-label">固定 2 倍时域</text><text x="560" y="1177" font-size="17" fill="#63777b">外部≤12h → 域内≤24h</text><text x="560" y="1204" font-size="17" fill="#63777b">只增未来主观经历</text><text x="560" y="1231" font-size="17" fill="#63777b">已建固定域／非任意旋钮</text><text x="846" y="1287" font-size="12" text-anchor="end" fill="#63777b">U06 · 69</text></g><circle cx="695" cy="1356" r="26" fill="none" stroke="#548398" stroke-width="3"/><line x1="695" y1="1356" x2="695" y2="1339" stroke="#548398" stroke-width="3"/><line x1="695" y1="1356" x2="710" y2="1368" stroke="#548398" stroke-width="3"/><g class='place' data-key='SER-S05-06' role='button' tabindex='0' aria-label='固定 10 倍时域：外部上限12h时，相应域内经历上限为120h（倍率乘法，非额外保证）。；限制：预算不足降档；不能自选任意倍率或回到过去。'><title>固定 10 倍时域 · U06:69</title><rect x="900" y="1105" width="330" height="194" rx="12" fill="#e9eef0" stroke="#7b9389" stroke-width="2"/><rect x="914" y="1120" width="6" height="29" rx="2" fill="#475f88"/><text x="930" y="1143" font-size="22" font-weight="650" class="node-label">固定 10 倍时域</text><text x="930" y="1177" font-size="17" fill="#63777b">外部≤12h → 域内≤120h</text><text x="930" y="1204" font-size="17" fill="#63777b">只增未来主观经历</text><text x="930" y="1231" font-size="17" fill="#63777b">已建固定域／非任意旋钮</text><text x="1216" y="1287" font-size="12" text-anchor="end" fill="#63777b">U06 · 69</text></g><circle cx="1065" cy="1356" r="26" fill="none" stroke="#548398" stroke-width="3"/><line x1="1065" y1="1356" x2="1065" y2="1339" stroke="#548398" stroke-width="3"/><line x1="1065" y1="1356" x2="1080" y2="1368" stroke="#548398" stroke-width="3"/><g class='place' data-key='SER-S05-07' role='button' tabindex='0' aria-label='固定 100 倍时域：外部上限12h时，相应域内经历上限为1200h（倍率乘法，非额外保证）。；限制：预算不足降档；不能自选任意倍率或回到过去。'><title>固定 100 倍时域 · U06:69</title><rect x="1270" y="1105" width="330" height="194" rx="12" fill="#e9eef0" stroke="#7b9389" stroke-width="2"/><rect x="1284" y="1120" width="6" height="29" rx="2" fill="#475f88"/><text x="1300" y="1143" font-size="22" font-weight="650" class="node-label">固定 100 倍时域</text><text x="1300" y="1177" font-size="17" fill="#63777b">外部≤12h → 域内≤1200h</text><text x="1300" y="1204" font-size="17" fill="#63777b">只增未来主观经历</text><text x="1300" y="1231" font-size="17" fill="#63777b">已建固定域／非任意旋钮</text><text x="1586" y="1287" font-size="12" text-anchor="end" fill="#63777b">U06 · 69</text></g><circle cx="1435" cy="1356" r="26" fill="none" stroke="#548398" stroke-width="3"/><line x1="1435" y1="1356" x2="1435" y2="1339" stroke="#548398" stroke-width="3"/><line x1="1435" y1="1356" x2="1450" y2="1368" stroke="#548398" stroke-width="3"/><path d="M415 1200H465V1052H1458V1105" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S05-arrow)"/><path d="M840 1052V1105" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S05-arrow)"/><path d="M650 1052V1105" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S05-arrow)"/><g class='place' data-key='SER-S05-08' role='button' tabindex='0' aria-label='回传校准与输出限额：退出须校准回传；高倍率不保证外部肉体同步获得全部增长。；限制：输出能量另受连接额度限制。'><title>回传校准与输出限额 · U06:71</title><rect x="450" y="1432" width="1280" height="87" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="464" y="1447" width="6" height="29" rx="2" fill="#475f88"/><text x="480" y="1470" font-size="22" font-weight="650" class="node-label">回传校准与输出限额</text><text x="480" y="1504" font-size="17" fill="#63777b">回传先校准；肉体成长非同步保证；额外输出另受额度限制</text><text x="1716" y="1507" font-size="12" text-anchor="end" fill="#63777b">U06 · 71</text></g><path d="M695 1384V1416H987V1432" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><path d="M1065 1384V1420" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><path d="M1435 1384V1416H1210V1432" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S05-arrow)"/><text x="119" y="1377" font-size="22" fill="#b16655" font-weight="650">无过去端口</text><path d="M126 1400H285M126 1384L285 1416" stroke="#b16655" stroke-width="3"/><line x1="65" y1="1637" x2="1835" y2="1637" stroke="#aab6b5"/><text x="65" y="1670" font-size="17" fill="#63777b">倍率换算只是12h×固定档的经历上界，不新增可用能量、长寿保证或外部肉身同步成长；退出不是物品传送。</text><text x="65" y="1698" font-size="17" fill="#63777b">依据 U06《归墟全域构造与文明接入》「四类标志设施」：入场规则、败退保护、固定时域与回传校准。</text><rect x="65" y="1737" width="12" height="5" fill="#f6f4ed"/><rect x="82" y="1737" width="12" height="5" fill="#e9eef0"/><rect x="99" y="1737" width="12" height="5" fill="#e7e9db"/><rect x="116" y="1737" width="12" height="5" fill="#253e44"/><rect x="133" y="1737" width="12" height="5" fill="#63777b"/><rect x="150" y="1737" width="12" height="5" fill="#aab6b5"/><rect x="167" y="1737" width="12" height="5" fill="#7b9389"/><rect x="184" y="1737" width="12" height="5" fill="#548398"/><rect x="201" y="1737" width="12" height="5" fill="#73876a"/><rect x="218" y="1737" width="12" height="5" fill="#537362"/><rect x="235" y="1737" width="12" height="5" fill="#a17949"/><rect x="252" y="1737" width="12" height="5" fill="#b16655"/><rect x="269" y="1737" width="12" height="5" fill="#475f88"/><rect x="286" y="1737" width="12" height="5" fill="#ffffff"/><text x="1835" y="1742" font-size="14" text-anchor="end" fill="#63777b">S05 · 系列独立图册 / 拓扑非比例</text></svg>