<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1900" viewBox="0 0 1900 1900" role="img" aria-labelledby="S08-title S08-desc" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><title id="S08-title">远期独立旅程 · 三层有限节点与载体迁接</title><desc id="S08-desc">直接读作空间／载体／物流拓扑，非旅行时间线、逐卷次序或逐章安排；节点是已授权有限范围。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。</desc><defs><marker id="S08-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="S08-strata" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 18H28M0 6H15" stroke="#73876a" opacity=".22"/></pattern><style>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:#b16655;stroke-width:4}.halo{paint-order:stroke;stroke:#f6f4ed;stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}</style></defs><rect x="0" y="0" width="1900" height="1900" fill="#f6f4ed"/><rect x="0" y="0" width="18" height="1900" fill="#475f88"/><text x="66" y="65" font-size="36" font-weight="700">远期独立旅程 · 三层有限节点与载体迁接</text><text x="66" y="109" font-size="18" fill="#63777b">直接读作空间／载体／物流拓扑，非旅行时间线、逐卷次序或逐章安排；节点是已授权有限范围</text><text x="1834" y="65" font-size="28" text-anchor="end" fill="#a17949">S08</text><line x1="65" y1="133" x2="1835" y2="133" stroke="#aab6b5"/><rect x="75" y="195" width="1750" height="540" rx="24" fill="#e7e9db" fill-opacity=".5" stroke="#7b9389"/><text x="100" y="234" font-size="25" font-weight="650">第一载体层 · 独立大陆远行与母界实体供给</text><g class='place' data-key='SER-S08-01' role='button' tabindex='0' aria-label='异质旅伴独立远行：混编队搬材料、核转接并接回误判者；载体需求决定路线。；限制：保养舱／回程／带宽／居留均有限，不按苏木身体统排。'><title>异质旅伴独立远行 · C06:17</title><rect x="100" y="285" width="505" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="114" y="300" width="6" height="29" rx="2" fill="#475f88"/><text x="130" y="323" font-size="22" font-weight="650" class="node-label">异质旅伴独立远行</text><text x="130" y="357" font-size="17" fill="#63777b">骨环／菌膜／光硅／羽骨分别适配</text><text x="130" y="384" font-size="17" fill="#63777b">保养材料／独立回传分别核验</text><text x="591" y="424" font-size="12" text-anchor="end" fill="#63777b">C06 · 17</text></g><g class='place' data-key='SER-S08-02' role='button' tabindex='0' aria-label='中衡临时试验出发区：北霜断供后改中衡转运，冷却只买居民用后余量。；限制：运输更远、试验次数少，不能新源无损补齐。'><title>中衡临时试验出发区 · C06:41</title><rect x="665" y="285" width="505" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="679" y="300" width="6" height="29" rx="2" fill="#475f88"/><text x="695" y="323" font-size="22" font-weight="650" class="node-label">中衡临时试验出发区</text><text x="695" y="357" font-size="17" fill="#63777b">北霜断供 → 中衡改出发</text><text x="695" y="384" font-size="17" fill="#63777b">居民用后冷却余量按实际采购</text><text x="1156" y="424" font-size="12" text-anchor="end" fill="#63777b">C06 · 41</text></g><g class='place' data-key='SER-S08-03' role='button' tabindex='0' aria-label='第一层实验接收环：太初晶、中心晶体、双方许可与散热储备支持有限实验桥。；限制：首环永久报废，库存损失真实；不是全族跃迁。'><title>第一层实验接收环 · C06:53</title><rect x="675" y="517" width="495" height="150" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="689" y="532" width="6" height="29" rx="2" fill="#475f88"/><text x="705" y="555" font-size="22" font-weight="650" class="node-label">第一层实验接收环</text><text x="705" y="589" font-size="17" fill="#63777b">稳定窗口＋浓缩晶体＋散热</text><text x="705" y="616" font-size="17" fill="#63777b">测量结构往返；旧首环已报废</text><text x="1156" y="655" font-size="12" text-anchor="end" fill="#63777b">C06 · 53</text></g><g class='place' data-key='SER-S08-07' role='button' tabindex='0' aria-label='母界围困：粮能／迁民／囚域：有限航期护民用船位与维生交接，分开军需和民用口。；限制：穗庭军需不得挤掉民用船位；集中囚域护送会失守其他航口。'><title>母界围困：粮能／迁民／囚域 · C06:59</title><rect x="1250" y="285" width="530" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1264" y="300" width="6" height="29" rx="2" fill="#475f88"/><text x="1280" y="323" font-size="22" font-weight="650" class="node-label">母界围困：粮能／迁民／囚域</text><text x="1280" y="357" font-size="17" fill="#63777b">粮能船／迁民口／囚域康复</text><text x="1280" y="384" font-size="17" fill="#63777b">不是只破囚域的一条救父路</text><text x="1766" y="424" font-size="12" text-anchor="end" fill="#63777b">C06 · 59</text></g><g class='place' data-key='SER-S08-08' role='button' tabindex='0' aria-label='三组接口互相制衡：母界库存／旧子界回流／民用维生以转运和独立核验制衡。；限制：任何一方单征失去其他安全供给，不是宣言替代物流。'><title>三组接口互相制衡 · C06:63</title><rect x="1250" y="517" width="530" height="150" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1264" y="532" width="6" height="29" rx="2" fill="#475f88"/><text x="1280" y="555" font-size="22" font-weight="650" class="node-label">三组接口互相制衡</text><text x="1280" y="589" font-size="17" fill="#63777b">母界库存 ↔ 子界回流 ↔ 民用维生</text><text x="1280" y="616" font-size="17" fill="#63777b">真实转运保证密钥／账本制衡</text><text x="1766" y="655" font-size="12" text-anchor="end" fill="#63777b">C06 · 63</text></g><path d="M605 357H665" fill="none" stroke="#548398" stroke-width="18" opacity=".13"/><path d="M605 357H665" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M915 436V516" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1170 365H1250" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1517 436V517" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><g transform="translate(1214 483) scale(0.46)"><path d="M-60 10H60L40 38H-38Z" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="-32" y="-20" width="57" height="29" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><line x1="-48" y1="17" x2="48" y2="17" fill="none" stroke="#aab6b5" stroke-width="1.5"/><rect x="-14" y="-39" width="13" height="19" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><path d="M-75 48Q-50 36-25 48T25 48T75 48" fill="none" stroke="#548398" stroke-width="2"/></g><text x="103" y="515" font-size="20" font-weight="650">独立生活不会被公共试验吞并</text><text x="103" y="553" font-size="18" fill="#63777b">小规模分批，不必全族搬迁</text><text x="103" y="586" font-size="18" fill="#63777b">首轮不搬完整人格</text><text x="103" y="619" font-size="18" fill="#63777b">母界与归墟不同等级但同层</text><rect x="75" y="805" width="1750" height="380" rx="24" fill="#e9eef0" stroke="#475f88"/><text x="100" y="845" font-size="25" font-weight="650">第二织律层 · 双向耦合／实测／回接</text><g class='place' data-key='SER-S08-04' role='button' tabindex='0' aria-label='衡织公社：织律载体端：与第一层实验团只交换测量结构与有限能量。；限制：首轮不输入完整人格，公共工程不取得太初晶全部权限。'><title>衡织公社：织律载体端 · C06:47</title><rect x="130" y="916" width="485" height="184" rx="12" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="144" y="931" width="6" height="29" rx="2" fill="#475f88"/><text x="160" y="954" font-size="22" font-weight="650" class="node-label">衡织公社：织律载体端</text><text x="160" y="988" font-size="17" fill="#63777b">衡织维护者／律晶／材料节点</text><text x="160" y="1015" font-size="17" fill="#63777b">本地余量与检修窗口可拒加测</text><text x="601" y="1088" font-size="12" text-anchor="end" fill="#63777b">C06 · 47</text></g><g class='place' data-key='SER-S08-05' role='button' tabindex='0' aria-label='律晶节点：位移／能流阻力：同一测量结构在律晶节点表现为位移和阻力变化。；限制：作用依附节点既有规则，离开不持续。'><title>律晶节点：位移／能流阻力 · C06:49</title><rect x="745" y="916" width="465" height="151" rx="12" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="759" y="931" width="6" height="29" rx="2" fill="#475f88"/><text x="775" y="954" font-size="22" font-weight="650" class="node-label">律晶节点：位移／能流阻力</text><text x="775" y="988" font-size="17" fill="#63777b">物质结构真实位移／阻力</text><text x="775" y="1015" font-size="17" fill="#63777b">既有有限相容域</text><text x="1196" y="1055" font-size="12" text-anchor="end" fill="#63777b">C06 · 49</text></g><g class='place' data-key='SER-S08-06' role='button' tabindex='0' aria-label='场节点：连通次序改变：另一场节点可改变局部连接，近路可能返回出发口。；限制：必须送出接回换节点，旧经验不是全域地图。'><title>场节点：连通次序改变 · C06:49</title><rect x="1315" y="916" width="465" height="151" rx="12" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><rect x="1329" y="931" width="6" height="29" rx="2" fill="#475f88"/><text x="1345" y="954" font-size="22" font-weight="650" class="node-label">场节点：连通次序改变</text><text x="1345" y="988" font-size="17" fill="#63777b">连通次序重排／近路折回</text><text x="1345" y="1015" font-size="17" fill="#63777b">不能拿总能量推断方向</text><text x="1766" y="1055" font-size="12" text-anchor="end" fill="#63777b">C06 · 49</text></g><path d="M820 667V780H58V886H372V916" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S08-arrow)"/><path d="M1030 916V770H1080V667" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S08-arrow)"/><text x="690" y="763" font-size="18" fill="#475f88">物质状态 ↔ 规则状态 · 供能／转码／适配／回程损耗</text><path d="M615 990H745" fill="none" stroke="#475f88" stroke-width="18" opacity=".13"/><path d="M615 990H745" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1210 990H1315" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1530 1070V1135H955V1070" class="route-layer" fill="none" stroke="#a17949" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S08-arrow)"/><text x="1075" y="1164" font-size="17" fill="#a17949">折返实测：不画成直线全域航路</text><rect x="75" y="1240" width="1750" height="400" rx="24" fill="#e7e9db" fill-opacity=".45" stroke="#a17949"/><text x="100" y="1278" font-size="25" font-weight="650">第三源序层 · 互证桥／序格载体／竞争迁接</text><g class='place' data-key='SER-S08-09' role='button' tabindex='0' aria-label='第三层：序格与互证载体：公共谱院与商庭各有规则生成和兼容载体。；限制：不是全宇宙主人，不增加第四层。'><title>第三层：序格与互证载体 · C06:77</title><rect x="115" y="1355" width="480" height="149" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="129" y="1370" width="6" height="29" rx="2" fill="#475f88"/><text x="145" y="1393" font-size="22" font-weight="650" class="node-label">第三层：序格与互证载体</text><text x="145" y="1427" font-size="17" fill="#63777b">序庭公共谱院／封谱商庭</text><text x="145" y="1454" font-size="17" fill="#63777b">规则生成仍依序格与校验载体</text><text x="581" y="1492" font-size="12" text-anchor="end" fill="#63777b">C06 · 77</text></g><g class='place' data-key='SER-S08-10' role='button' tabindex='0' aria-label='开放基础谱支路：适配旧节点广，可地方修补，但校验慢、缓冲多。；限制：开放不免费供维护，可能错过航期。'><title>开放基础谱支路 · C06:79</title><rect x="715" y="1325" width="495" height="128" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="729" y="1340" width="6" height="29" rx="2" fill="#475f88"/><text x="745" y="1363" font-size="22" font-weight="650" class="node-label">开放基础谱支路</text><text x="745" y="1397" font-size="17" fill="#63777b">校验慢／可修补／缓冲与工时</text><text x="1196" y="1441" font-size="12" text-anchor="end" fill="#63777b">C06 · 79</text></g><g class='place' data-key='SER-S08-11' role='button' tabindex='0' aria-label='商业改进支路：部分高负荷节点低延迟／低损耗，需付许可费。；限制：换供应者重验证，商业有价值但不得强永久排他。'><title>商业改进支路 · C06:79</title><rect x="715" y="1480" width="495" height="128" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="729" y="1495" width="6" height="29" rx="2" fill="#475f88"/><text x="745" y="1518" font-size="22" font-weight="650" class="node-label">商业改进支路</text><text x="745" y="1552" font-size="17" fill="#63777b">低延迟／许可付费／换方重验</text><text x="1196" y="1596" font-size="12" text-anchor="end" fill="#63777b">C06 · 79</text></g><g class='place' data-key='SER-S08-12' role='button' tabindex='0' aria-label='非排他研究回程支路：苏木实测与双方授权在有限范围迁接研究回程。；限制：不增容量；商用费照付；非唯一接口或全域万能航图。'><title>非排他研究回程支路 · C06:83</title><rect x="1325" y="1400" width="450" height="166" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1339" y="1415" width="6" height="29" rx="2" fill="#475f88"/><text x="1355" y="1438" font-size="22" font-weight="650" class="node-label">非排他研究回程支路</text><text x="1355" y="1472" font-size="17" fill="#63777b">地方授权选定范围／既有节点</text><text x="1355" y="1499" font-size="17" fill="#63777b">非排他有限回程；不增加容量</text><text x="1761" y="1554" font-size="12" text-anchor="end" fill="#63777b">C06 · 83</text></g><path d="M400 1100V1210H58V1320H355V1355" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S08-arrow)"/><text x="505" y="1223" font-size="18" fill="#475f88">规则实例 ↔ 生成依据 · 基准／纠错／验证成本</text><path d="M595 1428H654V1385H715" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M654 1428V1544H715" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1210 1385H1270V1452H1325" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1210 1544H1270V1513H1325" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S08-arrow)"/><path d="M1776 1485H1846V998H1780" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S08-arrow)"/><text x="1774" y="1317" font-size="15" text-anchor="end" fill="#475f88">逐段回接仍有费用</text><g class='place' data-key='SER-S08-13' role='button' tabindex='0' aria-label='永久弃用的旧端口：新旧无法同时保养，部分旧通道永久弃用。；限制：拒接主体仍有权利，不补等价通道抹掉损失。'><title>永久弃用的旧端口 · C06:85</title><rect x="95" y="1680" width="560" height="87" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="109" y="1695" width="6" height="29" rx="2" fill="#475f88"/><text x="125" y="1718" font-size="22" font-weight="650" class="node-label">永久弃用的旧端口</text><text x="125" y="1752" font-size="17" fill="#63777b">旧端口停用是永久结果</text><text x="641" y="1755" font-size="12" text-anchor="end" fill="#63777b">C06 · 85</text></g><g class='place' data-key='SER-S08-14' role='button' tabindex='0' aria-label='有限航图与各自生活：苏木保有分批探索与返日常；陆澄康复、闻绛职责节奏独立。；限制：不要求所有文明永远同路，自然消亡与真实死亡仍在。'><title>有限航图与各自生活 · C06:95</title><rect x="685" y="1680" width="550" height="87" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="699" y="1695" width="6" height="29" rx="2" fill="#475f88"/><text x="715" y="1718" font-size="22" font-weight="650" class="node-label">有限航图与各自生活</text><text x="715" y="1752" font-size="17" fill="#63777b">保留有限个人航图和分批探索</text><text x="1221" y="1755" font-size="12" text-anchor="end" fill="#63777b">C06 · 95</text></g><g class='place' data-key='SER-S08-15' role='button' tabindex='0' aria-label='独立旅程，不是逐章时间线：事件有远行、库存、城市、往返实验、围困与兼容竞争等不同体验。；限制：连线表示空间、物流和载体依赖；间距不推定航期或逐章次序。'><title>独立旅程，不是逐章时间线 · INDEX:19</title><rect x="1265" y="1680" width="540" height="87" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1279" y="1695" width="6" height="29" rx="2" fill="#475f88"/><text x="1295" y="1718" font-size="22" font-weight="650" class="node-label">独立旅程，不是逐章时间线</text><text x="1295" y="1752" font-size="17" fill="#63777b">本页不是事件1→8逐章路线</text><text x="1791" y="1755" font-size="12" text-anchor="end" fill="#63777b">INDEX · 19</text></g><line x1="65" y1="1779" x2="1835" y2="1779" stroke="#aab6b5"/><text x="65" y="1812" font-size="17" fill="#63777b">依据 C06《系列议题、远期事件与设定归档》「宏观事件的确定状态与因果」；INDEX《系列总设定：总纲与阅读导航》。</text><text x="65" y="1840" font-size="17" fill="#63777b">三层之外不增层；实测不万能改规则；不复活、不无限供能、不免费传送，不恢复已报废接口。</text><rect x="65" y="1879" width="12" height="5" fill="#f6f4ed"/><rect x="82" y="1879" width="12" height="5" fill="#e9eef0"/><rect x="99" y="1879" width="12" height="5" fill="#e7e9db"/><rect x="116" y="1879" width="12" height="5" fill="#253e44"/><rect x="133" y="1879" width="12" height="5" fill="#63777b"/><rect x="150" y="1879" width="12" height="5" fill="#aab6b5"/><rect x="167" y="1879" width="12" height="5" fill="#7b9389"/><rect x="184" y="1879" width="12" height="5" fill="#548398"/><rect x="201" y="1879" width="12" height="5" fill="#73876a"/><rect x="218" y="1879" width="12" height="5" fill="#537362"/><rect x="235" y="1879" width="12" height="5" fill="#a17949"/><rect x="252" y="1879"