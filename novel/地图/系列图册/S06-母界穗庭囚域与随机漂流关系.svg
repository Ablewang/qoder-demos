<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1850" viewBox="0 0 1900 1850" role="img" aria-labelledby="S06-title S06-desc" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><title id="S06-title">母界／穗庭／静衡囚域 · 随机漂流与蓝星终点</title><desc id="S06-desc">同层等级位置与载体去向图；曲线不表示直达星路、共同公历或线性旅行年表；未知坐标保留未知。点击实际几何标记查看逐行来源。全部形状仅为关系构图，不给未知坐标、比例或航时。</desc><defs><marker id="S06-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="S06-strata" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 18H28M0 6H15" stroke="#73876a" opacity=".22"/></pattern><style>.place{cursor:pointer}.place:focus{outline:none}.place:focus>rect,.place:focus>circle,.place:focus>path{stroke:#b16655;stroke-width:4}.halo{paint-order:stroke;stroke:#f6f4ed;stroke-width:5;stroke-linejoin:round}.node-label{pointer-events:none}</style></defs><rect x="0" y="0" width="1900" height="1850" fill="#f6f4ed"/><rect x="0" y="0" width="18" height="1850" fill="#475f88"/><text x="66" y="65" font-size="36" font-weight="700">母界／穗庭／静衡囚域 · 随机漂流与蓝星终点</text><text x="66" y="109" font-size="18" fill="#63777b">同层等级位置与载体去向图；曲线不表示直达星路、共同公历或线性旅行年表；未知坐标保留未知</text><text x="1834" y="65" font-size="28" text-anchor="end" fill="#a17949">S06</text><line x1="65" y1="133" x2="1835" y2="133" stroke="#aab6b5"/><rect x="80" y="195" width="1740" height="630" rx="35" fill="#e9eef0" stroke="#548398"/><text x="108" y="235" font-size="25" font-weight="650">第一载体层 · 高等母界 ↔ 中等穗庭 ↔ 随机低等入口</text><g class='place' data-key='SER-S06-01' role='button' tabindex='0' aria-label='混沌母界 · 第一层高等：母界及子界的总量有限，成形锁能和反哺滞后造成存续压力。；限制：不是第二层；高等不免除衰退与成本。'><title>混沌母界 · 第一层高等 · C01:31</title><ellipse cx="480" cy="510" rx="322" ry="223" fill="#e7e9db" stroke="#7b9389" stroke-width="3"/><text x="260" y="381" font-size="30" font-weight="650">混沌母界</text><text x="260" y="419" font-size="19" fill="#63777b">第一层 · 高等</text><text x="260" y="451" font-size="19" fill="#63777b">公共库存／子界锁能／接口维护</text></g><g class='place' data-key='SER-S06-04' role='button' tabindex='0' aria-label='静衡囚域：陆澄肉体与意识依稳定材料、节流维生结构低耗维持。；限制：限制行动与摄取；并非无依附悬空意识。'><title>静衡囚域 · C02:31</title><rect x="256" y="513" width="420" height="151" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="270" y="528" width="6" height="29" rx="2" fill="#475f88"/><text x="286" y="551" font-size="22" font-weight="650" class="node-label">静衡囚域</text><text x="286" y="585" font-size="17" fill="#63777b">陆澄：肉体＋意识持续维生</text><text x="286" y="612" font-size="17" fill="#63777b">材料稳定／低耗／交流受限</text><text x="662" y="652" font-size="12" text-anchor="end" fill="#63777b">C02 · 31</text></g><g class='place' data-key='SER-S06-02' role='button' tabindex='0' aria-label='穗庭 · 第一层中等：闻绛已孕育穗庭，维护迁民、界籍、粮能与航路。；限制：她是地脉，不是隐蔽高层全能存在。'><title>穗庭 · 第一层中等 · C02:5</title><rect x="1120" y="331" width="590" height="155" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1134" y="346" width="6" height="29" rx="2" fill="#475f88"/><text x="1150" y="369" font-size="22" font-weight="650" class="node-label">穗庭 · 第一层中等</text><text x="1150" y="403" font-size="17" fill="#63777b">闻绛：地脉／已孕育中等子界</text><text x="1150" y="430" font-size="17" fill="#63777b">住民／粮能／维护船队／界籍副本</text><text x="1696" y="474" font-size="12" text-anchor="end" fill="#63777b">C02 · 5</text></g><g class='place' data-key='SER-S06-03' role='button' tabindex='0' aria-label='续穗迁民局与民用通道：居民议会授权粮能、船队、档案；保存副本并安置迁民。；限制：闻绛知道婴儿逃出，不知道蓝星坐标；不能无成本收容。'><title>续穗迁民局与民用通道 · C02:33</title><rect x="1120" y="564" width="590" height="164" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1134" y="579" width="6" height="29" rx="2" fill="#475f88"/><text x="1150" y="602" font-size="22" font-weight="650" class="node-label">续穗迁民局与民用通道</text><text x="1150" y="636" font-size="17" fill="#63777b">授权民用迁移与配给</text><text x="1150" y="663" font-size="17" fill="#63777b">母子交换限流；不知蓝星坐标</text><text x="1696" y="716" font-size="12" text-anchor="end" fill="#63777b">C02 · 33</text></g><path d="M795 451H1117" fill="none" stroke="#537362" stroke-width="18" opacity=".13"/><path d="M795 451H1117" class="route-layer" fill="none" stroke="#537362" stroke-width="3.5"  marker-end="url(#S06-arrow)"/><path d="M1120 684H860V560H797" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5"  marker-end="url(#S06-arrow)"/><text x="819" y="410" font-size="18" fill="#537362">登记迁民／粮能</text><text x="818" y="729" font-size="17" fill="#548398">母子配给／净余量反馈</text><g class='place' data-key='SER-S06-05' role='button' tabindex='0' aria-label='随机低等子宇宙通道：陆澄盗太初晶融体后把婴儿小星球推向随机通道，只求逃政变。；限制：未直接选择蓝星，未知坐标不猜。'><title>随机低等子宇宙通道 · C02:21</title><circle cx="787" cy="781" r="15" fill="#b16655" stroke="#f6f4ed" stroke-width="4"/><circle cx="787" cy="781" r="23" fill="none" stroke="#b16655" stroke-width="1.5"/><text x="811" y="773" font-size="23" text-anchor="start" font-weight="650" class="node-label halo">随机低等子宇宙通道</text><text x="811" y="803" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">同层随机入口</text><text x="811" y="829" font-size="17" fill="#63777b" text-anchor="start" class="node-label halo">非选择蓝星</text></g><path d="M790 803Q680 923 569 954" class="route-layer" fill="none" stroke="#a17949" stroke-width="3.5"  marker-end="url(#S06-arrow)"/><g class='place' data-key='SER-S06-12' role='button' tabindex='0' aria-label='追查线索 ≠ 蓝星坐标：扑空后发现潜在价值；随机记录残缺，屏蔽切断特征关联。；限制：普通归墟精炼数据无法直接定位苏木。'><title>追查线索 ≠ 蓝星坐标 · C02:27</title><rect x="1130" y="860" width="660" height="137" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1144" y="875" width="6" height="29" rx="2" fill="#475f88"/><text x="1160" y="898" font-size="22" font-weight="650" class="node-label">追查线索 ≠ 蓝星坐标</text><text x="1160" y="932" font-size="17" fill="#63777b">记录残缺＋特征屏蔽 → 不能精确追踪</text><text x="1160" y="959" font-size="17" fill="#63777b">源端方位／星图／坐标不推定</text><text x="1776" y="985" font-size="12" text-anchor="end" fill="#63777b">C02 · 27</text></g><g class='place' data-key='SER-S06-06' role='button' tabindex='0' aria-label='低等宇宙长漂流：约100亿年按当地历，器灵不能稳定控制方向；晶格补给维生。；限制：生物成长停滞不让外部时间倒流。'><title>低等宇宙长漂流 · U05:24</title><path d="M126 1043Q317 897 617 1016T852 1179L815 1290L562 1268L292 1293L141 1200Z" fill="#e9eef0" stroke="#a17949" stroke-width="2" stroke-dasharray="9 7"/><text x="174" y="1092" font-size="25" font-weight="650">随机低等宇宙／长漂流</text><text x="174" y="1135" font-size="19" fill="#63777b">路径未稳定控制 · 坐标未知</text><text x="174" y="1170" font-size="19" fill="#63777b">约100亿年仅按漂流地方历</text><text x="174" y="1205" font-size="19" fill="#63777b">停滞生长／有限晶格补给／损耗</text><circle cx="700" cy="1193" r="35" fill="#f6f4ed" stroke="#7b9389" stroke-width="2"/><g transform="translate(700 1193) scale(0.36)"><path d="M0-50L35-25L42 25L0 55L-42 25L-35-25Z" fill="#475f88" fill-opacity=".16" stroke="#475f88" stroke-width="3"/><path d="M0-50V55M-35-25L42 25M35-25L-42 25M-42 25H42" fill="none" stroke="#aab6b5" stroke-width="1.5"/></g></g><g class='place' data-key='SER-S06-07' role='button' tabindex='0' aria-label='蓝星终点与沉寂：到蓝星后沉寂20多亿年，器灵缓慢恢复。；限制：不是陆澄选择的目的地，也不是器灵安排养父母身份。'><title>蓝星终点与沉寂 · U05:25</title><rect x="1010" y="1060" width="750" height="153" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1024" y="1075" width="6" height="29" rx="2" fill="#475f88"/><text x="1040" y="1098" font-size="22" font-weight="650" class="node-label">蓝星终点与沉寂</text><text x="1040" y="1132" font-size="17" fill="#63777b">蓝星：第一层低等</text><text x="1040" y="1159" font-size="17" fill="#63777b">20多亿年沉寂是蓝星附近地方历</text><text x="1746" y="1201" font-size="12" text-anchor="end" fill="#63777b">U05 · 25</text></g><path d="M841 1143Q918 1201 1010 1140" class="route-layer" fill="none" stroke="#a17949" stroke-width="3.5"  marker-end="url(#S06-arrow)"/><text x="860" y="1072" font-size="17" fill="#a17949">非定向终点</text><g class='place' data-key='SER-S06-08' role='button' tabindex='0' aria-label='苏木：蓝星收养后成长：2029解除成长停滞、置于可发现处、被收养；正常成长恢复。；限制：特征屏蔽继续；血缘不抹除蓝星养育。'><title>苏木：蓝星收养后成长 · U05:27</title><rect x="1010" y="1248" width="750" height="126" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="1024" y="1263" width="6" height="29" rx="2" fill="#475f88"/><text x="1040" y="1286" font-size="22" font-weight="650" class="node-label">苏木：蓝星收养后成长</text><text x="1040" y="1320" font-size="17" fill="#63777b">被发现后收养；养育事实不可被身世覆盖</text><text x="1746" y="1362" font-size="12" text-anchor="end" fill="#63777b">U05 · 27</text></g><g class='place' data-key='SER-S06-09' role='button' tabindex='0' aria-label='归墟 · 第一层低等：同层合格输入精炼中转与意识接入，不是虚拟游戏。；限制：蓝星与归墟均为第一层低等，不是上下层。'><title>归墟 · 第一层低等 · U06:5</title><rect x="105" y="1384" width="650" height="125" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="119" y="1399" width="6" height="29" rx="2" fill="#475f88"/><text x="135" y="1422" font-size="22" font-weight="650" class="node-label">归墟 · 第一层低等</text><text x="135" y="1456" font-size="17" fill="#63777b">第一层低等真实世界／独立网络</text><text x="741" y="1497" font-size="12" text-anchor="end" fill="#63777b">U06 · 5</text></g><g class='place' data-key='SER-S06-10' role='button' tabindex='0' aria-label='蓝星 ↔ 归墟投射链：本地身体留在蓝星，归墟真实临时物质体经双向链路行动。；限制：普通物品与背包不随退出返回；非婴儿漂流路线。'><title>蓝星 ↔ 归墟投射链 · U03:25</title><rect x="875" y="1384" width="885" height="125" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="889" y="1399" width="6" height="29" rx="2" fill="#475f88"/><text x="905" y="1422" font-size="22" font-weight="650" class="node-label">蓝星 ↔ 归墟投射链</text><text x="905" y="1456" font-size="17" fill="#63777b">蓝星保留本地身体 ↔ 归墟真实临时物质体</text><text x="905" y="1483" font-size="17" fill="#63777b">双向回传经历／限额能量；退出不带物</text><text x="1746" y="1497" font-size="12" text-anchor="end" fill="#63777b">U03 · 25</text></g><path d="M1370 1375V1384" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S06-arrow)"/><path d="M875 1445H755" class="system-layer" fill="none" stroke="#475f88" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S06-arrow)"/><g class='place' data-key='SER-S06-11' role='button' tabindex='0' aria-label='囚域维生交接 → 康复载体：先接可持续康复载体及合法安置点，再解除旧囚域连接。；限制：其他囚禁者不能留在断供设施；自由不消除损伤。'><title>囚域维生交接 → 康复载体 · C02:43</title><rect x="110" y="1555" width="1650" height="130" rx="12" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><rect x="124" y="1570" width="6" height="29" rx="2" fill="#475f88"/><text x="140" y="1593" font-size="22" font-weight="650" class="node-label">囚域维生交接 → 康复载体</text><text x="140" y="1627" font-size="17" fill="#63777b">囚域稳定维生 → 连续康复载体 → 合法安置 → 最后解离旧链</text><text x="140" y="1654" font-size="17" fill="#63777b">迁移维生与撤离设施共同完成；不是强断救治或一家独自远行</text><text x="1746" y="1673" font-size="12" text-anchor="end" fill="#63777b">C02 · 43</text></g><path d="M256 589H95V1538H590V1555" class="route-layer" fill="none" stroke="#548398" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#S06-arrow)"/><line x1="65" y1="1720" x2="1835" y2="1720" stroke="#aab6b5"/><text x="65" y="1753" font-size="17" fill="#63777b">漂流、蓝星沉寂、母界纪元不得线性加成共同公历；坐标与距离不定，不用曲线长度推航时。</text><text x="65" y="1781" font-size="17" fill="#63777b">依据 C02《陆离、生父生母与政变真相》；C01「家族与公共能量治理」；U05「从宝库到成年认证」；U03「实体旅行与意识投射」。</text><rect x="65" y="1820" width="12" height="5" fill="#f6f4ed"/><rect x="82" y="1820" width="12" height="5" fill="#e9eef0"/><rect x="99" y="1820" width="12" height="5" fill="#e7e9db"/><rect x="116" y="1820" width="12" height="5" fill="#253e44"/><rect x="133" y="1820" width="12" height="5" fill="#63777b"/><rect x="150" y="1820" width="12" height="5" fill="#aab6b5"/><rect x="167" y="1820" width="12" height="5" fill="#7b9389"/><rect x="184" y="1820" width="12" height="5" fill="#548398"/><rect x="201" y="1820" width="12" height="5" fill="#73876a"/><rect x="218" y="1820" width="12" height="5" fill="#537362"/><rect x="235" y="1820" width="12" height="5" fill="#a17949"/><rect x="252" y="1820" width="12" height="5" fill="#b16655"/><rect x="269" y="1820" width="12" height="5" fill="#475f88"/><rect x="286" y="1820" width="12" height="5" fill="#ffffff"/><text x="1835" y="1825" font-size="14" text-anchor="end" fill="#63777b">S06 · 系列独立图册 / 拓扑非比例</text></svg>