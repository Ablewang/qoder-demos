<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1600" viewBox="0 0 1900 1600" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#73876a" opacity=".14"/></pattern></defs><rect x="0" y="0" width="1900" height="1600" fill="#f6f4ed"/><text x="65" y="64" font-size="34" font-weight="700">第一部 · 苏木九个月双侧路线与七高潮</text><text x="65" y="106" font-size="18" fill="#63777b">实线为本侧人员 / 物资交通；蓝色虚线只表示授权接入与数据协同，不能把普通物品运过世界边界</text><text x="1825" y="63" font-size="26" text-anchor="end" fill="#a17949">07</text><line x1="65" y1="127" x2="1835" y2="127" stroke="#aab6b5"/> <text x="160" y="184" font-size="24" font-weight="600">蓝星：现实身体、培养、调查与执行</text><text x="1010" y="184" font-size="24" font-weight="600">澄岚：临时物质身体、道路与居民生活</text><rect x="120" y="222" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="222" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="263" font-size="22" font-weight="700" text-anchor="middle">月一</text><g class="place" data-key="B04" role="button" tabindex="0"><text x="143" y="256" font-size="20" >临江预检 / 太平洋公众测试 → 宁川训练</text></g><g class="place" data-key="C01" role="button" tabindex="0"><text x="1003" y="256" font-size="20" >初渡台 → 初渡采样道 → 90 km粮运 → 栖衡</text></g><text x="143" y="300" font-size="17" fill="#63777b">① 认证保索引 / 初渡驿路与工坊初识</text><g class="system-layer"><path d="M860 279H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 333V359" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 333V359" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="359" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="359" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="400" font-size="22" font-weight="700" text-anchor="middle">月二</text><g class="place" data-key="B01" role="button" tabindex="0"><text x="143" y="393" font-size="20" >宁川 ↔ 临江旧站 / 窄段救援 → 医院恢复</text></g><g class="place" data-key="C07" role="button" tabindex="0"><text x="1003" y="393" font-size="20" >不插即时换图；先治疗、复核与责任说明</text></g><text x="143" y="437" font-size="17" fill="#63777b">② 救受害者，舍部分父亲公司材料</text><g class="system-layer"><path d="M860 416H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 470V496" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 470V496" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="496" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="496" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="537" font-size="22" font-weight="700" text-anchor="middle">月三</text><g class="place" data-key="B01" role="button" tabindex="0"><text x="143" y="530" font-size="20" >临江警方 / 医疗副本 / 独立保全交接</text></g><g class="place" data-key="C15" role="button" tabindex="0"><text x="1003" y="530" font-size="20" >栖衡工坊 ↔ 赤脊 / 鸣骨矿廊 / 旧驮道勘图</text></g><text x="143" y="574" font-size="17" fill="#63777b">③ 护证与救失联队；学分锚索工艺</text><g class="system-layer"><path d="M860 553H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 607V633" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 607V633" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="633" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="633" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="674" font-size="22" font-weight="700" text-anchor="middle">月四</text><g class="place" data-key="K01" role="button" tabindex="0"><text x="143" y="667" font-size="20" >西宁备案体评 → 山地实运 → 昆仑校验</text></g><g class="place" data-key="C32" role="button" tabindex="0"><text x="1003" y="667" font-size="20" >栖衡维护合同 / 镜井本地支路核验</text></g><text x="143" y="711" font-size="17" fill="#63777b">③ 母亲本人回应；不承诺恢复旧家庭</text><g class="system-layer"><path d="M860 690H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 744V770" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 744V770" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="770" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="770" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="811" font-size="22" font-weight="700" text-anchor="middle">月五</text><g class="place" data-key="K01" role="button" tabindex="0"><text x="143" y="804" font-size="20" >现实配套件另采购加工 / 昆仑监督减载</text></g><g class="place" data-key="C25" role="button" tabindex="0"><text x="1003" y="804" font-size="20" >赤脊采材 → 栖衡中转 → 120 km联运 → 雾汀</text></g><text x="143" y="848" font-size="17" fill="#63777b">④ 先东送母亲锚件，民用先行工序失约</text><g class="system-layer"><path d="M860 827H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 881V907" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 881V907" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="907" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="907" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="948" font-size="22" font-weight="700" text-anchor="middle">月六</text><g class="place" data-key="B01" role="button" tabindex="0"><text x="143" y="941" font-size="20" >临江 / 昆仑过载救治；木苏停共鸣</text></g><g class="place" data-key="C26" role="button" tabindex="0"><text x="1003" y="941" font-size="20" >雾汀短段撤出 → 照潮检伤 → 联运栖衡安置</text></g><text x="143" y="985" font-size="17" fill="#63777b">④ 居民撤离成功，双侧模型不足伤母妹</text><g class="system-layer"><path d="M860 964H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 1018V1044" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 1018V1044" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="1044" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="1044" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="1085" font-size="22" font-weight="700" text-anchor="middle">月七</text><g class="place" data-key="B02" role="button" tabindex="0"><text x="143" y="1078" font-size="20" >公开失败 / 宁川异地审批原件依法护交接</text></g><g class="place" data-key="C18" role="button" tabindex="0"><text x="1003" y="1078" font-size="20" >拒永久置换 → 拆分模块 → 测载绕行、复装接替</text></g><text x="143" y="1122" font-size="17" fill="#63777b">⑤ 有限民用边站复开，全道尚未畅通</text><g class="system-layer"><path d="M860 1101H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 1155V1181" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 1155V1181" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="1181" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="1181" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="1222" font-size="22" font-weight="700" text-anchor="middle">月八</text><g class="place" data-key="B05" role="button" tabindex="0"><text x="143" y="1215" font-size="20" >专业实运抵南极 → 空旧试接端 → 接公共中继</text></g><g class="place" data-key="C32" role="button" tabindex="0"><text x="1003" y="1215" font-size="20" >先保栖衡—镜井道路；赫安守入口、岑禾守民路</text></g><text x="143" y="1259" font-size="17" fill="#63777b">⑥ 苏木在现实接点协作；维修队接线、军方应急</text><g class="system-layer"><path d="M860 1238H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M850 1292V1318" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="route-layer"><path d="M990 1292V1318" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><rect x="120" y="1318" width="740" height="111" rx="8" fill="#e9eef0" stroke="#aab6b5"/><rect x="980" y="1318" width="810" height="111" rx="8" fill="#e7e9db" stroke="#aab6b5"/><text x="72" y="1359" font-size="22" font-weight="700" text-anchor="middle">月九</text><g class="place" data-key="K01" role="button" tabindex="0"><text x="143" y="1352" font-size="20" >分阶段转运至昆仑 / 预装压测 → 脱离 → 康复</text></g><g class="place" data-key="C10" role="button" tabindex="0"><text x="1003" y="1352" font-size="20" >苏木同区授权重登镜井 → 分段交接 → 栖衡换图</text></g><text x="143" y="1396" font-size="17" fill="#63777b">⑦ 先冗余后解除；末尾经雾汀正常渡次赴照潮</text><g class="system-layer"><path d="M860 1375H980" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><line x1="65" y1="1475" x2="1835" y2="1475" stroke="#aab6b5"/><text x="65" y="1509" font-size="16" >月段图不是每日同时在两侧两处实体建筑：南极之后到昆仑保留专业交通和交接工期；投射仍需照料现实身体，重登不替代六区内迁址。</text><text x="65" y="1536" font-size="16" >依据：五幕九个月时间轴及七高潮；人工岛局部归航成果属顾衡方案证据，不新增苏木月七赴岛冒险。全部C01—C50场所见08—13。</text></svg>