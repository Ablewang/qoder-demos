<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1500" viewBox="0 0 1900 1500" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#253e44"><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14L14 0" stroke="#73876a" opacity=".14"/></pattern></defs><rect x="0" y="0" width="1900" height="1500" fill="#f6f4ed"/><text x="65" y="64" font-size="34" font-weight="700">昆仑 · 实际维护驻区、原接口与退出工程</text><text x="65" y="106" font-size="18" fill="#63777b">月四本人回应 / 月九先冗余后解除；家族接近资格、技术认证、公共执行许可彼此不能代替</text><text x="1825" y="63" font-size="26" text-anchor="end" fill="#a17949">16</text><line x1="65" y1="127" x2="1835" y2="127" stroke="#aab6b5"/> <rect x="85" y="175" width="1730" height="615" fill="#e7e9db" stroke="#aab6b5"/><path d="M360 500L480 200L600 500M420 350L480 362L520 300" fill="#73876a" fill-opacity=".08" stroke="#73876a"/><path d="M625 415L760 135L895 415M692.5 275L760 287L805 228.33333333333334" fill="#73876a" fill-opacity=".08" stroke="#73876a"/><path d="M895 525L1050 215L1205 525M972.5 370L1050 382L1101.6666666666667 318.3333333333333" fill="#73876a" fill-opacity=".08" stroke="#73876a"/><path d="M1260 455L1440 195L1620 455M1350 325L1440 337L1500 281.6666666666667" fill="#73876a" fill-opacity=".08" stroke="#73876a"/><g class="route-layer"><path d="M105 700H390Q555 680 650 568T920 592Q1160 620 1390 555" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><g class="place" data-key="B03" role="button" tabindex="0"><title>西宁中转 / 高原适应 备案、体评、物资补给</title><rect x="125" y="515" width="315" height="140" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M125 515l157.5 -24l157.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="282.5" y="558" font-size="21" text-anchor="middle" font-weight="600">西宁中转 / 高原适应</text><text x="282.5" y="589" font-size="15" text-anchor="middle" fill="#63777b">备案、体评、物资补给</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>公路站 / 科研外围 山地道路真实实运</title><rect x="565" y="405" width="325" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M565 405l162.5 -24l162.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="727.5" y="448" font-size="21" text-anchor="middle" font-weight="600">公路站 / 科研外围</text><text x="727.5" y="479" font-size="15" text-anchor="middle" fill="#63777b">山地道路真实实运</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>家族驻地 / 接应记录 救援者与限制退出者分开</title><rect x="1000" y="505" width="340" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1000 505l170 -24l170 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1170" y="548" font-size="21" text-anchor="middle" font-weight="600">家族驻地 / 接应记录</text><text x="1170" y="579" font-size="15" text-anchor="middle" fill="#63777b">救援者与限制退出者分开</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>受控维护核心 核容量、分项许可</title><rect x="1440" y="465" width="320" height="140" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M1440 465l160 -24l160 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="1600" y="508" font-size="21" text-anchor="middle" font-weight="600">受控维护核心</text><text x="1600" y="539" font-size="15" text-anchor="middle" fill="#63777b">核容量、分项许可</text></g></g><text x="95" y="827" font-size="24" font-weight="600">局部功能剖面：支路缓冲与原人体接口，不是全蓝星承载者</text><rect x="85" y="867" width="1730" height="395" fill="#e9eef0" stroke="#aab6b5"/><g class="place" data-key="K01" role="button" tabindex="0"><title>独立记录 / 监测席 本人意见与模型互证</title><rect x="115" y="928" width="325" height="135" rx="4" fill="#e7e9db" stroke="#7b9389" stroke-width="2"/><path d="M115 928l162.5 -24l162.5 24" fill="#73876a" fill-opacity=".16" stroke="#7b9389"/><g class="node-label"><text x="277.5" y="971" font-size="21" text-anchor="middle" font-weight="600">独立记录 / 监测席</text><text x="277.5" y="1002" font-size="15" text-anchor="middle" fill="#63777b">本人意见与模型互证</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>旧接口受控单元 木向岚有限自愿反馈</title><rect x="520" y="928" width="325" height="135" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="682.5" cy="995.5" r="40.5" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="682.5" y="971" font-size="21" text-anchor="middle" font-weight="600">旧接口受控单元</text><text x="682.5" y="1002" font-size="15" text-anchor="middle" fill="#63777b">木向岚有限自愿反馈</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>备用锚阵 / 材料段 现实采购、安装、压测</title><rect x="930" y="928" width="370" height="135" rx="38" fill="#e9eef0" stroke="#475f88" stroke-width="2"/><circle cx="1115" cy="995.5" r="40.5" fill="none" stroke="#475f88" stroke-width="2"/><g class="node-label"><text x="1115" y="971" font-size="21" text-anchor="middle" font-weight="600">备用锚阵 / 材料段</text><text x="1115" y="1002" font-size="15" text-anchor="middle" fill="#63777b">现实采购、安装、压测</text></g></g><g class="place" data-key="K01" role="button" tabindex="0"><title>隔离与医疗撤出 脱离后独立康复</title><rect x="1385" y="928" width="385" height="135" rx="24" fill="#e9eef0" stroke="#548398" stroke-width="2"/><line x1="1400" y1="992.8" x2="1755" y2="992.8" stroke="#548398" stroke-dasharray="12 9"/><g class="node-label"><text x="1577.5" y="971" font-size="21" text-anchor="middle" font-weight="600">隔离与医疗撤出</text><text x="1577.5" y="1002" font-size="15" text-anchor="middle" fill="#63777b">脱离后独立康复</text></g></g><g class="system-layer"><path d="M440 995H520" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="system-layer"><path d="M845 995H930" fill="none" stroke="#475f88" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#end)"/></g><g class="route-layer"><path d="M1300 995H1385" fill="none" stroke="#537362" stroke-width="3"  marker-end="url(#end)"/></g><line x1="110" y1="1120" x2="1770" y2="1120" stroke="#7b9389" stroke-width="4"/><text x="120" y="1164" font-size="20" >① 公开风险与中止权      ② 材料备用先验证      ③ 小段转移后确认减载      ④ 分段解除 → 医疗</text><text x="120" y="1204" font-size="20" >人身反馈不是设备备用容量；木苏月六停用、月七拒绝后，后续由成年测员和材料模拟接替。</text><text x="95" y="1310" font-size="19" >蓝色虚线是负荷 / 监测，不是人的步行路线。主角分阶段来昆仑，南极与镜井由联合人员各守本侧，不画同时在三地的实体苏木。</text><line x1="65" y1="1395" x2="1835" y2="1395" stroke="#aab6b5"/><text x="65" y="1429" font-size="16" >来源：蓝星地理的现实地点表、镜井撤离工程、七高潮之昆仑辨认与母亲退出。建筑和接口为示意，核心坐标未定。</text><text x="65" y="1456" font-size="16" >非人体备用不足时先补建或安全迁移已有负荷，复验后才退出；其他人不计作备用容量。</text></svg>