	<h2>女王采购</h2>
	<div class="detail">
		<p>　　<strong>活动时间：</strong>12月19日-12月25日</p>
        <p>　　<strong>活动说明：</strong>圣诞老人发放任务，任务为随机四选一，四个任务对应四个女王的购物需求，玩家此时得到四张百货商店兑换券，可用此券去找企鹅乐园百货公司商人处兑换百宝箱，从中开出所需物品，也可直接在企鹅乐园百货公司商人处购买。</p>
        <p>　　<strong>活动规则：</strong></p>
        <p>　　1.角色到达30级以上(含30级)的所有玩家可参加"女王采购"任务活动。</p>
        <p>　　2.完成该任务可获得时限30分钟黄金护身符和部分经验奖励。</p>
        <p>　　3.任务中出现的女王所需物品可以交易，促进玩家之间交流。</p>
