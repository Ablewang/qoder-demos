	<h2>线上活动时间表</h2>
	<div class="detail">
		<p>　　活动时间：每周日18:00开启（部分服务器可能会有延迟）</p>
        <p>　　参与方法：点击游戏界面右上角小地图旁边的"IE"按钮，再点击"完美电台"即可打开完美电台收听活动主持人的声音，届时可以跟随电台主持人的指引去完成任务获得电台活动纪念勋章，持此道具可以在电台活动大使处兑换奖励。</p>
        <p>　　想要获得电台活动纪念勋章，请在活动时间内登录游戏打开电台并跟随电台活动主持人的播报引导去完成任务，即可获得。</p>
        <p>　　可兑换的奖励包括：</p>
        <p>　　固定奖励：500万血符（限时1小时）、经验、元神、声望。</p>
        <p>　　惊喜奖励：个别任务中还会额外获得：限时飘花特效、限时跳舞时装、烟花等。</p>
