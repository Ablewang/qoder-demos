<script type="text/javascript">
function checkW(){
	var pageWidth = document.documentElement.clientWidth || document.body.clientWidth;
	if(pageWidth >= 1650){
		return true;
	}else{
		return false;
	}
}
$(function(){
	$('#cont img').css('opacity',.5).live({
		mouseover : function(){
						$(this).css('opacity',1);
					},
		mouseout : function(){
						$(this).css('opacity',.5);
					}
	});
	if(!checkW()){
		$('#btn_left,#btn_right').show();
		lrAuto('cont', 'btn_left', 'btn_right', 450);
	}else{
		$('#btn_left,#btn_right').hide();
	}
});
window.onresize = function(){
	if(checkW()){
		$('#btn_left,#btn_right').hide();
	}else{
		$('#btn_left,#btn_right').show();
		lrAuto('cont', 'btn_left', 'btn_right', 450);
