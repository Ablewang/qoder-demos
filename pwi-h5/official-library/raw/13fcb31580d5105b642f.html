    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <!--css引入-->
    <link href="./css/article-detail.css?v=1732264055804" rel="stylesheet" type="text/css"/>

<body data-name="article-detail">
    <!--头部栏-->
    <div class="header-bar">
        <div class="content-panel">
            <div class="left-panel">
                <a href="https://w2i.wanmei.com" class="logo null">完美国际</a>
                <a href="https://w2i.wanmei.com" class="home-btn null">官网</a>
                <a href="./index.html" class="strategy-btn null">攻略站</a>
            </div>
            <div class="right-panel">
                <div class="login-after hide">
                    <a href="javascript:;" class="link">
                        <img/>
                        <span></span>
                    </a>
                    <a href="javascript:;" class="logout-btn null">登出</a>
                </div>
                <a href="javascript:;" class="login-btn null hide">登录</a>
            </div>
        </div>
    </div>
    <!--页面内容-->
     <div class="page-container">
         <div class="left-board">
             <div class="article-panel">
                 <div class="header-panel">
                     <div class="title-panel"></div>
                     <div class="time-panel">
                         <div class="item">
                             <span class="tag">文章发表</span>
                             <span class="time" data-time="create"></span>
                         </div>
                         <div class="item">
                             <span class="tag">最后编辑</span>
                             <span class="time" data-time="update"></span>
                         </div>
                     </div>
                 </div>
                 <div class="content-panel"></div>
                 <div class="tips-panel">已开启创作声明，禁止转载和编辑</div>
             </div>
         </div>
         <div class="right-board">
             <a class="author-panel">
                 <img class="avatar"/>
                 <span class="name"></span>
             </a>
             <dl class="recommend-panel hide gonggao" data-name="gonggao">
                 <dt>
                     <span>系统公告</span>
                     <div class="btn-panel">
                         <a href="javascript:;" class="btn null" data-type="prev">prev</a>
                         <a href="javascript:;" class="btn null" data-type="next">next</a>
                     </div>
                 </dt>
                 <dd></dd>
             </dl>
             <dl class="recommend-panel hide gonglue" data-name="gonglue">
                 <dt>
                     <span>优秀攻略</span>
                     <div class="btn-panel">
                         <a href="javascript:;" class="btn null" data-type="prev">prev</a>
                         <a href="javascript:;" class="btn null" data-type="next">next</a>
                     </div>
                 </dt>
                 <dd></dd>
             </dl>
             <div class="qrcode-panel clear hide">
                 <script type="text/template" data-temp="qrcodeItemTemp">
                     <div class="item">
                         <div class="qrcode">
                             <img src="{{img}}"/>
                         </div>
                         <div class="name">
                             <span>{{title}}</span>
                         </div>
                     </div>
                 </script>
             </div>
         </div>
     </div> 
    <script type="text/javascript" src="./js/lib/jquery.min.js"></script>
    <script type="text/javascript" src="./js/lib/tjsdk-min-1.5.3.js"></script>
    <script type="text/javascript" src="./js/lib/stat.js"></script>
    <script type="text/javascript" src="./js/lib/login.js?v=1732264055804"></script>
    <script type="text/javascript" src="./js/lib/lazyload.js?v=1732264055804"></script>
    <script type="text/javascript" src="./js/lib/emotion.json.js?v=1732264055804"></script>
    <script type="text/javascript" src="./js/lib/purify.min.js?v=1732264055804"></script>
    <script type="text/javascript" src="./js/public-plugin.js?v=1732264055804"></script>
    <script type="text/javascript" src="./js/header-bar.js?v=1732264055804"></script>
    <script type="text/javascript">
        window.GLOBAL_DATA = {
            domain : 'https://pwgcapi.wanmei.com',
            circleId: 56
        }
    </script> 
    <!-- 探数 -->
    <script type="text/javascript">
        //初始化打点
        var myAnaly = new webSdk();
        myAnaly.initSDK({
            project: "laohuapp",
            linkHost: "https://clog.tanshudata.com",
            withAppJsBridge: false
        });
        myAnaly.pageVisted();
    </script>

    <script type="text/javascript" src="./js/article-detail.js?v=1732264055804"></script>
    
</body>
</html>
