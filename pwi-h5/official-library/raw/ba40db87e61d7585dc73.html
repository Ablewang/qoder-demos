                      <td class="heigh24"> 　　
                        首先玩家跑路来到踏箭山庄，寻找NPC独孤可夫斯基（427，457），在那里领取初始任务----独闯新月谷。要完成此任务必须组队（2人以上即可）通过多人模式进入神月谷击杀一定数量的相应怪物，怪物分别位于神月内的巫月谷和玄月谷。而在副本内每进入下一谷之前都必须击杀当前谷内BOSS。<br />
                        <p>　　当成功击杀足够数量的怪物后，便可回到踏箭山庄独孤可夫斯基处交任务----独闯神月谷。单人模式成功开启。啊，说了这么半天没说神月谷在哪里？到踏箭山庄的NPC“飞天”处可以领取“天空之城”的任务，通过该任务可以直接飞往踏箭山庄顶部“佛陀顶”。而玩家向往已久的神月谷就位于佛陀顶内。 </p>
