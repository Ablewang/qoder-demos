                <p><strong>元素精灵如何使用技能？</strong></p>
                <p>　　1、元素精灵每秒可以放一个技能，单个技能有自己的冷却时间。</p>
                <p>　　2、元素精灵释放技能的同时人物也可以释放技能。</p>
                <p>　　3、元素精灵的部分技能有特殊限制。如果未能满足技能需求则元素精灵的这个技能不可使用。</p>
                <p>　　4、如果元素精灵的天赋点被洗掉，导致天赋点不再满足技能学习要求，则技能无法使用。</p>
                <p>　　5、释放技能有2部分消耗，第一是元素精灵的能量（能量是按时间自动回复的），第二部分是元素精灵的体力。</p>
