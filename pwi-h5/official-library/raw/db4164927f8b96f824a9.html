            <td align="left"><p><span class="font01">1）什么是魔方</span><br class="font01" />
                <span class="css">《完美世界国际版》中最新推出的一个副本任务，玩家在副本中闯关，最后到达终点领取丰厚的经验、元神奖励，还有额外的神秘筹码。</span></p>
              <p class="css"><span class="font01">2）魔方流程</span><br />
                I．使用“骰子兑换卷”和“命运魔方“换取骰子；<br />
                II．根据骰子点数，将玩家传送到相对应点数的房间进行闯关；<br />
                III．玩家得到的骰子点数越大，闯关的速度也就越快；<br />
                IV．魔方中含有23种玩法，它们随机出现在魔方的50个房间内；<br />
                V．玩家到达第50个房间（命运终点）后，就可以领取丰厚的经验、元神奖励。<br />
                VI．在魔方的15、22、31、42号“神秘使者”房间中，可以通过任务获得神秘筹码，用来换取黄金铸具和黄昏材料。</p></td>
