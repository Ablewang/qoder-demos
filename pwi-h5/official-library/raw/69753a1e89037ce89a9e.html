                                           <h2>进入活动</h2>
                                            <p class="text">　　每周二20:30以后玩家可以在祖龙城中的“遗迹寻宝人”处领取进入丛林遗迹的任务。（21点以后进入将无法领取竞速任务，22:30活动结束）<br />
　　通过遗迹寻宝人可以在活动时进入丛林遗迹，他们分别位于以下三个位置：<br />
　　祖龙城西北部清凉寨主附近；<br />
　　祖龙城东北部师良附近；<br />
　　祖龙城东南祖龙地产官员附近。
											</p>
                                            <h2>活动内容</h2>
                                            <p class="text">　　进入遗迹后向遗迹内的NPC领取各项任务，任务共有三大类，分别是竞速任务、幸运任务和收集徽章碎片任务，所有任务只能完成1次，最终目的是达到遗迹的终点——曙光大厅西侧的小房间内。
只要在规定的时间内到达终点，即有各种丰富奖励等着你！还不快快行动？
                                            </p>
