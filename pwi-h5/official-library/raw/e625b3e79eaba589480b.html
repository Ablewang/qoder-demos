	<h2>怪物攻城</h2>
	<div class="detail">
		<p>　　<strong>活动时间：</strong>12月19日-12月25日每天20:00开始</p>
        <p>　　<strong>活动说明：</strong>每天20:00开始会在企鹅乐园附近刷新一定数量的捣乱的雪怪。玩家可以去击杀捣乱的雪怪获得奖励。玩家击杀雪怪达到指定数量后即判定区域内玩家完成任务，与圣诞精灵对话可得到奖励完美抽奖券。</p>
        <p>　　<strong>活动规则：</strong></p>
        <p>　　1.角色到达30级以上(含30级)的所有玩家可参加"怪物攻城"任务活动；</p>
        <p>　　2.任务"怪物攻城"为公共任务，每日定点刷新开启。</p>
        <p>　　3.当玩家在规定时间内击杀雪怪达到500个后，区域任务完成，只要是击杀两只怪以上的玩家均可获得时限30分钟的黄金守神符一个和部分经验奖励。</p>
	</div>
