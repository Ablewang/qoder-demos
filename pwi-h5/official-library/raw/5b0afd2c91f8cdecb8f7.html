	<h2>灵机一问</h2>
	<div class="detail">
		<p>　　活动时间：1月1日-1月3日</p>
        <p>　　活动介绍：活动期间每天20:00左右开启，20级以上的玩家可以找到灵机右使&#8226;恰克（20-59级）或灵机左使&#8226;皮克（60级以上）回答有关《完美世界国际版》的问题，答对即可获得丰厚奖励。</p>
        <p>　　特别提示：本活动每个账号每天限量完成15次。活动将在每天20:00左右开启，届时请随时关注。</p>
        <p>　　活动奖励：不同等级的玩家参与"灵机一问"活动后将获得经验、元神及灵机小匣奖励。灵机小匣内含多种物品，打开后将随机获得灵机散、灵犀丸、梦幻果、神秘筹码、天工符文、神秘筹码包、波波鸟宝宝宠物蛋、红松鼠宝宝宠物蛋、红蝴蝶宝宝宠物蛋等物品其中之一。</p>
