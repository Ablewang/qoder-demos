		//ff
		addSWF('show.swf?'+Math.random(),'flashContent','100%','100%',{wmode:'window',xml:"xml/options.xml"});
	}
	function swfEventHandler(id,eventId){
		if(id=="flashContent"){
			//alert(eventId);
			switch(eventId){
				case "load":
					resizeDelay();
				break;
			}
		}
	}
	
	var timeoutId=-1;
	
	function resizeDelay(){
		window.onresize=null;
		clearTimeout(timeoutId);
		timeoutId=setTimeout("resize()",50);
	}
	function resize(){
		window.onresize=null;
		clearTimeout(timeoutId);
		timeoutId=setTimeout("addResizeEvent()",50);
		//var hei=document.body.clientHeight;
		var hei=document.documentElement.clientHeight;
		//alert("hei="+hei);
		if(hei<750){
			hei=750;
		}
		//hei-=19;//减去顶部高度
		var swf=document.getElementById("flashContent");
		swf.style.height=hei;
		if(swf.style.height){
		}else{
			swf.height=hei;
		}
		//alert("swf.style.height="+swf.style.height);
	}
	function addResizeEvent(){
		clearTimeout(timeoutId);
		window.onresize=resizeDelay;
	}
	
	function URLrefresh(){
		window.location.reload();
	}
</script>
