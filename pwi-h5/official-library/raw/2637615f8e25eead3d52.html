<script type="text/ecmascript">
	var heightN = document.documentElement.clientHeight - (41+95);
	$('.flashbox').css('height',heightN+'px');
	//addSWF('/show1309/zhanshi.swf', 'flashbox', '100%', 701,{xml:'/xml/show_options1309.xml'});

	addSWF('/show1309/zhanshi.swf','flashbox',1,1,{
		//wmode:'window',//ie下点击跳页可能会被拦截
		wmode:'opaque',//ff下鼠标滚轮会失效
		xml:"/xml/show_options1309.xml",
		bgcolor : '#000'
	});
	
	function swfEventHandler(id,eventId){
		if(id=="flashbox"){
			//alert(eventId);
			switch(eventId){
				case "load":
				
				
					resizeDelay();
				break;
			}
		}
	}
	
	var timeoutId=-1;
	
	function resizeDelay(){
		window.onresize=null;
		clearTimeout(timeoutId);
		timeoutId=setTimeout("resize()",50);
	}
	function resize(){
		
		window.onresize=null;
		clearTimeout(timeoutId);
		timeoutId=setTimeout("addResizeEvent()",50);
		
		var wid=document.documentElement.clientWidth;
		if(wid<1002){//如果页面宽度小于最小宽度
			wid=1002;
			document.body.style.overflowX="visible";
		}else{
			document.body.style.overflowX="hidden";
		}
		
		var hei=document.documentElement.clientHeight;
		//alert("hei="+hei);
		if(hei<800){//如果页面高度小于最小高度
			hei=800;
			document.body.style.overflowY="visible";
		}else{
			document.body.style.overflowY="hidden";
		}
		hei-=41;//减去顶部高度
		hei-=95;//减去底部高度
		var swf=document.getElementById("flashbox");
		
		swf.style.width=wid;//ie
		if(swf.style.width){
		}else{
			swf.width=wid;//ff
		}
		$('.flashbox').css('height',hei+'px');
		swf.style.height=hei;//ie
		if(swf.style.height){
		}else{
			swf.height=hei;//ff
		}
	}
	function addResizeEvent(){
		clearTimeout(timeoutId);
		window.onresize=resizeDelay;
	}
	
		
	wm.fastreg({
	  box: 'fastreg', 
	  game: 'w2i', 
	  css: 1,
	  card : 'GJCWNMIDYJFUM5'
	});
	function showReg(){
		$('.reg_box').show();
	}
	function closeReg(){
		$('.reg_box').hide();
	}
	$('.icon_close').click(function(){
		closeReg();
	});
</script>
