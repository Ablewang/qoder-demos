<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var saved = (JSON.parse(localStorage.getItem('lumi:v1') || 'null') || {}).theme
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (error) { document.documentElement.dataset.theme = 'light' }
    </script>
    <meta name="description" content="Lumi 生活助手：穿搭、吃饭、住宿、出行和本地清单。使用模拟数据。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f1f1f'/%3E%3Cpath d='M22 17v30h25' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='43' cy='21' r='5' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Lumi · 生活助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
